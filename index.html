e01:{v:"Öl oder Ghee, 1 TL Kurkuma, 1 TL Kreuzkümmel (Samen oder gemahlen), 1 TL Garam Masala, Salz, evtl. Chili und frischer Koriander",s:[
"Basmatireis in einem Sieb waschen, bis das Wasser klar bleibt, und nach Packungsangabe kochen.",
"Linsen abspülen und mit 700 ml Wasser und Kurkuma in einem Topf aufkochen. Schaum abschöpfen und bei kleiner Hitze ca. 15 Min. köcheln, bis die Linsen zerfallen. Gelegentlich umrühren, bei Bedarf Wasser nachgießen.",
"Zwiebel, Knoblauch und Ingwer schälen und sehr fein hacken.",
"Für das Tadka in einer Pfanne 2 EL Öl erhitzen. Kreuzkümmel darin 30 Sek. rösten, bis er duftet.",
"Zwiebel dazugeben und 5 Min. goldbraun braten. Knoblauch und Ingwer 1 Min. mitbraten. Garam Masala und Tomaten dazugeben und 5 Min. köcheln.",
"Die Tomatenmischung unter die Linsen rühren und mit Salz abschmecken. Das Dal sollte cremig, aber nicht zu dick sein.",
"Mit Reis und Joghurt servieren. Chili und Koriander erst am Tisch für die Erwachsenen."]},
e02:{v:"Öl, 2 TL Garam Masala, 1 TL Kreuzkümmel, ½ TL Kurkuma, 1 TL Paprikapulver, Salz, Zitronensaft, evtl. Chili",s:[
"Zwiebeln schälen und fein würfeln. Knoblauch und Ingwer fein hacken oder reiben. Kichererbsen abspülen.",
"In einem großen Topf 2 EL Öl erhitzen. Zwiebeln bei mittlerer Hitze 6–8 Min. goldbraun braten – das gibt den Geschmack.",
"Knoblauch und Ingwer dazugeben und 1 Min. mitbraten.",
"Gewürze dazugeben und unter Rühren 30 Sek. rösten, bis sie duften.",
"Tomaten und Kichererbsen dazugeben, mit 100 ml Wasser aufgießen und ca. 15 Min. köcheln. Ein paar Kichererbsen mit dem Löffel am Topfrand zerdrücken, das bindet die Sauce.",
"Spinat unterheben, bis er zusammenfällt. Mit Salz und Zitronensaft abschmecken.",
"Naan im Ofen bei 180 °C 3–4 Min. aufbacken und dazu servieren."]},
e03:{v:"Butter, 2 TL Garam Masala, 1 TL Paprikapulver, Salz, 1 TL Zucker, evtl. Kurkuma",s:[
"Hähnchen in mundgerechte Stücke schneiden. Mit Joghurt, 1 TL Garam Masala, Paprikapulver und ½ TL Salz mischen und mindestens 10 Min. marinieren (gern auch länger im Kühlschrank).",
"Basmatireis waschen und nach Packungsangabe kochen.",
"Zwiebel, Knoblauch und Ingwer sehr fein hacken.",
"In einer großen Pfanne 1 EL Butter erhitzen. Hähnchen (mit der anhaftenden Marinade) portionsweise 3–4 Min. rundum anbraten und herausnehmen.",
"In derselben Pfanne 1 EL Butter erhitzen, Zwiebel 4 Min. weich dünsten, Knoblauch und Ingwer 1 Min. mitdünsten. 1 TL Garam Masala kurz mitrösten.",
"Passierte Tomaten und 1 TL Zucker dazugeben und 10 Min. köcheln. Nach Wunsch fein pürieren.",
"Sahne einrühren, Hähnchen zurückgeben und 5 Min. köcheln, bis es durchgegart ist. Mit Salz abschmecken und mit Reis servieren."]},
e04:{v:"Öl oder Ghee, 1 TL Garam Masala, ½ TL Kreuzkümmel, ½ TL Kurkuma, Salz, evtl. Zitronensaft",s:[
"Spinat auftauen lassen.",
"Basmatireis waschen und nach Packungsangabe kochen.",
"Paneer in 2 cm große Würfel schneiden. In einer Pfanne 2 EL Öl erhitzen und die Würfel rundum goldbraun braten. Herausnehmen.",
"Zwiebel, Knoblauch und Ingwer sehr fein hacken und im selben Fett 4–5 Min. andünsten.",
"Gewürze dazugeben und 30 Sek. rösten.",
"Spinat mit 100 ml Wasser dazugeben, erhitzen und mit dem Pürierstab grob pürieren.",
"Sahne einrühren, mit Salz und nach Wunsch Zitronensaft abschmecken. Paneer unterheben, 2 Min. ziehen lassen und mit Reis servieren."]},
e05:{v:"Öl, 1 TL Kurkuma, 1 TL Kreuzkümmel, 1 TL Garam Masala, Salz, evtl. frischer Koriander und Chili",s:[
"Kartoffeln schälen und in 2 cm große Würfel schneiden. Blumenkohl in kleine Röschen teilen.",
"Zwiebel und Knoblauch schälen und fein würfeln.",
"In einem großen Topf oder einer tiefen Pfanne (mit Deckel) 2 EL Öl erhitzen. Kreuzkümmel 30 Sek. rösten, dann die Zwiebel 4 Min. andünsten, Knoblauch 1 Min. mitdünsten.",
"Kurkuma und Garam Masala dazugeben und kurz mitrösten.",
"Kartoffeln und Blumenkohl dazugeben und gut wenden, bis alles gelb überzogen ist.",
"Tomaten und 150 ml Wasser dazugeben, salzen, Deckel auflegen und bei kleiner Hitze ca. 20 Min. garen, bis die Kartoffeln weich sind. Zwischendurch vorsichtig umrühren.",
"Mit Salz abschmecken und mit aufgebackenem Naan servieren."]},
e06:{v:"Öl oder Ghee, 2 TL Garam Masala, ½ TL Kurkuma, 1 Lorbeerblatt, evtl. Kardamom und Zimtstange, Salz",s:[
"Basmatireis in einem Sieb gründlich waschen und 10 Min. in kaltem Wasser einweichen, dann abtropfen lassen.",
"Eine Zwiebel in dünne Ringe schneiden und in 2 EL Öl ca. 8–10 Min. knusprig braun braten. Auf Küchenpapier abtropfen lassen.",
"Cashews in einer trockenen Pfanne goldbraun rösten.",
"Zweite Zwiebel würfeln, Karotten und Paprika in kleine Würfel schneiden.",
"In einem Topf (mit gut schließendem Deckel) 1 EL Öl erhitzen, Zwiebelwürfel, Karotten und Paprika 5 Min. anbraten. Gewürze dazugeben und 30 Sek. rösten.",
"Reis und Erbsen dazugeben, 550 ml Wasser und 1 TL Salz dazugeben, aufkochen. Deckel auflegen und bei kleinster Hitze 15 Min. garen, dann vom Herd nehmen und 10 Min. geschlossen ruhen lassen.",
"Reis mit einer Gabel auflockern, mit Röstzwiebeln und Cashews bestreuen und mit Joghurt servieren."]},
e07:{v:"Öl, 1–2 EL Sojasauce oder Fischsauce, 1 TL Zucker, evtl. Thai-Basilikum",s:[
"Jasminreis nach Packungsangabe kochen.",
"Paprika, Zucchini in Stücke schneiden, Brokkoli in kleine Röschen teilen.",
"In einem Wok oder Topf 1 EL Öl erhitzen. 1–2 EL Currypaste darin 1 Min. unter Rühren anrösten. Für Kinder wenig Paste nehmen – die Schärfe lässt sich später nicht mehr herausnehmen.",
"Kokosmilch dazugießen und aufkochen.",
"Brokkoli und Paprika dazugeben und 5 Min. köcheln. Zucchini dazugeben und weitere 3–4 Min. köcheln, bis das Gemüse bissfest ist.",
"Mit Sojasauce, Zucker und Limettensaft abschmecken.",
"Mit Reis servieren, nach Wunsch mit Thai-Basilikum oder Koriander."]},
e08:{v:"Neutrales Öl, Sesam",s:[
"Jasminreis nach Packungsangabe kochen.",
"Brokkoli in Röschen teilen und in den letzten 5 Min. im Siebeinsatz über dem Reis dämpfen oder 4 Min. in Salzwasser kochen.",
"Hähnchen trocken tupfen und in Streifen oder Würfel schneiden.",
"In einer Pfanne 1 EL Öl stark erhitzen und das Hähnchen 5–6 Min. rundum goldbraun braten, bis es durchgegart ist.",
"5–6 EL Teriyakisauce dazugeben und unter Rühren 1–2 Min. einköcheln lassen, bis das Fleisch glänzend überzogen ist.",
"Sesam in einer trockenen Pfanne kurz rösten.",
"Reis, Brokkoli und Hähnchen in Schalen anrichten und mit Sesam bestreuen."]},
e09:{v:"Neutrales Öl, 3 EL Sojasauce, 1 EL Honig, evtl. Sesamöl, Sesam",s:[
"Pak Choi waschen und in Streifen schneiden. Karotten in dünne Streifen, Champignons in Scheiben, Frühlingszwiebeln in Ringe schneiden.",
"Sojasauce und Honig verrühren.",
"Udon-Nudeln nach Packungsangabe vorbereiten – meist kurz mit heißem Wasser übergießen, damit sie sich lösen, dann abtropfen lassen.",
"In einem Wok oder einer großen Pfanne 2 EL Öl stark erhitzen. Karotten und Pilze 3 Min. braten, dann Pak Choi und das Weiße der Frühlingszwiebeln 2 Min. mitbraten.",
"Nudeln dazugeben und 2 Min. durchbraten.",
"Nudeln zur Seite schieben, Eier in die freie Stelle schlagen, verrühren und stocken lassen, dann alles vermischen.",
"Sauce dazugeben, durchschwenken und mit Frühlingszwiebelgrün, Sesam und ein paar Tropfen Sesamöl servieren."]},
e10:{v:"Öl, Sojasauce, 1 TL Honig, evtl. Minze, Koriander oder Thai-Basilikum",s:[
"Reisnudeln nach Packung in heißem Wasser einweichen, abgießen und kalt abspülen.",
"Gurke und Karotten in feine Streifen schneiden. Salatblätter waschen und trocken tupfen. Tofu in Stifte schneiden und in etwas Öl rundum anbraten, mit Sojasauce beträufeln.",
"Für den Dip 3 EL Erdnussmus, 2 EL Sojasauce, Saft einer halben Limette, 1 TL Honig und 3–4 EL warmes Wasser glatt rühren.",
"Eine große Schale mit warmem Wasser bereitstellen und alles auf den Tisch stellen.",
"Ein Reispapier 5–10 Sek. ins Wasser tauchen, bis es weich ist, und auf ein feuchtes Brett legen.",
"Im unteren Drittel Salat, Nudeln, Gemüse, Tofu und Kräuter verteilen. Unteren Rand darüberklappen, Seiten einschlagen und fest aufrollen.",
"Mit dem Erdnussdip servieren. Tipp: Am Tisch rollt jeder selbst – das macht Kindern großen Spaß."]},
e11:{v:"Neutrales Öl, Sojasauce, Sesamöl, Sesam, 1 Knoblauchzehe",s:[
"Reis in einem Sieb waschen und nach Packungsangabe kochen.",
"Karotten und Gurke in feine Streifen schneiden. Champignons in Scheiben schneiden.",
"In einer Pfanne 1 EL Öl erhitzen. Champignons 4 Min. braten, mit Sojasauce würzen und herausnehmen.",
"Karotten 2 Min. anbraten und herausnehmen.",
"Spinat mit gehacktem Knoblauch in der Pfanne zusammenfallen lassen, mit ein paar Tropfen Sesamöl und Salz würzen.",
"Spiegeleier braten (Eigelb flüssig lassen).",
"Reis in Schalen verteilen, Gemüse nebeneinander darauf anrichten, Ei obenauf, mit Sesam bestreuen. Gochujang nur für die Erwachsenen dazugeben und am Tisch alles verrühren."]},
e12:{v:"Neutrales Öl, 3 EL Sojasauce, 2 EL Zucker, 1 EL Tomatenketchup, evtl. Fischsauce und Chiliflocken",s:[
"Reisnudeln nach Packungsangabe einweichen, bis sie weich, aber noch bissfest sind. Abgießen.",
"Garnelen auftauen lassen und trocken tupfen.",
"Für die Sauce Sojasauce, Zucker, Ketchup, den Saft einer halben Limette und nach Wunsch 1 EL Fischsauce verrühren.",
"Frühlingszwiebeln in Stücke schneiden. Erdnüsse grob hacken.",
"Im Wok 2 EL Öl stark erhitzen, Garnelen 2 Min. braten, bis sie rosa sind. Zur Seite schieben, Eier in die freie Stelle geben, verrühren und stocken lassen.",
"Nudeln und Sauce dazugeben und 2–3 Min. kräftig durchschwenken. Sprossen und Frühlingszwiebeln dazugeben und 1 Min. mitbraten.",
"Mit Erdnüssen und Limettenspalten servieren. Chiliflocken für die Erwachsenen."]},
e13:{v:"Neutrales Öl, Sojasauce, 2 EL Reisessig, 1 TL Zucker, Salz, evtl. Sesam",s:[
"Jasminreis nach Packungsangabe kochen.",
"Gurke in dünne Scheiben hobeln. Mit Reisessig, Zucker und 1 Prise Salz mischen und ziehen lassen.",
"Pak Choi längs halbieren und waschen.",
"In einer großen beschichteten Pfanne (mit Deckel) 1 EL Öl erhitzen. Gyoza gefroren mit der flachen Seite nach unten hineinsetzen und 2–3 Min. braten, bis die Unterseite goldbraun ist.",
"Ca. 100 ml Wasser angießen (Vorsicht, es spritzt), Deckel auflegen und 5–6 Min. dämpfen, bis das Wasser verdampft ist. Genaue Zeiten stehen auf der Packung.",
"Pak Choi in der letzten Minute mit in die Pfanne legen oder separat kurz anbraten.",
"Gyoza mit Reis, Pak Choi und Gurkensalat servieren, Sojasauce zum Dippen dazu."]},
k01:{v:"Kräutersalz, Pfeffer",s:[
"Avocados halbieren, entkernen, das Fruchtfleisch herauslösen und mit einer Gabel zerdrücken.",
"Zitrone auspressen, Knoblauch schälen und durchpressen. Beides unter die Avocado rühren und mit Kräutersalz und Pfeffer würzen.",
"Feldsalat verlesen, waschen und trocken schleudern, grobe Stiele entfernen.",
"Etwa die halbe Gurke waschen und klein würfeln. Rote Bete klein würfeln (Achtung, färbt stark ab – am besten auf einem Teller oder mit Handschuhen).",
"Gouda reiben. Kresse vom Beet schneiden, in einem Sieb abbrausen und abtropfen lassen.",
"Tortillas nacheinander in einer trockenen Pfanne je Seite ca. 20 Sek. erwärmen.",
"Tortillas mit Avocadocreme bestreichen, Feldsalat, Gurke, Rote Bete, Gouda und Kresse darauf verteilen, aufrollen und sofort essen."]},
k02:{v:"Rohrzucker, Salz, Cayennepfeffer",s:[
"Wer Reisnudeln dazu möchte: nach Packungsangabe einweichen bzw. garen (ca. 80 g roh pro Erwachsenem).",
"Gurke waschen und mit dem Sparschäler in lange Streifen schneiden, dabei das Kerngehäuse aussparen. 2–3 Frühlingszwiebeln in dünne Ringe schneiden, eine Handvoll Koriander grob zupfen. Alles in eine Schüssel geben.",
"Erdnüsse hacken und in einer Pfanne ohne Fett hell rösten, herausnehmen und abkühlen lassen.",
"Chili entkernen und in feine Ringe schneiden. Saft von 1 Limette (ca. 2 EL), 1½ EL Fischsauce und 1 TL Zucker verrühren und unter den Salat mischen. Chili nur in den Salat der Erwachsenen geben oder separat hinstellen. Salat ziehen lassen.",
"Für die Sauce Knoblauch, ein ca. 3 cm großes Stück Ingwer und die Zwiebel schälen und sehr fein würfeln. In einem kleinen Topf 1½ EL Sesamöl erhitzen und alles darin andünsten.",
"3 EL Erdnussmus und 1–2 EL heißes Wasser einrühren, mit Salz und Cayennepfeffer abschmecken (fürs Kind mild lassen) und offen bei kleiner Hitze 2–3 Min. einkochen, dabei umrühren.",
"Hähnchen trocken tupfen, längs in ca. 6 Streifen schneiden und wellenförmig auf Spieße fädeln.",
"Restliches Sesamöl (ca. 1½ EL) in einer Pfanne erhitzen, Spieße darin 3–5 Min. unter Wenden scharf anbraten, bis sie durch sind.",
"Spieße mit Erdnusssauce bestreichen, mit Gurkensalat (und Reisnudeln) anrichten und mit den gerösteten Erdnüssen bestreuen."]},
k03:{v:"2–3 EL Olivenöl, Salz, Pfeffer, ¾ TL geräuchertes Paprikapulver, Backpapier",s:[
"Backofen auf 200 °C (Ober-/Unterhitze) vorheizen, ein Blech mit Backpapier belegen.",
"Rosenkohl putzen, waschen, den Strunk abschneiden und die Röschen halbieren.",
"Pastinaken, Petersilienwurzeln und Möhren waschen bzw. schälen und jeweils einmal quer und einmal längs halbieren.",
"Gemüse in einer Schüssel mit Öl, Salz, Pfeffer und Paprikapulver mischen, auf dem Blech verteilen und im Ofen (Mitte) 15–20 Min. garen, bis es weich und leicht gebräunt ist.",
"Währenddessen Dill waschen, trocken tupfen, die Spitzen abzupfen und fein hacken.",
"Limette heiß waschen und halbieren. Eine Hälfte auspressen, die andere in Spalten schneiden.",
"Quark mit Dill und Limettensaft verrühren (bei Bedarf 1–2 EL Milch dazu) und mit Salz und Pfeffer abschmecken.",
"Ofengemüse auf Teller verteilen und mit dem Limetten-Dill-Quark und den Limettenspalten servieren."]},
k04:{v:"3 EL Olivenöl, 3 TL Korianderkörner, 1½ TL Gemüsebrühe (Instant), Salz, Pfeffer",s:[
"Zwiebeln und Knoblauch schälen und fein würfeln. Korianderkörner im Mörser grob zerstoßen.",
"Mangold putzen, waschen und Blätter und Stiele in ca. 1 cm breite Streifen schneiden.",
"Zitrone heiß waschen, die Schale fein abreiben und eine Hälfte auspressen.",
"Öl in einem Topf erhitzen, Zwiebeln, Knoblauch und Koriander bei mittlerer Hitze ca. 5 Min. anbraten.",
"Mangold und Zitronenschale dazugeben und 3–4 Min. mitbraten.",
"Brühpulver, ca. 750 ml Wasser und die Linsen dazugeben und zugedeckt bei kleiner Hitze ca. 20 Min. köcheln, bis die Linsen weich sind. Mit Salz und Pfeffer abschmecken.",
"Koriandergrün waschen und grob zupfen. Suppe in Schalen füllen, kurz etwas abkühlen lassen, mit Zitronensaft beträufeln und mit Joghurt und Koriander garnieren.",
"Tipp: Reste nicht mehrmals aufwärmen oder lange warm halten (Mangold enthält Nitrat)."]},
k05:{v:"4–5 EL Olivenöl, Salz, Pfeffer",s:[
"Backofen auf 180 °C vorheizen. Zitrone heiß waschen, die Schale fein abreiben, dann halbieren und auspressen.",
"Für das Pesto Bärlauch waschen, trocken tupfen und grob schneiden. Mit Walnüssen, 3 EL Hefeflocken, 1½ EL Zitronensaft, 1½ EL Öl, Salz und Pfeffer im Mixer fein pürieren. (Oder fertiges grünes Pesto nehmen.)",
"Spargel waschen, im unteren Drittel schälen und die holzigen Enden abschneiden. Tofu in große Würfel schneiden.",
"Spargel und Tofu in einer Auflaufform mit 1½ EL Öl, Salz und Pfeffer mischen und im Ofen (Mitte) ca. 15 Min. garen. Herausnehmen und warm halten.",
"Inzwischen Schalotten und Knoblauch schälen, fein würfeln und in einem kleinen Topf im restlichen Öl andünsten.",
"Graupen in einem Sieb abbrausen, dazugeben und kurz mitdünsten. Brühe angießen und zugedeckt bei kleiner Hitze ca. 20 Min. köcheln lassen, ab und zu umrühren (bei Bedarf etwas Wasser nachgießen).",
"Parmesan reiben und unter die Graupen ziehen, mit Pfeffer würzen.",
"Graupenrisotto auf Teller geben, Spargel und Tofu daraufsetzen und mit Pesto und Zitronenschale toppen."]},
k06:{v:"3 EL Sojasauce (gern glutenfrei), Pfeffer, ½ TL gemahlene Kurkuma",s:[
"Wer Reis dazu möchte: Reis nach Packungsangabe kochen.",
"Brokkoli und Bohnen nach Packungsanweisung antauen lassen (oder kurz in der Mikrowelle).",
"Hähnchen trocken tupfen und in mundgerechte Streifen schneiden. Frühlingszwiebeln schräg in dünne Ringe schneiden.",
"3 EL Sesamöl im Wok oder einer großen Pfanne erhitzen und die Hähnchenstreifen rundum anbraten.",
"Brokkoli dazugeben und ca. 3 Min. mitdünsten.",
"Bohnen, Frühlingszwiebeln und Cashewkerne dazugeben und 2–3 Min. mitbraten.",
"Mit Sojasauce, Pfeffer und Kurkuma würzen und sofort servieren."]},
k07:{v:"2 EL Olivenöl, 1½ TL flüssiger Honig, 1½ TL Senf, 1½ EL heller Balsamico, Salz, Pfeffer, Einweghandschuhe",s:[
"Rote Bete schälen (am besten mit Handschuhen, sie färbt stark ab) und mit dem Gemüsehobel in sehr dünne Scheiben hobeln.",
"Rucola waschen und trocken schleudern. Petersilie abbrausen, trocken schütteln und grob hacken.",
"Walnüsse in einer Pfanne ohne Fett goldbraun rösten, kurz abkühlen lassen und grob hacken.",
"Für das Dressing Öl und 1½ EL Zitronensaft verquirlen, Honig und Senf unterrühren, Balsamico dazugeben und mit Salz und Pfeffer abschmecken.",
"Rote-Bete-Scheiben fächerförmig auf Tellern auslegen, Petersilie darüberstreuen und Rucola in die Mitte setzen.",
"Mit Dressing beträufeln, Käse darüberbröseln und mit Walnüssen bestreuen. Mit Vollkornbrot servieren."]},
k08:{v:"Öl für die Form, Salz, Pfeffer",s:[
"Backofen auf 200 °C (Ober-/Unterhitze) vorheizen und eine Auflaufform leicht einölen.",
"Knoblauch schälen und fein hacken oder pressen.",
"Hackfleisch in einer Pfanne ohne oder mit wenig Öl krümelig anbraten, bis es durchgegart ist. Mit Salz, Pfeffer und Knoblauch würzen.",
"Hack etwas abkühlen lassen und mit dem geriebenen Käse vermischen.",
"Eier mit der Milch (ca. 8 EL) in einem flachen Teller gut verquirlen.",
"Zwei Reispapierblätter zusammen kurz in die Ei-Milch tauchen, bis sie weich sind, und auf eine saubere Arbeitsfläche legen.",
"Etwas Füllung als Streifen daraufgeben, fest einrollen und die Rolle zu einer Schnecke drehen. In die Form setzen. So weitermachen, bis die Füllung aufgebraucht ist (ergibt ca. 7–8 Schnecken).",
"Restliche Ei-Milch darüberträufeln, mit schwarzem Sesam bestreuen und im Ofen ca. 20–25 Min. backen, bis die Börek knusprig und goldbraun sind. Dazu passt ein Salat oder Joghurt-Dip."]},
k09:{v:"1–2 EL Öl, Pfeffer, getrocknetes Bohnenkraut, evtl. Salz",s:[
"Bohnen waschen, die Enden abschneiden und die Bohnen in ca. 3 cm lange Stücke brechen oder schneiden.",
"Zwiebel schälen und fein würfeln. Wurst in kleine Würfel schneiden.",
"Kartoffeln und Möhren schälen und in etwa 1 cm große Würfel schneiden.",
"Öl in einem großen Topf erhitzen, Wurst und Zwiebel darin 3–4 Min. anbraten.",
"Kartoffeln und Möhren dazugeben und kurz mitanbraten.",
"Mit 1 l Fleischbrühe ablöschen, aufkochen und ca. 10 Min. kochen lassen.",
"Bohnen dazugeben und weitere ca. 15 Min. garen, bis alles weich ist.",
"Mit Pfeffer und 1–2 TL Bohnenkraut abschmecken, bei Bedarf salzen (die Brühe ist schon salzig)."]},
k10:{v:"1 EL Rapsöl, Salz, Pfeffer, Cayennepfeffer",s:[
"Backofen auf 200 °C (Ober-/Unterhitze) vorheizen.",
"1 Zwiebel fein würfeln. 1 grüne Peperoni längs halbieren, Kerne und weiße Häute entfernen und in Ringe schneiden.",
"1 EL Rapsöl in einer Pfanne erhitzen, Zwiebel und Peperoni darin 3–4 Min. glasig dünsten.",
"2 Dosen schwarze Bohnen und 1 Dose Kidneybohnen in ein Sieb geben, abspülen und abtropfen lassen.",
"Bohnen, Zwiebel-Peperoni-Mix und 400 g stückige Tomaten in einer Auflaufform mischen, mit Salz und Pfeffer würzen. Cayennepfeffer nur auf die Hälfte für die Erwachsenen streuen.",
"2 Kugeln Mozzarella würfeln und auf dem Auflauf verteilen.",
"Im Ofen (Mitte) ca. 20 Min. überbacken, bis der Käse zerlaufen ist.",
"½ Bund Koriander abzupfen, den Auflauf kurz abkühlen lassen und bestreut servieren (Koriander für Kinder ggf. weglassen)."]},
k11:{v:"2 EL Kokosöl, 3 EL Olivenöl, 1 TL Butter, 3 EL Kartoffelstärke, 1½ TL Paprika edelsüß, 1½ TL Majoran, 1½ TL mittelscharfer Senf, 1 TL Ahornsirup, jodfreies Salz, Pfeffer",s:[
"Backofen auf 200 °C Umluft vorheizen, ein Blech mit Backpapier belegen.",
"3 Kohlrabi (ca. 750 g) schälen und in Pommes-Streifen schneiden. Mit 2 EL Kokosöl, 1½ TL Paprika, 1½ TL Majoran, Salz, Pfeffer und 3 EL Kartoffelstärke mischen.",
"Kohlrabi auf dem Blech verteilen, ca. 12 Min. backen, wenden und weitere 12–15 Min. backen.",
"Für den Dip 2 EL Olivenöl, 1½ EL Mandelmus, 2 EL Wasser, 1½ TL Senf, 1 TL Ahornsirup, 1½ TL Zitronensaft und etwas abgeriebene Zitronenschale glatt rühren. Petersilie hacken.",
"480 g Zanderfilet (3 Stück) trocken tupfen, die Haut mehrmals leicht einschneiden und beidseitig salzen und pfeffern.",
"1 EL Olivenöl und 1 TL Butter mit 3 Thymianzweigen in einer Pfanne erhitzen. Den Zander auf der Hautseite bei mittlerer Hitze 7–8 Min. braten und dabei mit der schäumenden Butter begießen.",
"Filets wenden und 1–2 Min. auf der Fleischseite fertig braten.",
"Kohlrabipommes mit dem Zander anrichten, mit Petersilie bestreuen und den Dip dazu reichen."]},
k12:{v:"120 ml mildes Olivenöl oder Rapsöl, ¼ TL Salz",s:[
"2 Knoblauchzehen schälen und in ein hohes, schmales Mixgefäß geben.",
"120 ml Öl und 60 ml Milch (kühlschrankkalt) dazugießen.",
"Pürierstab ganz auf den Boden stellen und einschalten, ohne ihn zu bewegen, bis die Masse cremig wird wie Mayonnaise.",
"1½ EL Zitronensaft und ¼ TL Salz dazugeben und kurz durchmixen – das macht die Aioli glänzend und fester.",
"Abschmecken und servieren. Hält im Kühlschrank 2–3 Tage."]},
k13:{v:"1–2 TL Gemüsebrühe (Instant), 2–3 EL heller Saucenbinder, Salz, Pfeffer",s:[
"Ofen auf 180 °C (Ober-/Unterhitze) vorheizen.",
"2 Packungen TK-Buttergemüse in einem großen Topf nach Packungsangabe garen, bis die Kräuterbutter geschmolzen ist.",
"200 ml Sahne, 250 ml Milch und 100 g Kräuter-Schmelzkäse dazugeben und unter Rühren kurz aufköcheln, bis der Käse geschmolzen ist.",
"2–3 EL Saucenbinder einstreuen, kurz weiterköcheln und mit Salz, Pfeffer und 1–2 TL Brühe abschmecken. Die Sauce sollte eher flüssig bleiben, damit die Platten weich werden.",
"In eine Auflaufform abwechselnd Sauce und Lasagneplatten schichten: 3 Lagen Sauce, 2 Lagen Platten – mit Sauce abschließen.",
"100 g geriebenen Gouda darüberstreuen.",
"Im Ofen ca. 30 Min. goldbraun backen, 5 Min. ruhen lassen und servieren."]},
k14:{v:"3–4 EL Olivenöl, ½ TL Salz, ½ TL Kurkuma, ½ TL Currypulver, ½ TL Schwarzkümmel, ¼ TL gemahlener Koriander, ¼ TL Harissa",s:[
"300 ml Gemüsebrühe aufkochen, ½ TL Kurkuma, ½ TL Curry, ½ TL Schwarzkümmel, ¼ TL Koriander, ½ TL Salz und ¼ TL Harissa einrühren (Harissa für Kinder ggf. weglassen und später am Tisch nachwürzen).",
"150 g Bulgur einrühren, vom Herd nehmen und zugedeckt ca. 30 Min. quellen lassen.",
"Inzwischen Zucchini, Paprika und Aubergine (zusammen ca. 800 g) waschen und in kleine Würfel schneiden.",
"Gemüse in 2 Portionen in je 1–2 EL Olivenöl ca. 5 Min. anbraten und unter den Bulgur mischen. Ofen auf 190 °C vorheizen.",
"30 g Pinienkerne in einer trockenen Pfanne vorsichtig goldbraun rösten. Minze fein hacken (ca. 4 EL).",
"200 g Feta würfeln und mit Minze und Pinienkernen mischen.",
"Eine Auflaufform ölen, die Hälfte der Bulgur-Gemüse-Mischung einfüllen, die Feta-Mischung darauf verteilen und den restlichen Bulgur darübergeben.",
"Zugedeckt (Deckel oder Alufolie) ca. 30 Min. backen."]},
k15:{v:"125 g kalte Butter, Salz, Pfeffer, 1 TL getrockneter Thymian, 1 EL Öl, Butter für die Form",s:[
"250 g Mehl, 125 g kalte Butter in Stückchen, 1 Ei und 1 Prise Salz zügig zu einem Teig kneten, in Frischhaltefolie wickeln und 30 Min. kalt stellen.",
"Inzwischen ca. 600 g Hokkaido-Kürbis entkernen und mit Schale würfeln, 2 Zwiebeln schälen und würfeln.",
"125 g Speckwürfel in 1 EL Öl anbraten, Zwiebeln und Kürbis dazugeben und andünsten. 2 Knoblauchzehen dazupressen.",
"Mit Salz, Pfeffer und Thymian würzen, 200 ml Gemüsebrühe angießen und zugedeckt ca. 20 Min. weich garen. Dann pürieren und etwas abkühlen lassen.",
"Ofen auf 200 °C vorheizen. Teig ausrollen und eine gefettete Quiche- oder Springform (26–28 cm) damit auslegen, Rand ca. 3 cm hochziehen.",
"2 Eier mit 150 g Crème fraîche verquirlen, 100 g geriebenen Käse unterrühren, alles mit dem Kürbispüree mischen und mit Salz und Pfeffer abschmecken.",
"Nach Wunsch 2–3 EL grob zerstoßene Kürbiskerne unterheben oder darüberstreuen.",
"Füllung in die Form geben und ca. 45 Min. backen, bis sie fest und goldbraun ist. Kurz abkühlen lassen und in Stücke schneiden."]},
k16:{v:"2–3 EL Butterschmalz, 1 TL Gemüsebrühe (Pulver), Salz, Pfeffer, Muskat",s:[
"Backofen auf 200 °C (Ober-/Unterhitze) vorheizen.",
"2 Zwiebeln klein würfeln und in 2–3 EL Butterschmalz bei mittlerer Hitze dunkelbraun rösten, beiseitestellen.",
"Die dritte Zwiebel halbieren, in Streifen schneiden und in einer großen ofenfesten Pfanne glasig dünsten, bis sie weich ist.",
"Mit 150 ml Milch und 200 ml Sahne ablöschen, 1 TL Brühe, Salz, Pfeffer und Muskat dazugeben und kurz aufkochen.",
"750 g Spätzle dazugeben und rühren, bis die Flüssigkeit fast aufgesogen ist.",
"Die Hälfte vom Käse (100 g) unterheben, Röstzwiebeln darauf verteilen und mit dem restlichen Käse bestreuen.",
"Im Ofen ca. 20 Min. überbacken, bis der Käse goldbraun ist."]},
k17:{v:"2 EL Öl, 150 ml Hühnerbrühe, 2 TL Paprikapulver edelsüß, 2 TL Majoran, 1½ TL brauner Zucker, Salz, Pfeffer",s:[
"Backofen auf 200 °C vorheizen. Nudelwasser aufsetzen.",
"2 Zwiebeln in feine Streifen schneiden und in einer großen ofenfesten Pfanne in 2 EL Öl andünsten. 1 Knoblauchzehe fein hacken und dazugeben.",
"2 TL Paprika, 2 TL Majoran und 1½ TL braunen Zucker darüberstreuen, kurz anbraten und mit 150 ml Brühe aufgießen und aufkochen.",
"500 g Weißkohl putzen, in Streifen schneiden und dazugeben. Mit Salz und Pfeffer würzen und zugedeckt bei starker Hitze 10–15 Min. schmoren.",
"Inzwischen 250 g Bandnudeln nach Packungsangabe kochen und 150 g Kochschinken in Würfeln kurz anbraten.",
"Nudeln und Schinken zum Kohl geben und gut durchmischen.",
"Mit 100 g geriebenem Bergkäse und 2 EL Kürbiskernen bestreuen und ca. 10 Min. im Ofen überbacken."]},
k18:{v:"2 EL Öl, 500 ml Gemüsebrühe, Maggi Suppenwürze, Salz, Pfeffer",s:[
"800 g Kartoffeln schälen, würfeln und in Salzwasser ca. 15–20 Min. garen.",
"250 g Veggie-Hack in einem großen Topf in 2 EL Öl scharf und krümelig anbraten, mit 500 ml Gemüsebrühe ablöschen.",
"1 kleinen Wirsing putzen, den Strunk entfernen und in Streifen schneiden.",
"Wirsing zum Hack geben und offen einkochen lassen, bis der Wirsing weich ist (ca. 15 Min.).",
"200 g Crème fraîche einrühren und mit Salz, Pfeffer und ein paar Spritzern Maggi abschmecken.",
"Kartoffeln abgießen und zusammen mit dem Wirsingtopf in tiefen Tellern servieren."]},
k19:{v:"1 EL Öl, 150 ml Gemüsebrühe, Salz, Pfeffer, Muskat",s:[
"Backofen auf 180 °C vorheizen. 450 g Blattspinat (TK) auftauen lassen und etwas ausdrücken.",
"800 g Gnocchi in reichlich Salzwasser kochen, bis sie an der Oberfläche schwimmen, dann abgießen.",
"1 kleine Zwiebel fein würfeln und in einer großen Pfanne in 1 EL Öl andünsten.",
"Spinat dazugeben und mit Salz, Pfeffer und Muskat abschmecken.",
"Mit 150 ml Gemüsebrühe ablöschen und 200 g Frischkäse darin auflösen.",
"Gnocchi dazugeben, gut durchmischen und in eine Auflaufform füllen.",
"Mit 150 g geriebenem Emmentaler bestreuen und ca. 15–20 Min. backen, bis der Käse goldbraun ist."]},
k20:{v:"2 EL Öl, 100 ml Gemüsebrühe, Salz, Pfeffer, Muskat",s:[
"1 Zwiebel und 1 Knoblauchzehe schälen und fein würfeln.",
"Von 500 g grünem Spargel die holzigen Enden großzügig abschneiden, den Rest in 2–3 cm lange Stücke schneiden.",
"30 g Pinienkerne in einer trockenen Pfanne goldbraun rösten und beiseitestellen.",
"800 g Gnocchi in 1 EL Öl goldbraun anbraten und warm halten.",
"Zwiebel in 1 EL Öl andünsten, Spargel dazugeben und ca. 5 Min. anbraten, dann den Knoblauch kurz mitbraten.",
"Mit 150 ml Sahne und 100 ml Brühe ablöschen und ca. 5 Min. einköcheln lassen. Mit Salz, Pfeffer, Muskat und einem Spritzer Zitronensaft abschmecken.",
"Sauce über die Gnocchi geben, mit Pinienkernen bestreuen und frischen Parmesan darüberreiben."]},
k21:{v:"Öl, etwas Gemüsebrühe, Salz, Pfeffer",s:[
"1 Zwiebel hacken und in etwas Öl anschwitzen.",
"1 große Zucchini (ca. 400 g) klein würfeln, dazugeben und mit Salz, Pfeffer und einem Schuss Gemüsebrühe dünsten.",
"200 g Kochschinken in Würfeln dazugeben und alles gut durchbraten. Danach vollständig abkühlen lassen.",
"Backofen auf 180 °C vorheizen. 2 Eier und 100 g geriebenen Käse unter die abgekühlte Masse rühren.",
"1 Packung Blätterteig ausrollen, mit den restlichen 100 g Käse bestreuen, die Zucchinimasse darauf verteilen und aufrollen.",
"Den Strudel mit dem dritten, verquirlten Ei bestreichen und auf mittlerer Schiene ca. 35 Min. backen."]},
k22:{v:"50 g Butter, 2 TL Gemüsebrühe (Pulver), Salz, Pfeffer, Muskat",s:[
"Backofen auf 180 °C vorheizen. 1 Blumenkohl und 1 Brokkoli waschen und in Röschen teilen, 3 Möhren schälen und würfeln.",
"In reichlich kochendem Salzwasser zuerst den Blumenkohl 5 Min. kochen, dann Brokkoli und Möhren dazugeben und weitere 5 Min. garen. Abgießen, dabei etwas Gemüsewasser auffangen.",
"50 g Butter im Topf erhitzen, 2 EL Mehl (20 g) einrühren und bei schwacher Hitze goldgelb anschwitzen.",
"200 ml Sahne und nach und nach etwas Gemüsewasser einrühren, bis die Sauce die gewünschte Konsistenz hat.",
"50 g Käse unterrühren und mit Gemüsebrühepulver, Salz, Pfeffer und Muskat abschmecken.",
"Das Gemüse in eine Auflaufform geben, 200 g Kochschinken in Würfeln darauf verteilen und die Sauce darübergießen.",
"Mit den restlichen 50 g Käse bestreuen und ca. 20 Min. backen."]},
k23:{v:"Öl zum Braten, Salz, Pfeffer",s:[
"2 mittelgroße Zucchini (ca. 600 g) schälen und grob raspeln. 2 kleine Zwiebeln und 2 Knoblauchzehen fein würfeln.",
"Zucchini, Zwiebeln, Knoblauch, 200 g Haferflocken, 70 g geriebenen Käse, gehacktes Basilikum, Salz und Pfeffer in einer Schüssel gut vermengen.",
"2 Eier unterrühren. Wirkt die Masse zu dünnflüssig, nach Bedarf etwas Semmelbrösel (bis 30 g) untermengen.",
"Öl in einer Pfanne erhitzen, die Masse als kleine Häufchen hineingeben und flach drücken.",
"Von beiden Seiten goldbraun braten.",
"150 g Joghurt mit einem Spritzer Zitronensaft, Salz, Pfeffer und Schnittlauchröllchen verrühren und dazu servieren."]},
k24:{v:"Öl, 600 ml Gemüsebrühe, 1 EL Senf, Salz, Pfeffer",s:[
"1 Zwiebel fein hacken und in 1 EL Öl glasig andünsten.",
"200 g Grünkernschrot (oder eine Mischung aus Resten von Quinoa, Dinkelvollkornschrot, Haferflocken usw., insgesamt 200 g) dazugeben und mit 600 ml Brühe ablöschen.",
"Ca. 10 Min. leicht kochen, danach zugedeckt noch ca. 30 Min. quellen lassen.",
"2 Eier, 30 g Haferflocken (oder Semmelbrösel), 50 g geriebenen Käse (oder gehackte Nüsse), 1 gepresste Knoblauchzehe und 1 EL Senf untermischen. Kräftig mit Salz und Pfeffer abschmecken.",
"Kleine Küchle formen und in heißem Fett von beiden Seiten ca. 5 Min. anbraten. Fertige Küchle im Ofen warm halten."]},
k25:{v:"300 ml Wasser (oder Gemüsebrühe), 1 TL Salz, Öl zum Braten",s:[
"150 g Hirse nach Packungsangabe in 300 ml Wasser oder Gemüsebrühe kochen und abkühlen lassen.",
"100 g Semmelbrösel, 1 Ei, 200 g geriebenen Käse und 1 TL Salz zur Hirse geben und gut vermischen.",
"Aus der Masse Bratlinge formen.",
"In heißem Öl von beiden Seiten knusprig braun anbraten."]},
k26:{v:"2 EL Öl, 200 ml Gemüsebrühe, 2 EL Currypulver (Madras), Salz",s:[
"2 Zwiebeln, 2 Knoblauchzehen und 2 Auberginen würfeln. 2 Chilischoten in feine Ringe schneiden (Harissa geht auch), 1 Dose Kichererbsen abtropfen lassen.",
"Zwiebeln und Knoblauch in 2 EL Öl glasig anbraten.",
"Mit 2 EL Currypulver bestäuben, Chili dazugeben und kurz anrösten. Für das Kind Chili weglassen oder nur sehr wenig verwenden.",
"Mit 200 ml Brühe und 1 Dose Kokosmilch ablöschen, die Auberginen dazugeben und ca. 10 Min. leicht köcheln lassen.",
"Kichererbsen dazugeben und heiß werden lassen. Mit Salz abschmecken und gehackte Petersilie untermischen."]},
s01:{v:"2 EL Rapsöl, 1 TL Kurkuma, 1 TL Kreuzkümmel, 1 TL Garam Masala (mild), jodfreies Salz, Pfeffer",s:[
"Basmatireis nach Packungsangabe kochen.",
"Zwiebel, Knoblauch und Ingwer schälen und fein würfeln bzw. reiben. Linsen in einem Sieb abspülen.",
"Öl in einem großen Topf erhitzen, Zwiebel 3 Min. andünsten, Knoblauch, Ingwer, Kurkuma, Kreuzkümmel und Garam Masala 1 Min. mitrösten.",
"Linsen, passierte Tomaten, Kokosmilch und 400 ml Wasser dazugeben, aufkochen und offen 15 Min. köcheln, bis die Linsen zerfallen. Ab und zu umrühren.",
"Spinat unterheben und 1–2 Min. zusammenfallen lassen.",
"Mit jodfreiem Salz, Pfeffer und dem Saft einer halben Zitrone abschmecken. Mit dem Reis servieren, Chili nur für die Erwachsenen."]},
s02:{v:"2 EL Rapsöl, 2 TL mildes Currypulver, 1 TL Kurkuma, jodfreies Salz",s:[
"Vollkornreis nach Packungsangabe kochen (ca. 30 Min.).",
"Zwiebel, Knoblauch und Ingwer schälen und fein würfeln. Brokkoli in kleine Röschen teilen, Paprika würfeln. Kichererbsen abspülen.",
"Öl in einer großen Pfanne erhitzen, Zwiebel 3 Min. andünsten, Knoblauch, Ingwer, Curry und Kurkuma 1 Min. mitrösten.",
"Paprika und Brokkoli dazugeben und 3 Min. unter Rühren braten.",
"Kichererbsen und Kokosmilch dazugeben und zugedeckt ca. 10 Min. köcheln, bis der Brokkoli bissfest ist.",
"Mit jodfreiem Salz und Limettensaft abschmecken und mit dem Reis servieren."]},
s03:{v:"3 EL Olivenöl, 1 TL Paprikapulver, 1 TL Kreuzkümmel, 1 TL Honig oder Ahornsirup, jodfreies Salz, Pfeffer, Backpapier",s:[
"Backofen auf 200 °C (Umluft 180 °C) vorheizen, ein Blech mit Backpapier belegen.",
"Süßkartoffel schälen und in 2 cm große Würfel schneiden, Zucchini und Paprika grob würfeln. Kichererbsen abspülen und gut abtropfen lassen.",
"Gemüse und Kichererbsen mit Öl, Paprikapulver, Kreuzkümmel und jodfreiem Salz mischen und ca. 25 Min. rösten, einmal wenden.",
"Quinoa in einem Sieb heiß abspülen, mit der doppelten Menge Wasser aufkochen und 15 Min. leise köcheln, dann ausquellen lassen.",
"Für das Dressing 4 EL Tahin, Saft von 1 Zitrone, Honig und ca. 5 EL Wasser glatt rühren, salzen.",
"Petersilie hacken. Quinoa, Spinat und Ofengemüse in Schalen verteilen, mit Dressing beträufeln und Petersilie bestreuen."]},
s04:{v:"6 EL Olivenöl, jodfreies Salz, Pfeffer",s:[
"Vollkornnudeln in Wasser mit jodfreiem Salz nach Packungsangabe kochen. Vor dem Abgießen eine Tasse Nudelwasser abnehmen.",
"Walnüsse in einer Pfanne ohne Fett 3–4 Min. rösten, abkühlen lassen.",
"Petersilie grob zupfen. Mit 50 g Walnüssen, Knoblauch, Saft einer halben Zitrone, Olivenöl und etwas jodfreiem Salz im Mixer zu einem Pesto pürieren.",
"Kirschtomaten halbieren.",
"Nudeln mit Pesto und 3–4 EL Nudelwasser mischen, Tomaten unterheben.",
"Mit den restlichen gehackten Walnüssen und Pfeffer servieren."]},
s05:{v:"3 EL Olivenöl, jodfreies Salz, Pfeffer, Backpapier",s:[
"Backofen auf 200 °C (Umluft 180 °C) vorheizen, ein Blech mit Backpapier belegen.",
"Kartoffeln waschen, längs vierteln, mit 2 EL Öl und jodfreiem Salz mischen und auf dem Blech ca. 20 Min. rösten.",
"Dill und Petersilie hacken. Zitrone halbieren, eine Hälfte in Scheiben schneiden.",
"Forellenfilets mit der Hautseite nach unten zwischen die Kartoffeln legen, mit Salz, Pfeffer, 1 EL Öl und der Hälfte der Kräuter würzen, Zitronenscheiben darauflegen. Weitere 10–12 Min. garen.",
"Brokkoli in Röschen teilen und in wenig Wasser zugedeckt 5–6 Min. dämpfen.",
"Kartoffeln mit den restlichen Kräutern bestreuen, alles mit Zitronensaft beträufeln und servieren. Bei Kindern Gräten prüfen."]},
s06:{v:"2 EL Rapsöl, 1 TL Kurkuma, 1 TL Paprikapulver, 1–2 EL Essig, jodfreies Salz, Pfeffer",s:[
"Zwiebel und Knoblauch schälen und würfeln. Karotten und Kartoffeln schälen und würfeln, Lauch in Ringe schneiden. Linsen abspülen.",
"Öl in einem großen Topf erhitzen, Zwiebel und Knoblauch 3 Min. andünsten, Kurkuma und Paprikapulver kurz mitrösten.",
"Linsen, Karotten, Kartoffeln und Lauch dazugeben und mit der Brühe (ohne Jodsalz) aufgießen.",
"Aufkochen und zugedeckt bei kleiner Hitze ca. 30 Min. köcheln, bis Linsen und Kartoffeln weich sind.",
"Mit Essig, jodfreiem Salz und Pfeffer abschmecken.",
"Petersilie hacken und darüberstreuen."]},
s07:{v:"3 EL Olivenöl, 1 TL Thymian, jodfreies Salz, Pfeffer",s:[
"Buchweizen in einem Sieb abspülen, mit der Brühe (ohne Jodsalz) aufkochen und zugedeckt 12–15 Min. leise garen, bis die Flüssigkeit aufgesogen ist.",
"Pilze putzen und in Scheiben schneiden, Zwiebel und Knoblauch fein würfeln.",
"2 EL Öl in einer großen Pfanne stark erhitzen, Pilze 5 Min. goldbraun braten.",
"Zwiebel, Knoblauch, 1 EL Öl und Thymian dazugeben und 2 Min. mitbraten. Spinat unterheben, bis er zusammenfällt.",
"Buchweizen untermischen, mit jodfreiem Salz und Pfeffer abschmecken.",
"Walnüsse grob hacken, Petersilie hacken und beides darüberstreuen."]},
s08:{v:"3 EL Rapsöl, 1 TL Speisestärke, 1 EL Honig, jodfreies Salz, Pfeffer, Chiliflocken (nur Erwachsene)",s:[
"Reis nach Packungsangabe kochen.",
"Rindfleisch trocken tupfen, quer zur Faser in dünne Streifen schneiden und mit der Speisestärke mischen.",
"Brokkoli in kleine Röschen teilen, Paprika in Streifen, Frühlingszwiebeln in Ringe schneiden. Ingwer und Knoblauch fein hacken.",
"2 EL Öl im Wok oder in einer großen Pfanne stark erhitzen, Fleisch 2 Min. scharf anbraten, herausnehmen.",
"1 EL Öl zugeben, Brokkoli und Paprika 4 Min. braten, Ingwer und Knoblauch 1 Min. mitbraten.",
"Fleisch zurückgeben, Honig, Saft einer Limette und 4 EL Wasser zugeben, kurz durchschwenken und mit jodfreiem Salz und Pfeffer abschmecken.",
"Mit Frühlingszwiebeln und Sesam bestreuen und mit Reis servieren. Chiliflocken nur für die Erwachsenen."]},
s09:{v:"3 EL Olivenöl, 1 TL Paprikapulver edelsüß, jodfreies Salz, Pfeffer",s:[
"Hirse in einem Sieb heiß abspülen, mit der Brühe (ohne Jodsalz) aufkochen und zugedeckt 10 Min. leise köcheln, dann 10 Min. ausquellen lassen.",
"Zwiebel würfeln, Paprika und Zucchini in kleine Würfel schneiden, Kirschtomaten halbieren.",
"Öl in einer großen Pfanne erhitzen, Zwiebel 2 Min. andünsten, Paprika und Zucchini 5 Min. mitbraten.",
"Tomaten und Paprikapulver dazugeben und 2 Min. mitgaren.",
"Hirse unterheben, mit Saft einer halben Zitrone, jodfreiem Salz und Pfeffer abschmecken.",
"Petersilie hacken und darüberstreuen."]},
s10:{v:"2 EL Rapsöl, 1 TL Kurkuma, 1 TL Kreuzkümmel, jodfreies Salz, Pfeffer",s:[
"Kürbis waschen, entkernen und mit Schale würfeln. Karotten schälen und in Scheiben schneiden. Zwiebel und Ingwer schälen und würfeln. Linsen abspülen.",
"Öl in einem großen Topf erhitzen, Zwiebel und Ingwer 3 Min. andünsten, Kurkuma und Kreuzkümmel kurz mitrösten.",
"Kürbis, Karotten und Linsen dazugeben, mit der Brühe (ohne Jodsalz) aufgießen und zugedeckt ca. 20 Min. köcheln.",
"Kokosmilch einrühren (1–2 EL für die Deko zurückbehalten) und alles fein pürieren.",
"Mit jodfreiem Salz und Pfeffer abschmecken.",
"Kürbiskerne in einer Pfanne ohne Fett rösten und mit der restlichen Kokosmilch über die Suppe geben."]},
s11:{v:"3 EL Olivenöl, 1 TL italienische Kräuter, jodfreies Salz, Pfeffer",s:[
"Karotten schälen und würfeln, Zucchini würfeln, Lauch in Ringe schneiden, Knoblauch hacken. Grünkohl von den dicken Stielen zupfen und klein schneiden.",
"Öl in einem großen Topf erhitzen, Karotten, Lauch und Knoblauch 4 Min. andünsten.",
"Zucchini, Kräuter, Tomaten und die Brühe (ohne Jodsalz) dazugeben und 10 Min. köcheln.",
"Nudeln (kleine Sorte oder zerbrochen), abgespülte Bohnen und Grünkohl dazugeben und weitere ca. 10 Min. köcheln, bis die Nudeln gar sind.",
"Mit jodfreiem Salz und Pfeffer abschmecken.",
"Mit einem Schuss Olivenöl servieren."]},
s12:{v:"5 EL Olivenöl, 1 TL Kreuzkümmel, jodfreies Salz, Pfeffer",s:[
"Quinoa heiß abspülen, mit der doppelten Menge Wasser aufkochen, 15 Min. leise köcheln und ausquellen lassen. Auf einem Teller ausbreiten und abkühlen lassen.",
"Gurke und Tomaten klein würfeln, Frühlingszwiebeln in feine Ringe schneiden.",
"Petersilie und Minze fein hacken. Kichererbsen abspülen.",
"Saft von 2 Zitronen mit Olivenöl, Kreuzkümmel, jodfreiem Salz und Pfeffer verrühren.",
"Quinoa, Gemüse, Kräuter und Kichererbsen mit dem Dressing mischen und 10 Min. ziehen lassen.",
"Nochmals abschmecken. Hält sich auch gut für den nächsten Tag."]},
s13:{v:"3 EL Olivenöl, 1 TL Oregano, jodfreies Salz, Pfeffer",s:[
"Backofen auf 200 °C (Umluft 180 °C) vorheizen. Hirse heiß abspülen, mit der Brühe (ohne Jodsalz) aufkochen und 10 Min. leise köcheln, dann ausquellen lassen.",
"Zucchini längs halbieren und mit einem Löffel aushöhlen, dabei einen Rand stehen lassen. Das Fruchtfleisch klein hacken.",
"Zwiebel, Knoblauch und Paprika würfeln und mit dem Zucchinifleisch in 2 EL Öl 5 Min. braten. Mit der Hirse mischen, mit Oregano, jodfreiem Salz und Pfeffer würzen.",
"Passierte Tomaten mit Salz würzen und in eine Auflaufform gießen. Zucchinihälften hineinsetzen und füllen, mit 1 EL Öl beträufeln.",
"Im Ofen ca. 20 Min. backen, bis die Zucchini weich sind.",
"Walnüsse hacken, Basilikum zupfen und beides darüberstreuen."]},
s14:{v:"2 EL Rapsöl, 1 TL Paprikapulver, ½ TL Kurkuma, jodfreies Salz, Pfeffer",s:[
"Reis nach Packungsangabe kochen.",
"Zwiebel und Knoblauch würfeln, Paprika und Zucchini in kleine Würfel schneiden.",
"Öl in einer großen Pfanne erhitzen, Rinderhack krümelig braten, bis es braun ist.",
"Zwiebel, Knoblauch, Paprika und Zucchini dazugeben und 4 Min. mitbraten, Paprikapulver und Kurkuma unterrühren.",
"Tomaten und Erbsen dazugeben und 5 Min. köcheln.",
"Reis unterheben, mit jodfreiem Salz und Pfeffer abschmecken und mit gehackter Petersilie servieren."]},
s15:{v:"3 EL Rapsöl, ½ TL Muskat, 1 TL Senf, jodfreies Salz, Pfeffer",s:[
"Kartoffeln mit Schale in Wasser ca. 15 Min. vorkochen, abgießen, kurz abkühlen lassen und in Scheiben schneiden.",
"Grünkohl von den dicken Stielen zupfen und klein schneiden. Zwiebel und Knoblauch würfeln. Bohnen abspülen.",
"2 EL Öl in einer großen Pfanne erhitzen und die Kartoffeln ca. 8 Min. goldbraun braten.",
"1 EL Öl, Zwiebel, Knoblauch und Grünkohl dazugeben und 4–5 Min. mitbraten, bis der Kohl zusammenfällt.",
"Bohnen unterheben und warm werden lassen. Mit Senf, Muskat, Zitronensaft, jodfreiem Salz und Pfeffer abschmecken.",
"Walnüsse grob hacken und darüberstreuen."]},
s16:{v:"1 Prise jodfreies Salz, ½ TL Zimt, 1–2 TL Honig oder Ahornsirup",s:[
"Haferflocken mit Haferdrink, 1 Prise jodfreiem Salz und Zimt in einem Topf aufkochen.",
"Bei kleiner Hitze 3–4 Min. unter Rühren köcheln, bis der Brei cremig ist.",
"Eine Banane zerdrücken und unterrühren, die andere in Scheiben schneiden.",
"Beeren in einem kleinen Topf kurz erwärmen (TK-Beeren 3–4 Min.).",
"Walnüsse grob hacken.",
"Brei in Schalen füllen, mit Beeren, Bananenscheiben, Leinsamen und Walnüssen toppen, nach Geschmack mit Honig süßen."]},
s17:{v:"4 EL Olivenöl, 1½ TL Kurkuma, 1 TL Kreuzkümmel, ½ TL Paprikapulver, jodfreies Salz, Pfeffer, Backpapier",s:[
"Backofen auf 220 °C (Umluft 200 °C) vorheizen, ein Blech mit Backpapier belegen.",
"Blumenkohl in kleine Röschen teilen, Kichererbsen abspülen und trocken tupfen.",
"Beides mit Öl, Kurkuma, Kreuzkümmel, Paprikapulver und jodfreiem Salz mischen und ca. 25 Min. rösten, bis der Blumenkohl gebräunt ist.",
"Inzwischen Reis nach Packungsangabe kochen.",
"4 EL Tahin mit Saft einer Zitrone und 5–6 EL Wasser glatt rühren, salzen.",
"Reis, Spinat und Ofen-Blumenkohl anrichten, mit Tahin-Soße beträufeln und gehackte Petersilie darüberstreuen."]},
s18:{v:"3 EL Olivenöl, 1 TL Kräuter der Provence, 1 Prise Zucker, jodfreies Salz, Pfeffer",s:[
"Aubergine, Zucchini und Paprika in kleine Würfel schneiden, Zwiebel und Knoblauch fein würfeln.",
"Öl in einem großen Topf erhitzen, Aubergine 5 Min. anbraten, dann Zwiebel, Paprika und Zucchini weitere 4 Min. mitbraten.",
"Knoblauch und Kräuter der Provence 1 Min. mitbraten, Tomaten und 1 Prise Zucker dazugeben.",
"Zugedeckt ca. 15 Min. köcheln, mit jodfreiem Salz und Pfeffer abschmecken. Wer es feiner mag, einen Teil für die Kinder pürieren.",
"Inzwischen Vollkornspaghetti in Wasser mit jodfreiem Salz nach Packungsangabe kochen.",
"Spaghetti mit der Sauce mischen und mit Basilikum servieren."]},
g01:{v:"2 EL Olivenöl, 1 EL Butter, Salz, Pfeffer",s:[
"Brühe (glutenfrei) in einem Topf erhitzen und warm halten.",
"Zwiebel und Knoblauch fein würfeln, Pilze in Scheiben schneiden.",
"1 EL Öl in einer Pfanne erhitzen, Pilze 5 Min. goldbraun braten, salzen und beiseitestellen.",
"1 EL Öl im Topf erhitzen, Zwiebel und Knoblauch 2 Min. andünsten, Reis dazugeben und 1 Min. glasig rühren.",
"Eine Kelle Brühe angießen und rühren, bis sie aufgesogen ist. So weitermachen, bis der Reis nach ca. 18–20 Min. cremig und bissfest ist.",
"Erbsen die letzten 4 Min. mitgaren, dann Pilze unterheben.",
"Parmesan reiben, mit der Butter unterrühren, mit Salz und Pfeffer abschmecken und 2 Min. ruhen lassen."]},
g02:{v:"Butter für die Form, Salz, Pfeffer, Muskat",s:[
"Backofen auf 200 °C (Umluft 180 °C) vorheizen, eine Auflaufform mit Butter einfetten.",
"Kartoffeln schälen und in ca. 3 mm dünne Scheiben hobeln. Brokkoli in kleine Röschen teilen.",
"Sahne und Milch mit gepresstem Knoblauch, 1 TL Salz, Pfeffer und Muskat verrühren.",
"Kartoffelscheiben und Brokkoli abwechselnd in die Form schichten, die Sahnemilch darübergießen.",
"Mit Alufolie abdecken und 30 Min. backen.",
"Folie abnehmen, Käse darüberstreuen und weitere 15 Min. goldbraun backen. Vor dem Servieren 5 Min. ruhen lassen."]},
g03:{v:"3 EL Olivenöl, 1 EL Butter, 1 TL Oregano, Salz, Pfeffer",s:[
"Zwiebel und Knoblauch würfeln, Paprika und Zucchini in Würfel schneiden.",
"2 EL Öl in einer Pfanne erhitzen, Zwiebel, Paprika und Zucchini 5 Min. braten, Knoblauch und Oregano 1 Min. mitbraten.",
"Tomaten dazugeben und zugedeckt ca. 15 Min. schmoren, mit Salz und Pfeffer abschmecken.",
"Inzwischen die Brühe (glutenfrei) aufkochen, Polenta unter Rühren einrieseln lassen und bei kleiner Hitze nach Packung 5–10 Min. rühren, bis sie cremig ist. Butter unterrühren (bei Bedarf etwas Wasser nachgießen).",
"Mozzarella zerzupfen, Basilikum zupfen.",
"Polenta auf Teller geben, Ragout darauf verteilen, mit Mozzarella und Basilikum servieren."]},
g04:{v:"2 EL Öl, 1 TL Paprikapulver, 1 TL Kreuzkümmel, Salz, Pfeffer, Chiliflocken (nur Erwachsene)",s:[
"Zwiebel würfeln, Paprika in kleine Würfel schneiden. Bohnen und Mais abspülen.",
"Öl in einer großen Pfanne mit Deckel erhitzen, Zwiebel und Paprika 4 Min. braten.",
"Reis, Paprikapulver und Kreuzkümmel dazugeben und 1 Min. mitrösten.",
"Tomaten und Brühe (glutenfrei) angießen, aufkochen und zugedeckt bei kleiner Hitze ca. 18 Min. garen, bis der Reis weich ist. Zwischendurch einmal umrühren.",
"Bohnen und Mais unterheben und 2 Min. erwärmen, mit Salz, Pfeffer und Limettensaft abschmecken.",
"Käse darüberstreuen und zugedeckt kurz schmelzen lassen. Chili nur für die Erwachsenen."]},
g05:{v:"2 EL Butter, 1 EL Öl, Salz, Pfeffer, Muskat",s:[
"Kartoffeln schälen, würfeln und in Salzwasser ca. 18 Min. weich kochen.",
"Zitrone heiß waschen, Schale abreiben, Saft auspressen. Petersilie hacken.",
"Kartoffeln abgießen, mit warmer Milch, 1 EL Butter, Zitronenschale, Salz und Muskat zu Püree stampfen.",
"Erbsen in wenig Wasser 3–4 Min. garen.",
"Seelachs trocken tupfen, salzen. Öl und 1 EL Butter in einer Pfanne erhitzen, Fisch je Seite 3 Min. braten (nicht in Mehl wenden).",
"Mit Zitronensaft beträufeln, Petersilie darüberstreuen und mit Püree und Erbsen servieren."]},
g06:{v:"3 EL Olivenöl, 1 TL Kurkuma, 1 TL Paprikapulver edelsüß, Salz, Pfeffer",s:[
"Hähnchen in mundgerechte Stücke schneiden, salzen. Zwiebel und Knoblauch würfeln, Paprika in Streifen schneiden.",
"2 EL Öl in einer großen Pfanne erhitzen, Hähnchen 4 Min. rundum anbraten, herausnehmen.",
"1 EL Öl zugeben, Zwiebel und Paprika 3 Min. braten, Knoblauch, Kurkuma, Paprikapulver und Reis 1 Min. mitrösten.",
"Tomaten und Brühe (glutenfrei) dazugeben, aufkochen und zugedeckt bei kleiner Hitze ca. 18 Min. garen, nicht zu oft rühren.",
"Hähnchen und Erbsen dazugeben und weitere 5 Min. garen, bis der Reis weich ist.",
"Mit Salz, Pfeffer und Zitronenspalten servieren."]},
g07:{v:"2 EL Öl, 1 TL Honig, Chiliflocken (nur Erwachsene)",s:[
"Reisnudeln nach Packung in heißem Wasser einweichen bzw. garen, abgießen.",
"Karotten in feine Stifte, Paprika in Streifen schneiden, Brokkoli in kleine Röschen teilen, Frühlingszwiebeln in Ringe schneiden. Ingwer reiben.",
"Für die Soße 3 EL Erdnussmus, 3 EL Tamari, Saft einer Limette, Ingwer, Honig und 5 EL warmes Wasser glatt rühren.",
"Öl im Wok erhitzen, Karotten und Brokkoli 4 Min. braten, Paprika 2 Min. mitbraten.",
"Nudeln und Soße dazugeben und 1–2 Min. durchschwenken.",
"Mit Frühlingszwiebeln bestreuen. Chiliflocken nur für die Erwachsenen."]},
g08:{v:"5 EL Öl, 2 EL Essig, Salz, Pfeffer, Muskat",s:[
"Kartoffeln schälen, grob reiben und in einem sauberen Küchentuch kräftig ausdrücken.",
"Mit Eiern, 1 TL Salz, Pfeffer und Muskat mischen (kein Mehl nötig).",
"Quark mit etwas Milch oder Wasser glatt rühren, Schnittlauch in Röllchen schneiden und unterrühren, salzen.",
"Salat waschen und zupfen, Gurke hobeln, mit Essig, 2 EL Öl, Salz und Pfeffer anmachen.",
"Öl in einer großen Pfanne erhitzen, je 2 EL Masse flach drücken und pro Seite 3–4 Min. goldbraun braten. Auf Küchenpapier abtropfen lassen.",
"Rösti mit Kräuterquark und Salat servieren."]},
g09:{v:"2 EL Olivenöl, 1 TL Oregano, 1 Prise Zucker, Salz, Pfeffer",s:[
"Zwiebel und Knoblauch fein würfeln.",
"Öl in einem Topf erhitzen, Zwiebel und Knoblauch 3 Min. andünsten, Oregano kurz mitrösten.",
"Passierte Tomaten und Zucker dazugeben und 10 Min. köcheln, mit Salz und Pfeffer abschmecken.",

      if(snap.exists){
        docExists = true;

        synced = clone(data); state = clone(data); isExample = false;
        lsSet(state); render();

  if(full || !docExists || !synced){ docExists = true; synced = clone(state); fsDoc.set(clone(state)).catch(syncError); return; }
  const args = [];
  MAPS.forEach(m=>{
    const a = synced[m]||{}, b = state[m]||{};
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
      if(!(k in b)) args.push(new FP(m,k), FV.delete());
      else if(JSON.stringify(a[k]) !== JSON.stringify(b[k])) args.push(new FP(m,k), clone(b[k]));
    });
  });
  synced = clone(state);
  if(args.length) fsDoc.update(...args).catch(syncError);
}

    const v = state.days[i], key = isoDate(dates[i]);
    if(typeof v==="string" && dish(v) && !state.cooked[key]){ state.cooked[key]=v; changed=true; }
  }
  const cut = isoDate(new Date(Date.now()-400*864e5));
  Object.keys(state.cooked).forEach(k=>{ if(k<cut){ delete state.cooked[k]; changed=true; } });
  return changed;
}
function lastCooked(id){ let best=""; for(const [k,v] of Object.entries(state.cooked||{})) if(v===id && k>best) best=k; return best||null; }
function daysSince(iso){ if(!iso) return Infinity; const [y,m,d]=iso.split("-").map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((t-new Date(y,m-1,d))/864e5); }
function cookedText(id){
  const iso = lastCooked(id); if(!iso) return "Noch nicht gekocht";
  const n = daysSince(iso), [y,m,d] = iso.split("-");
  const rel = n<=1 ? "gestern" : n<7 ? `vor ${n} Tagen` : n<14 ? "vor 1 Woche" : n<60 ? `vor ${Math.round(n/7)} Wochen` : `vor ${Math.round(n/30)} Monaten`;
  return `Zuletzt gekocht: ${rel} (${d}.${m}.${n>300?y:""})`;
}
function metaLine(d){
  // Zeit · Art als Wort · höchstens 2 Symbole (Wichtiges zuerst) · "+N" für den Rest
  const t = tagList(d), kl = KIND[d.k];
  const prio = x=>({"⚠️":0,"👎":1,"👍":1,"🥣":2})[x[0]] ?? 3;
  const rest = t.filter(x=>x[1]!==kl && !["📷","🔗","⭐"].includes(x[0])).map((x,i)=>[x,i]).sort((a,b)=>prio(a[0])-prio(b[0])||a[1]-b[1]).map(a=>a[0]);
  const show = rest.slice(0,2), more = rest.length-show.length;
  const ico = ([i,l])=>i==="GF"?`<span class="gfb" title="Glutenfrei" aria-label="Glutenfrei">GF</span>`:`<span title="${esc(l)}" aria-label="${esc(l)}">${i}</span>`;
  const parts = [d.t?`<span>${d.t} Min</span>`:"", kl?`<span class="kind">${esc(kl)}</span>`:"", show.length?`<span class="ic">${show.map(ico).join("")}</span>`:""].filter(Boolean);
  return `<div class="mline">${parts.join('<span class="dot">·</span>')}${more>0?`<span class="more">+${more}</span>`:""}</div>`;
}
function chips(d, full){

function planned(){ return Object.values(state.days).filter(v=>typeof v==="string"); }
function randomDish(excludeDay){
  const used = new Set(Object.entries(state.days).filter(([k,v])=>k!==String(excludeDay)&&typeof v==="string").map(([,v])=>v));
  const nonVeg = Object.entries(state.days).filter(([k,v])=>k!==String(excludeDay)&&typeof v==="string"&&dish(v)&&dish(v).k!=="veg").length;
  const ALL = allDishes().filter(d=>!d.side && likeOf(d.id)>=0 && !blockedAllergens(d).length);
  // Mo–Fr nur schnelle Gerichte (bis 30 Min), am Wochenende alles
  const weekday = +excludeDay>=0 && +excludeDay<=4;
  const maxT = S().maxT;
  const fits = d=>!weekday || !maxT || !d.t || d.t<=maxT;
  let pool = ALL.filter(d=>!used.has(d.id) && (d.k==="veg" || nonVeg<2) && fits(d));
  if(!pool.length) pool = ALL.filter(d=>!used.has(d.id) && fits(d));
  if(!pool.length) pool = ALL;
  // vegetarisch bevorzugen
  // Gewichtung: vegetarisch ×3, 👍 ×2, in den letzten 3 Wochen gekocht ÷3
  const weighted = pool.flatMap(d=>{ let w=(d.k==="veg"?3:1)*(likeOf(d.id)>0?2:1)*(isFav(d)?2:1)*3; if(daysSince(lastCooked(d.id))<=RECENT_DAYS) w=Math.max(1,Math.round(w/3)); return Array(w).fill(d); });
  return weighted[Math.floor(Math.random()*weighted.length)];
}

const FR_PANTRY = /^(rote |weiße )?zwiebeln?$|knoblauch/i;
const FR_SYN = {"käse":["käse","gouda","emmentaler","parmesan","mozzarella","feta","bergkäse","cheddar","halloumi","paneer","ricotta","reibekäse"],"nudeln":["nudel","spaghetti","penne","fusilli","makkaroni","tagliatelle","lasagne","bandnudeln","linguine","farfalle","tortellini"],"nudel":["nudel","spaghetti","penne","fusilli"],"hähnchen":["hähnchen","huhn","chicken","hühnchen"],"huhn":["hähnchen","huhn"],"hack":["hack"],"hackfleisch":["hack"],"reis":["reis","basmati","risotto"],"tomate":["tomat"],"paprika":["paprika"],"kartoffel":["kartoffel"],"sahne":["sahne","kochsahne","schmand","crème"],"schinken":["schinken","speck"],"fisch":["lachs","forelle","kabeljau","zander","seelachs","thunfisch","fisch"],"ei":["ei","eier"],"eier":["ei","eier"],"joghurt":["joghurt"],"brot":["brot","brötchen","toast","baguette"]};
function frStem(t){ t=t.toLowerCase().trim(); if(t.length>5 && /en$/.test(t)) return t.slice(0,-2); if(t.length>4 && /[ns]$/.test(t)) return t.slice(0,-1); return t; }
function frTerms(t){ const k=t.toLowerCase().trim(); return FR_SYN[k] || FR_SYN[frStem(k)] || [frStem(k)]; }
function frMatch(term, name){ const n=name.toLowerCase(); return frTerms(term).some(x=> x.length<=2 ? new RegExp("(^|\\s|-)"+x+"(\\s|$|-)").test(n) : n.includes(x)); }
function frAllNames(){ const set=new Set(); allDishes().forEach(d=>d.i.forEach(x=>set.add(String(x[2])))); return [...set].sort((a,b)=>a.localeCompare(b,"de")); }
function frScore(d, have){
  const ing = d.i.filter(x=>!FR_PANTRY.test(String(x[2]).replace(/\s*\(.*\)/,"").trim()));
  const hits = have.filter(t=>ing.some(x=>frMatch(t,String(x[2]))));
  const covered = ing.filter(x=>have.some(t=>frMatch(t,String(x[2]))));
  const missing = ing.filter(x=>!covered.includes(x));
  return {hits, covered, missing};
}

const CEIL_UNITS = new Set(["Dose","Dosen","Glas","Pck","Packung","Bund","Kopf","Beet","Flasche","Laib","Becher","Tube","Kugeln"]);
function scaleQty(a,u,n,name){
  if(!a || n===3) return a;
  const x = a*n/3;
  if(u==="g"||u==="ml"){ const step = x<50?5:(x<500?25:50); return Math.max(step, Math.round(x/step)*step); }
  if(u==="l"||u==="kg"){ const m = x*1000, step = m<500?25:50; return Math.max(step, Math.round(m/step)*step)/1000; }
  if(CEIL_UNITS.has(u)) return Math.max(1, Math.ceil(x-0.05));
  if(u==="Zehen") return Math.max(1, Math.round(x));
  if(/^Eier$/i.test(name||"")) return Math.max(1, Math.ceil(x-0.05));
  return Math.max(0.5, Math.round(x*2)/2);
}
function ingItems(d,n){
  return d.i.map(([a,u,nm])=>{ const q=fmtQty(scaleQty(a,u,n,nm),u); return `<li>${q?`<strong>${q}</strong> `:""}${esc(nm)}</li>`; }).join("");
}

function matchFilter(d,f){
  if(f==="veg"&&d.k!=="veg") return false;
  if(f==="fleisch"&&d.k!=="fleisch") return false;
  if(f==="fisch"&&d.k!=="fisch") return false;
  if(f==="schnell"&&d.t>20) return false;
  if(f==="alltag"&&d.t>30) return false;
  if(f==="zeit"&&d.t<40) return false;
  if(f==="kinder"&&!d.kid) return false;
  if(f==="eigene"&&!d.own&&!d.foto&&!d.web) return false;
  if(f==="eingesendet"&&!d.foto&&!d.web) return false;
  if(f==="meine"&&!d.own) return false;
  if(f.startsWith("no-") && allergenKeys(d).has(f.slice(3))) return false;
  if(f==="antient"&&!d.ai) return false;
  if(f==="glutenfrei"&&!d.gf) return false;
  if(f==="like"&&likeOf(d.id)<=0) return false;
  if(f==="dislike"&&likeOf(d.id)>=0) return false;
  if(f==="lange"&&(d.side||daysSince(lastCooked(d.id))<=LONG_DAYS)) return false;
  if(HEALTH.some(h=>h[0]===f) && !healthTags(d).includes(f)) return false;
  if((f==="asia"||f==="indien")&&d.cu!==f) return false;
  return true;
}
const FGROUP = {like:"bew",dislike:"bew",veg:"art",fleisch:"art",fisch:"art",schnell:"zeit",alltag:"zeit",zeit:"zeit",asia:"kueche",indien:"kueche"};
function matchFilters(d,set){
  if(!set || !set.size) return true;
  const groups = {};
  set.forEach(f=>{ const g = FGROUP[f]||f; (groups[g]=groups[g]||[]).push(f); });
  return Object.values(groups).every(fs=>fs.some(f=>matchFilter(d,f)));
}

const UNIT_MAP = {"g":"g","gr":"g","gramm":"g","kg":"kg","ml":"ml","l":"l","liter":"l","stk":"Stk","stück":"Stk","st":"Stk","el":"EL","tl":"TL","prise":"Prise","prisen":"Prise","zehe":"Zehen","zehen":"Zehen","bund":"Bund","dose":"Dose","dosen":"Dose","glas":"Glas","gläser":"Glas","pck":"Pck","pck.":"Pck","packung":"Pck","packungen":"Pck","päckchen":"Pck","kopf":"Kopf","köpfe":"Kopf","laib":"Laib","laibe":"Laib","stange":"Stangen","stangen":"Stangen","kugel":"Kugeln","kugeln":"Kugeln","becher":"Becher","scheibe":"Scheiben","scheiben":"Scheiben","tasse":"Tasse","tassen":"Tasse","handvoll":"Handvoll"};
const CAT_WORDS = [
  ["t",/\b(tk|tiefkühl|tiefgekühlt|gefroren)|fischstäbchen/],
  ["f",/hähnchen|huhn|pute|rind|schwein|hack|fleisch|schnitzel|speck|schinken|salami|wurst|würstchen|lachs|fisch|thunfisch|garnele|forelle|kassler|gyros|bacon/],
  ["k",/milch|sahne|käse|gouda|parmesan|mozzarella|feta|quark|joghurt|schmand|crème|creme|butter|\beier?\b|ricotta|frischkäse|tofu|teig|tortellini|gnocchi|spätzle/],
  ["b",/brot|brötchen|baguette|toast|wraps?|tortilla|fladen|laugen|semmel\b/],
  ["v",/brühe|fond|passiert|stückige|tomatenmark|\böl\b|öl$|essig|mehl|zucker|nudel|spaghetti|reis\b|linsen|bohnen|kichererbsen|konserve/],
  ["g",/tomate|gurke|paprika|zucchini|karotte|möhre|zwiebel|knoblauch|lauch|kartoffel|salat|spinat|brokkoli|blumenkohl|kohl|pilz|champignon|apfel|äpfel|banane|beere|zitrone|limette|kräuter|petersilie|basilikum|schnittlauch|dill|avocado|kürbis|aubergine|sellerie|ingwer|obst|gemüse|mais­kolben|radieschen|rucola|frühlingszwiebel/]
];
function guessCat(name){ const n = name.toLowerCase(); for(const [c,re] of CAT_WORDS) if(re.test(n)) return c; return "v"; }
function parseIngredients(text){
  return text.split(/\n/).map(l=>l.trim().replace(/^[-•*]\s*/,"")).filter(Boolean).map(line=>{
    const m = line.match(/^(\d+(?:[.,]\d+)?|\d+\/\d+|½|¼|¾)\s*([A-Za-zÄÖÜäöüß.]+)?\s*(.*)$/);
    if(!m) return {a:0,u:"",n:line,c:guessCat(line)};
    let a = m[1]==="½"?0.5:m[1]==="¼"?0.25:m[1]==="¾"?0.75:m[1].includes("/")?(+m[1].split("/")[0])/(+m[1].split("/")[1]):parseFloat(m[1].replace(",","."));
    let u = m[2]||"", rest = (m[3]||"").trim();
    const mu = UNIT_MAP[u.toLowerCase()];
    if(mu){ u = mu; } else { rest = (u+" "+rest).trim(); u = "Stk"; }
    if(u==="kg"){ a = a*1000; u="g"; }
    if(!rest){ rest = line; a = 0; u = ""; }
    return {a, u, n:rest, c:guessCat(rest)};
  });
}

const INBOX_REPO = "Thallarion/Essensplan-Inbox";
const LS_INBOX = "essensplan-inbox";
function inboxCfg(){ const v = lsGet(LS_INBOX); return v && v.token ? v : null; }
async function gh(path, opts={}){
  const cfg = inboxCfg(); if(!cfg) throw new Error("kein Zugang");
  const r = await fetch("https://api.github.com/repos/"+INBOX_REPO+path, {...opts, headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+cfg.token,...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(r.status===404 && (!opts.method || opts.method==="GET")) return null;
  if(!r.ok){ const e = new Error("GitHub "+r.status); e.status=r.status; throw e; }
  return r.status===204 ? null : r.json();
}
function b64utf8(str){ return btoa(unescape(encodeURIComponent(str))); }
const isPdf = f => f.type==="application/pdf" || /\.pdf$/i.test(f.name||"");
function fileB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden")); r.readAsDataURL(file); }); }
function thumbHtml(f){ return isPdf(f) ? `<span class="pdf"><b>📄</b>${esc((f.name||"PDF").slice(0,22))}</span>` : `<img alt="" src="${URL.createObjectURL(f)}">`; }
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1800, sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.82).split(",")[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Bild konnte nicht gelesen werden")); };
    img.src = url;
  });
}

  const dirs = (list||[]).filter(x=>x.type==="dir").sort((a,b)=>b.name.localeCompare(a.name));
  const items = await Promise.all(dirs.map(async d=>{
    try{ const f = await gh(`/contents/inbox/${d.name}/info.json`); return {id:d.name, ...JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,"")))))}; }
    catch(e){ return {id:d.name}; }
  }));
  return items;
}
async function refreshInboxCount(){
  const el = $("#inboxCount"); if(!inboxCfg()){ el.hidden = true; return; }
  try{ const q = await loadQueue(); el.textContent = q.length; el.hidden = !q.length; }catch(e){ el.hidden = true; }
}
function inboxSetup(msg){
  openSheet(`<button class="btn small close" data-close>Schließen</button>
    <h2>Rezept-Eingang einrichten</h2>
    <p class="sub">Einmal pro Handy nötig. Den Zugangsschlüssel bekommst du von der Person, die die App eingerichtet hat.</p>
    <div class="form">
      <label>Zugangsschlüssel<input type="password" id="ibToken" autocomplete="off" placeholder="github_pat_…"></label>
      <p class="err-text" id="ibErr" ${msg?"":"hidden"}>${msg?esc(msg):""}</p>
      <div class="bar"><button class="btn primary" id="ibSave">Speichern & testen</button></div>
    </div>`);
  $("#ibSave").addEventListener("click",async()=>{
    const token = $("#ibToken").value.trim(); const err = $("#ibErr");
    if(!token){ err.textContent="Bitte den Schlüssel einfügen."; err.hidden=false; return; }
    lsSet({token}, LS_INBOX);
    try{ const r = await gh(""); if(!r) throw new Error("nicht gefunden"); toast("Rezept-Eingang eingerichtet"); openInbox(); refreshInboxCount(); }
    catch(e){ try{ localStorage.removeItem(LS_INBOX); }catch(_){} err.textContent="Das hat nicht geklappt – Schlüssel prüfen ("+e.message+")."; err.hidden=false; }
  });
}
async function openInbox(){
  if(!inboxCfg()){
    openSheet(`<button class="btn small close" data-close>Schließen</button>
      <h2>Rezept einsenden</h2>
      <p>Schick ein Rezept als Foto, PDF oder Link – es wird geprüft, auf 3 Personen umgerechnet und kommt dann für alle in die App.</p>
      <div class="bar" style="margin:14px 0"><a class="btn primary" href="einsenden.html?app=1" style="text-decoration:none">📷 Rezept einsenden</a></div>
      <p class="sub" style="margin-top:18px">Du hast einen Zugangsschlüssel für den Familien-Eingang? <button class="btn small ghost" id="ibSetup">Zugang einrichten</button></p>`);
    $("#ibSetup").addEventListener("click",()=>inboxSetup());
    return;
  }
  const from = (lsGet(LS_INBOX)||{}).from||"";
  openSheet(`<button class="btn small close" data-close>Schließen</button>
    <h2>Rezept einsenden</h2>
    <p class="sub">Foto(s) von einem Rezept oder ein Link – Claude macht daraus ein Rezept für eure App (Mengen für 3 Personen, Kategorien, Schritte).</p>
    <div class="form">
      <label>📷 Fotos oder 📄 PDF <span class="hint">z. B. Kochbuchseite, Screenshot oder Rezept als PDF, auch mehrere</span><input type="file" id="ibFiles" accept="image/*,application/pdf,.pdf" multiple></label>
      <div class="thumbs" id="ibThumbs"></div>
      <label>🔗 Link <span class="hint">optional, z. B. Chefkoch oder einfachkochen.de</span><input type="text" id="ibLink" inputmode="url" autocomplete="off" placeholder="https://…"></label>
      <label>Notiz <span class="hint">optional, z. B. „ohne Koriander“ oder „fürs Wochenende“</span><input type="text" id="ibNote" autocomplete="off"></label>
      <label>Von<input type="text" id="ibFrom" autocomplete="off" value="${esc(from)}" placeholder="Dein Name"></label>
      <p class="err-text" id="ibErr" hidden></p>
      <div class="bar"><button class="btn primary" id="ibSend">Einsenden</button></div>
    </div>
    <h3>Warteliste</h3><div id="ibQueue"><p class="hint">Wird geladen …</p></div>
    <p class="hint" style="margin-top:14px"><button class="btn small ghost" id="ibReset">Zugang entfernen</button></p>`);
  $("#ibFiles").addEventListener("change",e=>{
    $("#ibThumbs").innerHTML = [...e.target.files].map(thumbHtml).join("");
  });
  $("#ibReset").addEventListener("click",()=>{ try{ localStorage.removeItem(LS_INBOX); }catch(_){} closeSheet(); refreshInboxCount(); toast("Zugang entfernt"); });
  $("#ibSend").addEventListener("click",async()=>{
    const files = [...$("#ibFiles").files], link = $("#ibLink").value.trim(), note = $("#ibNote").value.trim(), who = $("#ibFrom").value.trim();
    const err = $("#ibErr"), btn = $("#ibSend");
    if(!files.length && !link){ err.textContent="Bitte ein Foto oder PDF auswählen oder einen Link einfügen."; err.hidden=false; return; }
    const big = files.find(f=>isPdf(f) && f.size>15e6); if(big){ err.textContent=`„${big.name}“ ist zu groß (max. 15 MB).`; err.hidden=false; return; }
    if(link && !/^https?:\/\//i.test(link)){ err.textContent="Der Link muss mit https:// beginnen."; err.hidden=false; return; }
    err.hidden=true; btn.disabled=true;
    const cfg = lsGet(LS_INBOX)||{}; cfg.from = who; lsSet(cfg, LS_INBOX);
    const now = new Date(); const pad = n=>String(n).padStart(2,"0");
    const id = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}_${Math.random().toString(36).slice(2,6)}`;
    try{
      const names = []; let nF=0, nD=0;
      for(let k=0;k<files.length;k++){
        btn.textContent = `Datei ${k+1} von ${files.length} wird hochgeladen …`;
        const pdf = isPdf(files[k]);
        const data = pdf ? await fileB64(files[k]) : await shrinkImage(files[k]);
        const name = pdf ? `dokument${++nD}.pdf` : `foto${++nF}.jpg`;
        await gh(`/contents/inbox/${id}/${name}`,{method:"PUT",body:JSON.stringify({message:`Einsendung ${id}: ${name}`,content:data})});
        names.push(name);
      }
      btn.textContent = "Wird gespeichert …";
      const info = {created:now.toISOString(), from:who, link, note, photos:names};
      await gh(`/contents/inbox/${id}/info.json`,{method:"PUT",body:JSON.stringify({message:`Einsendung ${id}`,content:b64utf8(JSON.stringify(info,null,1))})});
      toast("Eingesendet – landet bald in der App"); openInbox(); refreshInboxCount();
    }catch(e){
      err.textContent = e.status===401||e.status===403 ? "Zugang abgelehnt – der Schlüssel ist evtl. abgelaufen." : "Senden fehlgeschlagen ("+e.message+"). Internet prüfen und nochmal versuchen.";
      err.hidden=false; btn.disabled=false; btn.textContent="Einsenden";
    }
  });
  try{
    const q = await loadQueue(); const el = $("#ibQueue"); if(!el) return;
    el.innerHTML = q.length ? `<ul class="queue">${q.map(x=>{
      const d = x.created ? new Date(x.created).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : x.id;
      const nP=(x.photos||[]).filter(n=>/\.pdf$/i.test(n)).length, nI=(x.photos||[]).length-nP;
      const what = [nI?`📷 ${nI} Foto${nI>1?"s":""}`:"", nP?`📄 ${nP} PDF`:"", x.link?"🔗 Link":""].filter(Boolean).join(" · ");
      return `<li>${esc(what||"Einsendung")}${x.note?` – ${esc(x.note)}`:""}<br><small>${esc(d)}${x.from?` · von ${esc(x.from)}`:""} · wartet</small></li>`;}).join("")}</ul>`
      : `<p class="ok-text">Nichts offen – alles eingetragen. ✔</p>`;
  }catch(e){ const el = $("#ibQueue"); if(el) el.innerHTML = `<p class="err-text">Warteliste konnte nicht geladen werden.</p>`; }
}
refreshInboxCount();

const RULES = `rules_version = '2';
service cloud.firestore {

}

    <p class="sub">Dein aktueller Plan wird übernommen. Danach bekommst du einen Einladungslink für die anderen Handys. Jede Familie hat ihren eigenen, privaten Plan.</p>
    <details class="info" style="margin-top:18px"><summary>Für Technik-Fans: eigene Firebase-Datenbank verwenden</summary>
    <p>Zum Einrichten (einmalig, ca. 10 Minuten, kostenlos):</p>
    <ol class="steps">
      <li>Öffne <strong>console.firebase.google.com</strong> und melde dich mit einem Google-Konto an.</li>
      <li><strong>Projekt erstellen</strong>, Name z. B. <code>essensplan</code>. Google Analytics kannst du ausschalten.</li>
      <li>Links im Menü <strong>Databases &amp; Storage → Firestore → Create database</strong> (am Handy erst das Menü ☰ öffnen). Edition <strong>Standard</strong>, Standort in Europa (z. B. <code>eur3</code> oder <code>europe-west3</code>), dann <strong>Production mode</strong>.</li>
      <li>Im Tab <strong>Regeln</strong> alles ersetzen durch den Text unten und <strong>Veröffentlichen</strong>.</li>
      <li>Zahnrad oben links → <strong>Projekteinstellungen</strong> → unten bei „Meine Apps“ das Symbol <code>&lt;/&gt;</code> (Web) → Name eingeben → <strong>App registrieren</strong>.</li>
      <li>Den angezeigten Block mit <code>firebaseConfig</code> komplett kopieren und hier einfügen.</li>
    </ol>
    <h3>Regeln</h3>
    <pre class="code">${esc(RULES)}</pre>
    <div class="bar"><button class="btn" id="copyRules">Regeln kopieren</button></div>
    <h3>firebaseConfig einfügen</h3>
    <textarea class="cfg" id="cfgInput" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  projectId: &quot;…&quot;,&#10;  …&#10;};"></textarea>
    <p class="err-text" id="cfgErr" hidden>Das sieht nicht nach dem firebaseConfig-Block aus. Er muss mindestens apiKey und projectId enthalten.</p>
    <div class="bar" style="margin-top:10px"><button class="btn primary" id="cfgSave">Verbinden</button></div>
    <p class="sub">Dein aktueller Plan wird dabei in den gemeinsamen Plan übernommen.</p></details>`);
  $("#quickShare").addEventListener("click",()=>{
    sync = {c:DEFAULT_FB, p:newPlanId()}; lsSet(sync, LS_SYNC);
    closeSheet(); startSync().then(()=>setTimeout(openSyncSheet,600));
  });
  $("#copyRules").addEventListener("click",()=>copyText(RULES,"Regeln kopiert"));
  $("#cfgSave").addEventListener("click",()=>{
    const cfg = parseConfig($("#cfgInput").value);
    if(!cfg){ $("#cfgErr").hidden = false; return; }
    sync = {c:cfg, p:newPlanId()}; lsSet(sync, LS_SYNC);
    closeSheet(); startSync().then(()=>setTimeout(openSyncSheet,600));
  });
}

/* ---------- "Was haben wir noch zuhause?": Zutaten-Chips direkt auf der Ideen-Seite ---------- */
const FR_QUICK = ["Eier","Käse","Tomaten","Nudeln","Reis","Kartoffeln","Zucchini","Karotten","Paprika","Sahne"];
let frSel = [];
function frNearCount(){ return allDishes().filter(d=>{ if(d.side) return false; const r=frScore(d,frSel); return r.hits.length && r.missing.length<=3; }).length; }
function renderFrChips(){
  $("#zhChips").innerHTML = FR_QUICK.map(t=>`<button type="button" data-frq="${esc(t)}" aria-pressed="${frSel.includes(t)}">${esc(t)}</button>`).join("") + `<button type="button" data-frq-more>＋ weitere</button>`;
  const go = $("#zhGo");
  if(!frSel.length){ go.hidden = true; return; }
  const n = frNearCount();
  go.hidden = false;
  go.innerHTML = n ? `→ ${n} passende Gerichte anzeigen<small>Es fehlen höchstens 3 Zutaten</small>` : `→ Vorschläge anzeigen<small>Kein Gericht fast komplett – Teil-Treffer ansehen</small>`;
}
$("#zhChips").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-frq-more")){ openFridge({have:[...frSel], f:[]}); return; }
  const t = b.dataset.frq; if(!t) return;
  frSel = frSel.includes(t) ? frSel.filter(x=>x!==t) : [...frSel, t];
  renderFrChips();
});
$("#zhGo").addEventListener("click",()=>openFridge({have:[...frSel], f:[]}));
renderFrChips();
$("#fridgeBtn").addEventListener("click",()=>openFridge({have:[...frSel], f:[]}));
