 {id:"s11",N:{kcal:450,p:21,f:11,kh:59,bs:18,gv:490,pm:0,q:"s"},ai:1,kid:1,n:"Minestrone mit weißen Bohnen & Grünkohl",t:35,k:"veg",i:[[1,"Dose","Weiße Bohnen","v"],[200,"g","Grünkohl","g"],[2,"Stk","Karotten","g"],[1,"Stk","Zucchini","g"],[1,"Stangen","Lauch","g"],[400,"g","Stückige Tomaten","v"],[150,"g","Vollkornnudeln","v"],[1.2,"l","Gemüsebrühe (ohne Jodsalz)","v"],[2,"Zehen","Knoblauch","g"]],m:"Gemüse in Olivenöl andünsten, mit Tomaten und Brühe 10 Min. köcheln. Nudeln, Bohnen und Grünkohl dazu und weitere 10 Min. garen."},
 {id:"s12",N:{kcal:530,p:21,f:14,kh:73,bs:15,gv:400,pm:0,q:"s"},ai:1,n:"Quinoa-Taboulé mit Gurke, Tomaten & Minze",t:25,k:"veg",i:[[250,"g","Quinoa","v"],[1,"Stk","Gurke","g"],[4,"Stk","Tomaten","g"],[1,"Bund","Frühlingszwiebeln","g"],[2,"Bund","Petersilie","g"],[1,"Bund","Minze","g"],[2,"Stk","Zitrone","g"],[1,"Dose","Kichererbsen","v"]],m:"Quinoa kochen und abkühlen lassen. Gurke, Tomaten, Frühlingszwiebeln und viele Kräuter fein schneiden, mit Kichererbsen, Zitronensaft und Olivenöl mischen."},
 {id:"s13",N:{kcal:470,p:15,f:22,kh:52,bs:9,gv:470,pm:0,q:"s"},ai:1,n:"Gefüllte Zucchini mit Hirse & Tomate",t:45,k:"veg",i:[[3,"Stk","Zucchini","g"],[150,"g","Hirse","v"],[400,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Paprika","g"],[50,"g","Walnusskerne","v"],[1,"Bund","Basilikum","g"],[0.3,"l","Gemüsebrühe (ohne Jodsalz)","v"]],m:"Hirse in Brühe garen. Zucchini aushöhlen, Fruchtfleisch mit Zwiebel, Paprika und Knoblauch braten und mit Hirse mischen. Zucchini füllen, auf Tomatensauce 20 Min. backen, mit Walnüssen und Basilikum bestreuen."},
 {id:"s14",N:{kcal:730,p:35,f:24,kh:86,bs:10,gv:420,pm:0,q:"s"},ai:1,kid:1,n:"Rinderhack-Gemüse-Reispfanne mit Paprika",t:30,k:"fleisch",i:[[300,"g","Rinderhack","f"],[250,"g","Basmatireis","v"],[2,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[200,"g","Erbsen","t"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[400,"g","Stückige Tomaten","v"],[1,"Bund","Petersilie","g"]],m:"Reis kochen. Hack krümelig braten, Zwiebel, Knoblauch, Paprika und Zucchini mitbraten. Tomaten und Erbsen dazu, 5 Min. köcheln, Reis unterheben."},
 {id:"s15",N:{kcal:520,p:19,f:20,kh:58,bs:17,gv:220,pm:0,q:"s"},ai:1,n:"Grünkohl-Kartoffel-Pfanne mit Bohnen & Walnüssen",t:30,k:"veg",i:[[800,"g","Kartoffeln (festkochend)","g"],[300,"g","Grünkohl","g"],[1,"Dose","Weiße Bohnen","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[50,"g","Walnusskerne","v"],[1,"Stk","Zitrone","g"]],m:"Kartoffeln vorkochen und in Scheiben knusprig braten. Zwiebel, Knoblauch und Grünkohl mitbraten, Bohnen unterheben. Mit Zitrone, Senf und Walnüssen abschmecken."},
 {id:"s16",N:{kcal:670,p:17,f:28,kh:81,bs:18,gv:0,pm:0,q:"s"},ai:1,kid:1,n:"Warmer Haferbrei mit Beeren, Leinsamen & Walnüssen",t:10,k:"veg",i:[[200,"g","Haferflocken","v"],[750,"ml","Haferdrink (ohne Jodzusatz)","k"],[300,"g","Beerenmischung","t"],[2,"Stk","Bananen","g"],[30,"g","Leinsamen (geschrotet)","v"],[40,"g","Walnusskerne","v"]],m:"Haferflocken mit Haferdrink aufkochen und 3–4 Min. quellen lassen. Mit zerdrückter Banane und Zimt süßen, mit erwärmten Beeren, Leinsamen und Walnüssen servieren."},
 {id:"s17",N:{kcal:570,p:21,f:20,kh:73,bs:14,gv:310,pm:0,q:"s"},ai:1,n:"Kurkuma-Blumenkohl aus dem Ofen mit Kichererbsen & Tahin",t:35,k:"veg",i:[[1,"Stk","Blumenkohl","g"],[1,"Dose","Kichererbsen","v"],[200,"g","Basmatireis","v"],[100,"g","Babyspinat","g"],[1,"Glas","Tahin (Sesammus)","v"],[1,"Stk","Zitrone","g"],[1,"Bund","Petersilie","g"]],m:"Blumenkohl und Kichererbsen mit Kurkuma, Kreuzkümmel und Öl 25 Min. rösten. Reis kochen. Mit Spinat, Tahin-Zitronen-Soße und Petersilie servieren."},
 {id:"s18",N:{kcal:670,p:25,f:12,kh:107,bs:21,gv:590,pm:0,q:"s"},ai:1,kid:1,n:"Vollkornspaghetti mit Ratatouille-Sauce",t:30,k:"veg",i:[[400,"g","Vollkornnudeln","v"],[1,"Stk","Aubergine","g"],[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[800,"g","Stückige Tomaten","v"],[1,"Bund","Basilikum","g"]],m:"Aubergine, Zucchini, Paprika, Zwiebel und Knoblauch in Olivenöl anbraten, Tomaten und Kräuter dazu, 15 Min. köcheln. Mit Vollkornspaghetti und Basilikum servieren."},
 {id:"g01",N:{kcal:570,p:21,f:13,kh:89,bs:7,gv:200,pm:0,q:"s"},gf:1,kid:1,n:"Pilz-Erbsen-Risotto",t:35,k:"veg",i:[[300,"g","Risottoreis","v"],[300,"g","Champignons","g"],[200,"g","Erbsen","t"],[1,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[1,"l","Gemüsebrühe (glutenfrei)","v"],[50,"g","Parmesan am Stück","k"]],m:"Zwiebel und Reis andünsten, nach und nach heiße Brühe angießen und 18–20 Min. rühren. Pilze separat braten, mit Erbsen unterheben, Parmesan und Butter einrühren."},
 {id:"g02",N:{kcal:780,p:28,f:44,kh:60,bs:11,gv:130,pm:0,q:"s"},gf:1,kid:1,n:"Kartoffel-Brokkoli-Gratin",t:55,k:"veg",i:[[1000,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Brokkoli","g"],[200,"ml","Sahne","k"],[200,"ml","Milch","k"],[150,"g","Gouda gerieben","k"],[1,"Zehen","Knoblauch","g"]],m:"Kartoffeln in dünne Scheiben hobeln, mit Brokkoli in eine Form schichten. Sahne-Milch mit Knoblauch und Gewürzen darübergießen, mit Käse bestreuen und ca. 45 Min. backen."},
 {id:"g03",N:{kcal:580,p:20,f:18,kh:82,bs:10,gv:410,pm:0,q:"s"},gf:1,n:"Cremige Polenta mit Paprika-Tomaten-Ragout & Mozzarella",t:30,k:"veg",i:[[250,"g","Polenta","v"],[3,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[400,"g","Stückige Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Kugeln","Mozzarella","k"],[1,"Bund","Basilikum","g"],[1,"l","Gemüsebrühe (glutenfrei)","v"]],m:"Paprika, Zucchini, Zwiebel und Knoblauch anbraten, mit Tomaten 15 Min. schmoren. Polenta in Brühe einrühren und quellen lassen. Mit Ragout, Mozzarella und Basilikum servieren."},
 {id:"g04",N:{kcal:780,p:31,f:24,kh:105,bs:14,gv:450,pm:0,q:"s"},gf:1,kid:1,n:"Mexikanische Reispfanne mit Bohnen & Mais",t:25,k:"veg",i:[[250,"g","Reis","v"],[1,"Dose","Kidneybohnen","v"],[1,"Dose","Mais","v"],[2,"Stk","Paprika","g"],[1,"Stk","Zwiebel","g"],[400,"g","Stückige Tomaten","v"],[0.3,"l","Gemüsebrühe (glutenfrei)","v"],[150,"g","Gouda gerieben","k"],[1,"Stk","Limette","g"]],m:"Zwiebel und Paprika anbraten, Reis kurz mitrösten, mit Tomaten und Brühe 18 Min. garen. Bohnen und Mais unterheben, mit Käse und Limette servieren."},
 {id:"g05",N:{kcal:530,p:41,f:11,kh:60,bs:11,gv:100,pm:0,q:"s"},gf:1,kid:1,n:"Seelachs mit Zitronen-Kartoffelpüree & Erbsen",t:30,k:"fisch",i:[[450,"g","Seelachsfilet","f"],[900,"g","Kartoffeln (mehligkochend)","g"],[200,"ml","Milch","k"],[300,"g","Erbsen","t"],[1,"Stk","Zitrone","g"],[1,"Bund","Petersilie","g"]],m:"Kartoffeln kochen und mit Milch, Butter und Zitronenschale zu Püree stampfen. Seelachs ohne Mehl in Butter braten, Erbsen kurz garen, mit Petersilie servieren."},
 {id:"g06",N:{kcal:620,p:40,f:10,kh:87,bs:9,gv:340,pm:0,q:"s"},gf:1,kid:1,n:"Hähnchen-Paella mit Paprika & Erbsen",t:35,k:"fleisch",i:[[350,"g","Hähnchenbrustfilet","f"],[250,"g","Risottoreis","v"],[2,"Stk","Paprika","g"],[200,"g","Erbsen","t"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[400,"g","Stückige Tomaten","v"],[0.6,"l","Gemüsebrühe (glutenfrei)","v"],[1,"Stk","Zitrone","g"]],m:"Hähnchen anbraten und herausnehmen. Zwiebel, Paprika, Knoblauch und Reis mit Kurkuma und Paprikapulver anschwitzen, Tomaten und Brühe dazu, 20 Min. garen. Hähnchen und Erbsen unterheben."},
 {id:"g07",N:{kcal:580,p:17,f:16,kh:86,bs:11,gv:290,pm:0,q:"s"},gf:1,cu:"asia",n:"Reisnudeln mit Gemüse & Erdnuss-Soße",t:20,k:"veg",i:[[250,"g","Reisnudeln","v"],[2,"Stk","Karotten","g"],[1,"Stk","Paprika","g"],[1,"Stk","Brokkoli","g"],[1,"Bund","Frühlingszwiebeln","g"],[1,"Glas","Erdnussmus","v"],[1,"Flasche","Tamari (glutenfreie Sojasauce)","v"],[1,"Stk","Limette","g"],[1,"Stk","Ingwer (klein)","g"]],m:"Reisnudeln einweichen. Gemüse im Wok braten. Soße aus Erdnussmus, Tamari, Limette, Ingwer und Wasser verrühren, alles mischen. Nur Tamari mit Glutenfrei-Hinweis verwenden."},
 {id:"g08",N:{kcal:520,p:34,f:12,kh:62,bs:9,gv:230,pm:0,q:"s"},gf:1,kid:1,n:"Kartoffel-Rösti mit Kräuterquark & Salat",t:30,k:"veg",i:[[1000,"g","Kartoffeln (festkochend)","g"],[2,"Stk","Eier","k"],[500,"g","Quark","k"],[1,"Bund","Schnittlauch","g"],[1,"Kopf","Salat","g"],[1,"Stk","Gurke","g"]],m:"Kartoffeln grob reiben, ausdrücken, mit Ei und Salz mischen (ohne Mehl) und als Rösti knusprig braten. Mit Schnittlauchquark und Gurkensalat servieren."},
 {id:"g09",N:{kcal:460,p:30,f:13,kh:52,bs:13,gv:330,pm:0,q:"s"},gf:1,kid:1,n:"Linsennudeln mit Tomaten-Spinat-Sauce",t:20,k:"veg",i:[[250,"g","Linsennudeln (glutenfrei)","v"],[500,"g","Passierte Tomaten","v"],[150,"g","Babyspinat","g"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[40,"g","Parmesan am Stück","k"],[1,"Bund","Basilikum","g"]],m:"Zwiebel und Knoblauch andünsten, Tomaten 10 Min. köcheln, Spinat unterheben. Linsennudeln kochen und mit der Sauce, Parmesan und Basilikum servieren."},
 {id:"g10",N:{kcal:810,p:43,f:34,kh:78,bs:5,gv:300,pm:0,q:"s"},gf:1,kid:1,n:"Hackbällchen in Tomatensauce mit Reis",t:35,k:"fleisch",i:[[400,"g","Rinderhack","f"],[1,"Stk","Eier","k"],[30,"g","Parmesan am Stück","k"],[250,"g","Reis","v"],[800,"g","Stückige Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Bund","Basilikum","g"]],m:"Hack mit Ei, Parmesan, Zwiebel und Gewürzen zu Bällchen formen (ohne Brötchen/Paniermehl), anbraten und in Tomatensauce 15 Min. garen. Mit Reis servieren."},
 {id:"g11",N:{kcal:360,p:7,f:18,kh:39,bs:10,gv:230,pm:0,q:"s"},gf:1,kid:1,n:"Möhren-Kartoffel-Suppe mit Ingwer",t:30,k:"veg",i:[[600,"g","Möhren","g"],[400,"g","Kartoffeln (mehligkochend)","g"],[1,"Stk","Zwiebel","g"],[1,"Stk","Ingwer (klein)","g"],[1,"l","Gemüsebrühe (glutenfrei)","v"],[100,"ml","Sahne","k"],[1,"Bund","Petersilie","g"]],m:"Zwiebel und Ingwer andünsten, Möhren und Kartoffeln mit Brühe 20 Min. kochen, pürieren und mit Sahne verfeinern."},
 {id:"g12",N:{kcal:670,p:35,f:33,kh:57,bs:5,gv:150,pm:0,q:"s"},gf:1,kid:1,n:"Buchweizen-Pfannkuchen mit Käse & Spinat",t:30,k:"veg",i:[[200,"g","Buchweizenmehl","v"],[400,"ml","Milch","k"],[3,"Stk","Eier","k"],[150,"g","Gouda gerieben","k"],[200,"g","Babyspinat","g"],[250,"g","Kirschtomaten","g"]],m:"Teig aus Buchweizenmehl, Milch, Eiern und Salz rühren, dünne Pfannkuchen backen und mit Käse, Spinat und Tomaten füllen (Galettes)."},
 {id:"g13",N:{kcal:570,p:24,f:23,kh:61,bs:11,gv:310,pm:0,q:"s"},gf:1,n:"Quinoa-Gemüse-Pfanne mit Feta",t:25,k:"veg",i:[[250,"g","Quinoa","v"],[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[1,"Stk","Zwiebel","g"],[250,"g","Kirschtomaten","g"],[150,"g","Feta","k"],[1,"Bund","Petersilie","g"],[1,"Stk","Zitrone","g"]],m:"Quinoa kochen. Zwiebel, Zucchini und Paprika anbraten, Tomaten kurz mitgaren, Quinoa unterheben. Mit Feta, Zitrone und Petersilie servieren."},
 {id:"g14",N:{kcal:510,p:30,f:8,kh:70,bs:12,gv:270,pm:0,q:"s"},gf:1,kid:1,n:"Ofenkartoffeln mit Kräuterquark & Ofengemüse",t:45,k:"veg",i:[[1000,"g","Kartoffeln (festkochend)","g"],[2,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[3,"Stk","Karotten","g"],[500,"g","Quark","k"],[1,"Bund","Schnittlauch","g"],[1,"Zehen","Knoblauch","g"]],m:"Kartoffelspalten und Gemüse mit Öl und Gewürzen 35 Min. im Ofen rösten. Quark mit Kräutern und Knoblauch anrühren und dazu servieren."},
 {id:"g15",N:{kcal:850,p:40,f:32,kh:100,bs:7,gv:200,pm:0,q:"s"},gf:1,cu:"indien",kid:1,n:"Hähnchen-Kokos-Curry mit Süßkartoffel & Reis",t:30,k:"fleisch",i:[[350,"g","Hähnchenbrustfilet","f"],[1,"Stk","Süßkartoffel","g"],[1,"Dose","Kokosmilch","v"],[100,"g","Babyspinat","g"],[1,"Stk","Zwiebel","g"],[1,"Stk","Ingwer (klein)","g"],[2,"Zehen","Knoblauch","g"],[250,"g","Basmatireis","v"],[1,"Stk","Limette","g"]],m:"Reis kochen. Hähnchen anbraten, Zwiebel, Ingwer, Knoblauch und Currypulver dazu. Süßkartoffel und Kokosmilch 15 Min. köcheln, Spinat unterheben. Currypulver ohne Weizenzusatz verwenden."},
 {id:"g16",N:{kcal:980,p:30,f:61,kh:77,bs:20,gv:320,pm:0,q:"s"},gf:1,kid:1,n:"Mais-Tortillas mit Bohnen, Avocado & Salsa",t:20,k:"veg",i:[[12,"Stk","Mais-Tortillas (glutenfrei)","b"],[1,"Dose","Kidneybohnen","v"],[2,"Stk","Avocado","g"],[3,"Stk","Tomaten","g"],[1,"Stk","Zwiebel","g"],[1,"Stk","Limette","g"],[200,"g","Schmand","k"],[150,"g","Gouda gerieben","k"]],m:"Bohnen mit Gewürzen erwärmen und zerdrücken. Guacamole und Tomatensalsa anrühren. Mais-Tortillas (100 % Mais) erwärmen und am Tisch füllen."},
 {id:"g17",N:{kcal:760,p:34,f:34,kh:77,bs:8,gv:290,pm:0,q:"s"},gf:1,cu:"asia",n:"Reis-Bowl mit Lachs, Gurke & Avocado",t:25,k:"fisch",i:[[250,"g","Sushireis","v"],[350,"g","Lachsfilet","f"],[1,"Stk","Gurke","g"],[1,"Stk","Avocado","g"],[2,"Stk","Karotten","g"],[1,"Bund","Frühlingszwiebeln","g"],[1,"Flasche","Tamari (glutenfreie Sojasauce)","v"],[1,"Pck","Schwarzer Sesam","v"]],m:"Reis kochen und würzen. Lachs in der Pfanne braten und mit Tamari glasieren. Mit Gurke, Karotten, Avocado und Frühlingszwiebeln in Schalen anrichten."},
 {id:"g18",N:{kcal:890,p:37,f:29,kh:118,bs:7,gv:250,pm:0,q:"s"},gf:1,kid:1,n:"Bolognese mit glutenfreien Nudeln",t:30,k:"fleisch",i:[[300,"g","Rinderhack","f"],[400,"g","Mais-Reis-Nudeln (glutenfrei)","v"],[500,"g","Passierte Tomaten","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[40,"g","Parmesan am Stück","k"]],m:"Hack krümelig braten, Zwiebel, Karotten und Knoblauch dazu, mit Tomaten 15 Min. köcheln. Glutenfreie Nudeln nach Packung kochen (nicht zu weich) und mit Parmesan servieren."}

Object.assign(STEPS, {
d01:{v:"Olivenöl, Salz, Pfeffer, 1 Prise Zucker, getrockneter Oregano",s:[
"Einen großen Topf mit reichlich Wasser für die Nudeln aufsetzen.",
"Zwiebel und Knoblauch schälen und sehr fein würfeln.",
"In einem zweiten Topf 2 EL Olivenöl bei mittlerer Hitze erwärmen. Zwiebel darin 3–4 Min. glasig dünsten, Knoblauch dazugeben und 1 Min. mitdünsten, ohne dass er braun wird.",
"Passierte Tomaten dazugießen, mit Salz, Pfeffer, 1 Prise Zucker und ½ TL Oregano würzen. Bei kleiner Hitze offen 10–15 Min. köcheln lassen, gelegentlich umrühren.",
"Sobald das Wasser kocht, kräftig salzen (ca. 1 EL) und die Spaghetti nach Packungsangabe bissfest kochen.",
"Parmesan reiben, Basilikumblätter abzupfen und grob zerreißen.",
"Nudeln abgießen, dabei eine Tasse Nudelwasser auffangen. Sauce abschmecken, bei Bedarf mit etwas Nudelwasser verdünnen.",
"Nudeln mit Sauce mischen oder die Sauce darübergeben, mit Parmesan und Basilikum servieren."]},
d02:{v:"Öl oder Butter, Salz, Pfeffer, Paprikapulver",s:[
"Kartoffeln schälen und in dünne Scheiben (ca. 3 mm) schneiden. Paprika und Zucchini waschen und in kleine Würfel schneiden.",
"In einer großen beschichteten Pfanne (mit Deckel) 2 EL Öl erhitzen. Kartoffelscheiben bei mittlerer Hitze ca. 10–12 Min. braten, bis sie weich und leicht gebräunt sind, dabei öfter wenden. Salzen.",
"Paprika und Zucchini dazugeben und 3–4 Min. mitbraten.",
"Eier in einer Schüssel mit ½ TL Salz, Pfeffer und etwas Paprikapulver verquirlen.",
"Hitze auf klein stellen. Eimasse gleichmäßig über das Gemüse gießen, Feta darüberbröseln.",
"Deckel auflegen und die Frittata 8–10 Min. stocken lassen, bis die Oberfläche fest ist.",
"Auf ein Brett gleiten lassen und in Stücke schneiden. Dazu passt ein grüner Salat."]},
d03:{v:"Butter oder Öl, Salz, Pfeffer, Muskat",s:[
"Kartoffeln schälen und in ca. 2 cm große Würfel schneiden.",
"Lauch längs halbieren, gründlich unter fließendem Wasser waschen (zwischen den Schichten sitzt oft Erde) und in Ringe schneiden.",
"In einem großen Topf 1 EL Butter schmelzen, Lauch darin 3–4 Min. andünsten. Ein paar Lauchringe zum Garnieren beiseitelegen.",
"Kartoffeln dazugeben, mit der Brühe aufgießen und aufkochen. Zugedeckt bei mittlerer Hitze ca. 15 Min. köcheln, bis die Kartoffeln weich sind.",
"Suppe mit dem Pürierstab fein pürieren. Sahne einrühren.",
"Mit Salz, Pfeffer und einer Prise Muskat abschmecken. Ist die Suppe zu dick, etwas Wasser dazugeben.",
"Baguette kurz im Ofen aufbacken. Suppe mit den beiseitegelegten Lauchringen servieren."]},
d04:{v:"Butter oder Öl zum Braten, 1 Prise Salz, Zucker, evtl. Zimt",s:[
"Mehl, Milch, Eier und 1 Prise Salz in einer Schüssel mit dem Schneebesen glatt rühren, bis keine Klümpchen mehr da sind.",
"Teig 5–10 Min. quellen lassen – dann werden die Pfannkuchen geschmeidiger.",
"Eine beschichtete Pfanne bei mittlerer Hitze erwärmen und dünn mit Butter oder Öl ausstreichen.",
"Eine Schöpfkelle Teig hineingeben und durch Schwenken der Pfanne dünn verteilen.",
"Ca. 1–2 Min. backen, bis die Unterseite goldbraun ist und sich der Rand löst. Wenden und die zweite Seite ca. 1 Min. backen.",
"Fertige Pfannkuchen auf einem Teller im Ofen bei 80 °C warm halten, bis alle gebacken sind.",
"Mit Apfelmus, etwas Zucker und nach Wunsch Zimt servieren."]},
d05:{v:"Öl, Salz, Pfeffer, Paprikapulver, Kreuzkümmel",s:[
"Kidneybohnen und Mais in ein Sieb geben, abspülen und abtropfen lassen.",
"Paprika waschen und klein würfeln. Salat waschen, trocken schleudern und in Streifen schneiden.",
"In einer Pfanne 1 EL Öl erhitzen, Paprika 2–3 Min. anbraten. Bohnen und Mais dazugeben und 3 Min. mit erhitzen.",
"Mit Salz, Pfeffer, 1 TL Paprikapulver und ½ TL Kreuzkümmel würzen. Wer mag, drückt einen Teil der Bohnen mit der Gabel leicht an.",
"Wraps nacheinander in einer trockenen Pfanne je Seite ca. 20 Sek. erwärmen (oder kurz in die Mikrowelle).",
"Wraps mit Schmand bestreichen, Füllung, Käse und Salat daraufgeben.",
"Unten einschlagen, seitlich einrollen und sofort essen."]},
d06:{v:"Olivenöl, Salz, Pfeffer, Muskat",s:[
"Spinat auftauen lassen (am einfachsten morgens in den Kühlschrank legen oder kurz in der Mikrowelle). Dann gut ausdrücken.",
"Knoblauch schälen und fein hacken. Parmesan reiben.",
"In einer großen Pfanne 2 EL Öl erhitzen. Gnocchi darin bei mittlerer bis starker Hitze ca. 6–8 Min. braten, bis sie rundum goldbraun sind. Nicht zu oft rühren, sonst bräunen sie nicht.",
"Hitze reduzieren, Knoblauch dazugeben und 1 Min. mitbraten.",
"Spinat dazugeben und 2 Min. erhitzen.",
"Frischkäse und 3–4 EL Wasser einrühren, bis eine cremige Sauce entsteht. Mit Salz, Pfeffer und Muskat abschmecken.",
"Mit Parmesan bestreut servieren."]},
d07:{v:"Olivenöl, Salz, Pfeffer, Oregano, 1 TL Paprikapulver, evtl. 1 EL Tomatenmark",s:[
"Zwiebel schälen und fein würfeln. Karotten schälen und fein würfeln oder grob raspeln.",
"Rote Linsen in einem Sieb kurz abspülen.",
"In einem Topf 2 EL Öl erhitzen. Zwiebel und Karotten bei mittlerer Hitze 5 Min. anschwitzen. Wer hat, 1 EL Tomatenmark 1 Min. mitrösten.",
"Linsen, passierte Tomaten und 300 ml Wasser dazugeben. Aufkochen und bei kleiner Hitze 15 Min. köcheln lassen, bis die Linsen weich sind. Zwischendurch umrühren und bei Bedarf etwas Wasser nachgießen.",
"Parallel Nudelwasser aufsetzen, salzen und die Spaghetti bissfest kochen.",
"Sauce mit Salz, Pfeffer, Oregano und Paprikapulver kräftig abschmecken.",
"Nudeln abgießen und mit der Linsen-Bolognese servieren. Dazu passt geriebener Käse."]},
d08:{v:"Neutrales Öl, Sojasauce, Salz, evtl. Sesamöl",s:[
"Tipp: Am besten gelingt der Reis, wenn er vom Vortag ist. Sonst den Reis direkt nach dem Kochen auf einem Blech ausbreiten und abkühlen lassen.",
"Reis nach Packung kochen und abkühlen lassen.",
"Karotten schälen und klein würfeln. Frühlingszwiebeln putzen und in Ringe schneiden, das Dunkelgrüne getrennt aufheben.",
"Eine große Pfanne oder einen Wok mit 2 EL Öl stark erhitzen. Karotten 3 Min. braten, dann das Weiße der Frühlingszwiebeln und die Erbsen (gefroren) dazu, 2 Min. braten.",
"Reis dazugeben und unter Wenden 4–5 Min. kräftig anbraten.",
"Reis zur Seite schieben, Eier in die freie Stelle schlagen, verrühren und stocken lassen. Dann alles vermischen.",
"Mit 2–3 EL Sojasauce und nach Wunsch etwas Sesamöl abschmecken, mit dem Frühlingszwiebelgrün bestreuen."]},
d09:{v:"Salz, Pfeffer, etwas Milch, evtl. Leinöl oder Olivenöl, Kümmel",s:[
"Kartoffeln gründlich waschen, mit Schale in einen Topf geben, mit Wasser bedecken, salzen und nach Wunsch 1 TL Kümmel dazugeben.",
"Aufkochen und zugedeckt ca. 20–25 Min. kochen, bis sie weich sind (mit einem Messer prüfen).",
"Quark mit 3–5 EL Milch glatt rühren, bis er cremig ist.",
"Schnittlauch in feine Röllchen schneiden und unterrühren. Mit Salz und Pfeffer abschmecken.",
"Gurke waschen und in Scheiben oder Sticks schneiden.",
"Kartoffeln abgießen und kurz ausdampfen lassen. Mit oder ohne Schale servieren.",
"Quark auf den Teller geben, nach Wunsch einen Schuss Leinöl darüberträufeln."]},
d10:{v:"Salz, Pfeffer, Muskat",s:[
"Einen großen Topf mit Wasser aufsetzen und salzen.",
"Brokkoli in kleine Röschen teilen, den Stiel schälen und in dünne Scheiben schneiden.",
"Nudeln ins kochende Wasser geben. 5 Min. vor Ende der Garzeit Brokkoli dazugeben.",
"Parmesan reiben.",
"Vor dem Abgießen eine Tasse Nudelwasser auffangen. Nudeln und Brokkoli abgießen und zurück in den Topf geben.",
"Frischkäse, Parmesan und 4–6 EL Nudelwasser dazugeben und bei kleiner Hitze umrühren, bis eine cremige Sauce entsteht.",
"Mit Salz, Pfeffer und etwas Muskat abschmecken und sofort servieren."]},
d11:{v:"Salz, Pfeffer, Muskat",s:[
"Ofen auf 220 °C Ober-/Unterhitze vorheizen.",
"Lauch längs halbieren, waschen und in feine Ringe schneiden. Zwiebel schälen und in dünne Ringe schneiden.",
"Schmand mit Salz, Pfeffer und etwas Muskat verrühren.",
"Flammkuchenteig mit dem Backpapier auf 2 Bleche (oder nacheinander) legen.",
"Teig dünn mit Schmand bestreichen, dabei einen schmalen Rand frei lassen.",
"Lauch und Zwiebel gleichmäßig verteilen, Käse darüberstreuen.",
"Im unteren Drittel des Ofens 12–15 Min. backen, bis der Rand knusprig und goldbraun ist.",
"In Stücke schneiden. Wer mag, gibt für die Erwachsenen etwas Speck oder Schinken dazu."]},
d12:{v:"Olivenöl, Salz, Pfeffer, evtl. Kreuzkümmel und frische Kräuter",s:[
"Couscous in eine Schüssel geben. 250 ml Wasser mit ½ TL Salz (oder Brühe) aufkochen, darübergießen, abdecken und 5 Min. quellen lassen.",
"Couscous mit einer Gabel auflockern und abkühlen lassen.",
"Gurke und Paprika waschen und in kleine Würfel schneiden.",
"Kichererbsen in einem Sieb abspülen und abtropfen lassen.",
"Zitrone auspressen. Saft mit 3 EL Olivenöl, Salz, Pfeffer und nach Wunsch einer Prise Kreuzkümmel verrühren.",
"Couscous, Gemüse, Kichererbsen und Dressing mischen.",
"Feta darüberbröseln. Schmeckt lauwarm oder kalt und eignet sich gut für den nächsten Tag."]},
d13:{v:"Salz, Pfeffer, Oregano, 1 Prise Zucker",s:[
"Wasser für die Tortellini aufsetzen und salzen.",
"Passierte Tomaten in einem Topf aufkochen, Sahne einrühren.",
"Mit Salz, Pfeffer, ½ TL Oregano und 1 Prise Zucker würzen und bei kleiner Hitze 5 Min. köcheln.",
"Tortellini nach Packungsangabe kochen (meist 2–4 Min.).",
"Basilikumblätter abzupfen.",
"Tortellini abgießen und direkt in der Sauce schwenken.",
"Mit Basilikum servieren, nach Wunsch mit geriebenem Käse."]},
d14:{v:"Butter, Salz, Pfeffer, ein Schuss Milch, evtl. Schnittlauch",s:[
"Karotten schälen, Gurke waschen, beides in Sticks schneiden und auf einen Teller legen.",
"Brot in Scheiben schneiden (nach Wunsch toasten).",
"Eier mit 4 EL Milch, ½ TL Salz und etwas Pfeffer verquirlen.",
"In einer beschichteten Pfanne 1 EL Butter bei mittlerer Hitze schmelzen.",
"Eimasse hineingeben, kurz warten und dann mit einem Pfannenwender immer wieder vom Rand zur Mitte schieben.",
"Pfanne vom Herd nehmen, wenn das Rührei noch leicht feucht glänzt – es gart nach.",
"Mit Brot und Rohkost servieren."]},
d15:{v:"Öl, 2 TL Currypulver, Salz, evtl. 1 TL Ingwer, Zitronensaft",s:[
"Reis nach Packungsangabe kochen.",
"Zwiebel schälen und fein würfeln. Süßkartoffel schälen und in ca. 1,5 cm große Würfel schneiden.",
"Kichererbsen abspülen und abtropfen lassen.",
"In einem Topf 1 EL Öl erhitzen. Zwiebel 3 Min. anschwitzen, Süßkartoffel dazugeben und 2 Min. mitbraten.",
"2 TL Currypulver darüberstäuben und kurz mitrösten, bis es duftet.",
"Kokosmilch und 100 ml Wasser dazugießen, aufkochen und zugedeckt 12–15 Min. köcheln, bis die Süßkartoffel weich ist.",
"Kichererbsen dazugeben und 3 Min. erwärmen. Spinat unterheben, bis er zusammenfällt.",
"Mit Salz und etwas Zitronensaft abschmecken und mit Reis servieren."]},
d16:{v:"Salz, Pfeffer, Paprikapulver, Kreuzkümmel, Öl",s:[
"Kidneybohnen abspülen und in einer Schüssel mit einer Gabel grob zerdrücken. Mit Salz, Pfeffer, 1 TL Paprikapulver und ½ TL Kreuzkümmel würzen.",
"Tomaten waschen und klein würfeln.",
"Auf eine Hälfte jedes Wraps Bohnenmus, Tomaten und Käse verteilen, die andere Hälfte darüberklappen.",
"Eine große Pfanne bei mittlerer Hitze mit wenig Öl auspinseln.",
"Quesadillas je Seite 2–3 Min. braten, bis sie goldbraun sind und der Käse schmilzt. Vorsichtig mit einem breiten Pfannenwender wenden.",
"Fertige Quesadillas im Ofen bei 80 °C warm halten.",
"In Dreiecke schneiden und mit Schmand zum Dippen servieren."]},
d17:{v:"2–3 EL Zucker, 1 Prise Salz, evtl. Vanillezucker",s:[
"Milch mit 2–3 EL Zucker, 1 Prise Salz und nach Wunsch Vanillezucker in einem Topf unter Rühren aufkochen. Aufpassen, Milch kocht schnell über.",
"Grieß mit dem Schneebesen einrühren, damit keine Klümpchen entstehen.",
"Bei kleiner Hitze unter Rühren 3–5 Min. quellen lassen, bis der Brei dick wird.",
"Topf vom Herd nehmen und kurz ruhen lassen – der Brei zieht noch nach.",
"Beeren in einem kleinen Topf mit 1 EL Zucker 3–4 Min. erwärmen, bis sie Saft ziehen.",
"Grießbrei in Schalen geben und die warmen Beeren darübergeben."]},
d18:{v:"Olivenöl, Salz, Pfeffer, getrocknete italienische Kräuter, evtl. 1 EL Tomatenmark",s:[
"Karotten schälen, Zucchini waschen, beides in kleine Würfel schneiden.",
"Weiße Bohnen abspülen und abtropfen lassen.",
"In einem Topf 1 EL Öl erhitzen, Gemüse 4–5 Min. andünsten. Nach Wunsch 1 EL Tomatenmark kurz mitrösten.",
"Mit der Brühe aufgießen, 1 TL italienische Kräuter dazugeben und 10 Min. köcheln.",
"Suppennudeln und Bohnen dazugeben und nach Packungsangabe (ca. 6–8 Min.) weiterköcheln.",
"Mit Salz und Pfeffer abschmecken. Wird die Suppe zu dick, etwas Wasser nachgießen.",
"Parmesan reiben und über die Suppe streuen."]},
d19:{v:"Salz, Pfeffer, Oregano, Olivenöl",s:[
"Ofen auf 220 °C Ober-/Unterhitze vorheizen.",
"Passierte Tomaten mit Salz, Pfeffer und 1 TL Oregano würzen.",
"Paprika waschen und in Streifen schneiden. Champignons putzen und in Scheiben schneiden. Mozzarella abtropfen lassen und zerzupfen.",
"Pizzateig mit dem Backpapier auf ein Blech legen.",
"Teig mit der Tomatensauce bestreichen, dabei einen Rand frei lassen.",
"Gemüse und Mozzarella darauf verteilen, mit etwas Olivenöl beträufeln.",
"Im unteren Drittel ca. 15 Min. backen, bis der Rand goldbraun ist.",
"Kurz ruhen lassen und in Stücke schneiden."]},
d20:{v:"Öl, Ketchup, Senf oder Mayonnaise",s:[
"Tomaten und Gurke waschen und in Scheiben schneiden. Salatblätter waschen und trocken tupfen.",
"Veggie-Patties nach Packungsangabe in einer Pfanne mit etwas Öl braten (meist 3–4 Min. pro Seite).",
"Burgerbrötchen aufschneiden und mit der Schnittfläche kurz in der Pfanne oder im Toaster rösten.",
"Unterseite mit Ketchup, Senf oder Mayo bestreichen.",
"Salat, Patty, Tomate und Gurke daraufschichten, Deckel auflegen.",
"Dazu passen Rohkost oder Ofenkartoffeln."]},
d21:{v:"Olivenöl, Salz, Pfeffer, 1 TL Paprikapulver edelsüß, ½ TL Kreuzkümmel, evtl. Chili",s:[
"Zwiebel schälen und würfeln. Paprika waschen und in Streifen oder Würfel schneiden.",
"In einer großen Pfanne (mit Deckel) 2 EL Olivenöl erhitzen. Zwiebel und Paprika bei mittlerer Hitze 5–6 Min. weich dünsten.",
"Paprikapulver und Kreuzkümmel dazugeben und kurz mitrösten.",
"Stückige Tomaten dazugeben, salzen und pfeffern und 10 Min. offen köcheln lassen, bis die Sauce etwas eindickt.",
"Mit einem Löffel 6 Mulden in die Sauce drücken und je ein Ei hineinschlagen.",
"Deckel auflegen und bei kleiner Hitze 6–8 Min. garen, bis das Eiweiß fest und das Eigelb noch weich ist.",
"Feta darüberbröseln. Baguette aufbacken und direkt aus der Pfanne essen. Chili nur für die Erwachsenen."]},
d22:{v:"Butter, Salz, Pfeffer, Essig und Öl für den Salat",s:[
"Zwiebeln schälen, halbieren und in dünne Halbringe schneiden.",
"In einer großen Pfanne 2 EL Butter erhitzen. Zwiebeln bei mittlerer Hitze 8–10 Min. goldbraun braten, salzen und herausnehmen.",
"Salat waschen, trocken schleudern und mit Essig, Öl, Salz und Pfeffer anmachen.",
"In derselben Pfanne 1 EL Butter erhitzen und die Spätzle 3–4 Min. anbraten.",
"Hitze reduzieren, Käse unterheben und rühren, bis er geschmolzen ist. Bei Bedarf 2–3 EL Wasser dazugeben, damit es cremig wird.",
"Pfeffern und die Röstzwiebeln obenauf verteilen. Mit Salat servieren."]},
d23:{v:"Neutrales Öl, 3 EL Sojasauce, 1 TL Honig, evtl. Ingwer, Sesam",s:[
"Tofu aus der Packung nehmen, zwischen Küchenpapier gut ausdrücken und in Würfel schneiden.",
"Brokkoli in kleine Röschen teilen. Karotten schälen und in dünne Streifen schneiden. Frühlingszwiebeln in Ringe schneiden.",
"Wasser für die Nudeln aufsetzen.",
"In einer großen Pfanne 2 EL Öl erhitzen. Tofu bei starker Hitze 6–8 Min. rundum knusprig braten und herausnehmen.",
"Brokkoli und Karotten in die Pfanne geben und 4–5 Min. braten, sie sollen noch Biss haben.",
"Nudeln nach Packungsangabe garen (meist 3–4 Min.) und abgießen.",
"Nudeln, Tofu und Frühlingszwiebeln zum Gemüse geben. Sojasauce und Honig verrühren, dazugeben und alles durchschwenken. Nach Wunsch mit Sesam bestreuen."]},
d24:{v:"Öl, Salz, Pfeffer, Paprikapulver, evtl. Sojasauce",s:[
"Reis nach Packungsangabe kochen.",
"Hähnchen trocken tupfen und in Streifen schneiden. Paprika und Zucchini waschen und in mundgerechte Stücke schneiden.",
"In einer großen Pfanne 1 EL Öl stark erhitzen. Hähnchen in 3–4 Min. rundum anbraten, mit Salz, Pfeffer und Paprikapulver würzen und herausnehmen.",
"Nochmals etwas Öl in die Pfanne geben, Gemüse 5–6 Min. bei mittlerer bis starker Hitze braten.",
"Hähnchen zurück in die Pfanne geben und 2 Min. mitbraten, bis es durchgegart ist (innen nicht mehr rosa).",
"Mit Salz, Pfeffer und nach Wunsch einem Schuss Sojasauce abschmecken.",
"Mit Reis servieren."]},
d25:{v:"Butter, Salz, Muskat, Öl",s:[
"Kartoffeln schälen, in gleich große Stücke schneiden und in Salzwasser zugedeckt ca. 18–20 Min. weich kochen.",
"Milch in einem kleinen Topf erwärmen (nicht kochen).",
"Fischstäbchen in einer Pfanne mit etwas Öl bei mittlerer Hitze nach Packungsangabe braten (ca. 4 Min. pro Seite), bis sie goldbraun sind.",
"Erbsen in wenig Salzwasser 3–4 Min. kochen und abgießen, mit einem Stück Butter verfeinern.",
"Kartoffeln abgießen, kurz ausdampfen lassen und mit dem Kartoffelstampfer zerdrücken.",
"Warme Milch und 1–2 EL Butter unterrühren, bis ein cremiges Püree entsteht. Mit Salz und Muskat abschmecken.",
"Alles zusammen servieren, nach Wunsch mit Zitronenspalten."]},
d26:{v:"Olivenöl, Salz, Pfeffer, evtl. Dill oder Petersilie",s:[
"Nudelwasser aufsetzen und salzen.",
"Lachs trocken tupfen und in ca. 2 cm große Würfel schneiden.",
"Zitrone heiß waschen, die Schale fein abreiben und den Saft auspressen.",
"Spaghetti bissfest kochen.",
"In einer großen Pfanne 1 EL Öl erhitzen und den Lachs bei mittlerer Hitze 2–3 Min. vorsichtig braten, salzen und herausnehmen.",
"Crème fraîche, Zitronenschale und 2 EL Zitronensaft in die Pfanne geben und kurz erwärmen. Mit Salz und Pfeffer abschmecken.",
"Nudeln abgießen (etwas Nudelwasser auffangen), in die Sauce geben und mit etwas Nudelwasser cremig schwenken.",
"Lachs vorsichtig unterheben und mit Kräutern bestreut servieren."]},
d27:{v:"Öl, Salz, Pfeffer, Oregano, 1 EL Tomatenmark, evtl. 1 Prise Zucker",s:[
"Zwiebel schälen und fein würfeln. Karotte schälen und fein würfeln oder reiben.",
"In einem großen Topf 1 EL Öl stark erhitzen. Hackfleisch darin 5–6 Min. krümelig braten, bis es gebräunt ist.",
"Zwiebel und Karotte dazugeben und 3 Min. mitbraten. 1 EL Tomatenmark einrühren und 1 Min. rösten.",
"Passierte Tomaten und 100 ml Wasser dazugeben, mit Salz, Pfeffer, Oregano und 1 Prise Zucker würzen.",
"Bei kleiner Hitze mindestens 15 Min. köcheln lassen – je länger, desto besser.",
"In der Zwischenzeit Spaghetti in Salzwasser bissfest kochen.",
"Sauce abschmecken und mit den Nudeln servieren, nach Wunsch mit geriebenem Parmesan."]},
d28:{v:"Öl, Salz, Pfeffer, 2 TL Paprikapulver, 1 TL Kreuzkümmel, 1 EL Tomatenmark, Chili nach Geschmack",s:[
"Reis nach Packungsangabe kochen.",
"Zwiebel schälen und fein würfeln. Bohnen und Mais abspülen und abtropfen lassen.",
"In einem großen Topf 1 EL Öl stark erhitzen, Hackfleisch 5 Min. krümelig anbraten.",
"Zwiebel dazugeben und 2–3 Min. mitbraten. Tomatenmark, Paprikapulver und Kreuzkümmel einrühren und 1 Min. rösten.",
"Passierte Tomaten und 150 ml Wasser dazugeben, salzen und 10 Min. köcheln.",
"Bohnen und Mais dazugeben und weitere 5–10 Min. köcheln.",
"Für das Kind eine Portion abnehmen, dann den Rest nach Geschmack mit Chili schärfen.",
"Mit Reis servieren, dazu passt ein Klecks Schmand."]},
d29:{v:"Öl, Salz, Pfeffer, Paprikapulver, evtl. Petersilie",s:[
"Nudelwasser aufsetzen und salzen.",
"Putenbrust trocken tupfen und in dünne Streifen schneiden. Champignons putzen und in Scheiben schneiden.",
"Bandnudeln nach Packungsangabe kochen.",
"In einer großen Pfanne 1 EL Öl stark erhitzen, Putenstreifen 3 Min. scharf anbraten, mit Salz, Pfeffer und Paprikapulver würzen und herausnehmen.",
"Champignons in die Pfanne geben und 4–5 Min. braten, bis sie gebräunt sind.",
"Sahne angießen, aufkochen und 2–3 Min. köcheln lassen.",
"Fleisch zurück in die Sauce geben und 2 Min. ziehen lassen. Abschmecken.",
"Mit den Nudeln servieren, nach Wunsch mit gehackter Petersilie."]},
d30:{v:"Olivenöl, Salz, Pfeffer, 1–2 Zehen Knoblauch (optional), Oregano",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Kirschtomaten waschen und halbieren. Knoblauch nach Wunsch fein hacken.",
"Gnocchi (roh aus der Packung), Tomaten, Knoblauch, 3 EL Olivenöl, Salz, Pfeffer und 1 TL Oregano in einer Auflaufform mischen.",
"Im Ofen 15 Min. backen, dabei einmal umrühren.",
"Mozzarella abtropfen lassen, in Stücke zupfen und darauf verteilen.",
"Weitere 5–8 Min. backen, bis der Käse geschmolzen ist.",
"Mit Basilikumblättern bestreut servieren."]}
});

d31:{v:"Öl, Salz, Pfeffer, 1 TL Currypulver, evtl. Ingwer, Kürbiskerne",s:[
"Hokkaido gründlich waschen (die Schale kann dranbleiben und wird beim Kochen weich). Halbieren, Kerne mit einem Löffel herauskratzen und das Fruchtfleisch in Würfel schneiden.",
"Zwiebel schälen und würfeln.",
"In einem großen Topf 1 EL Öl erhitzen, Zwiebel 3 Min. andünsten. Kürbis dazugeben, 1 TL Curry darüberstäuben und 2 Min. mitdünsten.",
"Mit der Brühe aufgießen, aufkochen und zugedeckt ca. 15 Min. köcheln, bis der Kürbis weich ist.",
"Kokosmilch dazugeben (ein paar Löffel zum Garnieren aufheben) und alles fein pürieren.",
"Mit Salz, Pfeffer und nach Wunsch etwas geriebenem Ingwer abschmecken.",
"Mit einem Klecks Kokosmilch und gerösteten Kürbiskernen servieren, dazu Baguette."]},
d32:{v:"Öl, Butter, Salz, Pfeffer, 1 TL Zucker, Oregano oder Basilikum",s:[
"Zwiebel schälen und würfeln. In einem Topf 1 EL Öl erhitzen und die Zwiebel 3 Min. andünsten.",
"Stückige Tomaten und Brühe dazugeben, mit Salz, Pfeffer, 1 TL Zucker und Kräutern würzen und 10 Min. köcheln.",
"Suppe fein pürieren und abschmecken. Wer mag, rührt einen Schuss Sahne oder Milch ein.",
"Für die Käsetoasts je 2 Toastscheiben mit Gouda belegen und zusammenklappen.",
"Außenseiten dünn mit Butter bestreichen.",
"In einer Pfanne bei mittlerer Hitze je Seite 2–3 Min. goldbraun braten, bis der Käse schmilzt.",
"Toasts diagonal halbieren und zur Suppe servieren – zum Eintunken."]},
d33:{v:"Öl, Salz, Pfeffer, Paprikapulver, Knoblauch, Muskat",s:[
"Ofen auf 220 °C Ober-/Unterhitze vorheizen. Blech mit Backpapier auslegen.",
"Kartoffeln waschen (oder schälen) und in ca. 1 cm dicke Stifte schneiden. Mit einem Küchentuch trocken tupfen.",
"Mit 2 EL Öl, Salz und etwas Paprikapulver mischen und nebeneinander auf dem Blech verteilen.",
"Ca. 25–30 Min. backen, nach 15 Min. einmal wenden, bis sie goldbraun und knusprig sind.",
"Spinat mit 1 gehackten Knoblauchzehe und 2 EL Wasser in einem Topf bei mittlerer Hitze auftauen und erhitzen. Mit Salz, Pfeffer und Muskat würzen.",
"Kurz vor Ende in einer Pfanne mit etwas Öl die Spiegeleier braten.",
"Pommes, Spinat und Ei zusammen servieren."]},
d34:{v:"Öl, Butter, Salz, Pfeffer, evtl. ein Schuss Weißwein (für Erwachsene)",s:[
"Brühe in einem Topf erhitzen und warm halten.",
"Zwiebel schälen und sehr fein würfeln. Parmesan reiben.",
"In einem breiten Topf 1 EL Öl und 1 EL Butter erhitzen. Zwiebel 3 Min. glasig dünsten.",
"Reis dazugeben und unter Rühren 1–2 Min. glasig anschwitzen.",
"Eine Kelle heiße Brühe dazugeben und rühren, bis sie fast aufgesogen ist. Dann die nächste Kelle – so weiter für ca. 18 Min., bis der Reis cremig und noch leicht bissfest ist.",
"In den letzten 5 Min. die gefrorenen Erbsen dazugeben.",
"Topf vom Herd nehmen, Parmesan und 1 EL Butter unterrühren. Mit Salz und Pfeffer abschmecken, 2 Min. ruhen lassen und servieren."]},
d35:{v:"Salz, Pfeffer, evtl. etwas Olivenöl",s:[
"Fusilli in reichlich Salzwasser bissfest kochen.",
"Abgießen, kalt abschrecken und gut abtropfen lassen.",
"Kirschtomaten waschen und halbieren. Mozzarella abtropfen lassen und würfeln.",
"Nudeln mit dem Pesto mischen. Ist der Salat zu trocken, einen Schuss Olivenöl dazugeben.",
"Tomaten und Mozzarella unterheben, mit Salz und Pfeffer abschmecken.",
"Mindestens 10 Min. durchziehen lassen. Hält sich abgedeckt im Kühlschrank bis zum nächsten Tag – ideal auch für die Brotdose."]},
d36:{v:"Olivenöl, Salz, Pfeffer, evtl. Chiliflocken, Zitronenschale",s:[
"Nudelwasser aufsetzen und salzen.",
"Zucchini waschen, Enden abschneiden und in dünne Scheiben oder Halbmonde schneiden. Knoblauch schälen und in dünne Scheiben schneiden. Parmesan reiben.",
"Spaghetti bissfest kochen.",
"In einer großen Pfanne 3 EL Olivenöl erhitzen. Zucchini bei mittlerer bis starker Hitze 5–7 Min. braten, bis sie goldbraun sind. Salzen.",
"Knoblauch dazugeben und 1 Min. mitbraten, ohne dass er dunkel wird.",
"Vor dem Abgießen eine Tasse Nudelwasser auffangen. Nudeln in die Pfanne geben, mit einem Schuss Nudelwasser und Parmesan durchschwenken.",
"Pfeffern und nach Wunsch mit Chiliflocken und etwas Zitronenschale servieren."]},
d37:{v:"Butter, 3 EL Zucker, 1 Prise Salz, Puderzucker, evtl. Rosinen",s:[
"Eier trennen. Eiweiß mit 1 Prise Salz steif schlagen.",
"Eigelb, Milch, Mehl und 1 EL Zucker zu einem glatten Teig verrühren.",
"Eischnee vorsichtig unter den Teig heben.",
"In einer großen beschichteten Pfanne 2 EL Butter bei mittlerer Hitze schmelzen. Teig hineingeben und ca. 4–5 Min. backen, bis die Unterseite goldbraun ist.",
"Teig vierteln und die Stücke wenden. Weitere 3 Min. backen.",
"Mit zwei Gabeln in mundgerechte Stücke reißen. 1 EL Butter und 2 EL Zucker dazugeben und unter Wenden 2 Min. karamellisieren lassen.",
"Mit Puderzucker bestäuben und mit Apfelmus servieren."]},
d38:{v:"Öl, Butter, Salz, Pfeffer, Essig, Zucker, evtl. Dill, Kümmel",s:[
"Kartoffeln schälen und in 3–5 mm dünne Scheiben schneiden. Mit Küchenpapier trocken tupfen.",
"In einer großen Pfanne 3 EL Öl erhitzen. Kartoffeln hineingeben und bei mittlerer Hitze ca. 15–20 Min. braten. Nur alle paar Minuten wenden, damit sie eine Kruste bekommen.",
"Zwiebel schälen und würfeln. In den letzten 5 Min. zu den Kartoffeln geben. Mit Salz, Pfeffer und nach Wunsch Kümmel würzen.",
"Gurke waschen und in dünne Scheiben hobeln.",
"Für das Dressing 2 EL Essig, 2 EL Öl, Salz und 1 TL Zucker verrühren, mit der Gurke mischen, nach Wunsch Dill dazu.",
"In einer zweiten Pfanne mit etwas Butter die Spiegeleier braten.",
"Bratkartoffeln mit Spiegelei und Gurkensalat servieren."]},
d39:{v:"Olivenöl, Salz, Pfeffer, Kräuter der Provence, evtl. Honig",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Zucchini und Paprika waschen und in mundgerechte Stücke schneiden. Kirschtomaten ganz lassen.",
"Gemüse mit 3 EL Olivenöl, Salz, Pfeffer und 1 TL Kräutern der Provence mischen und auf einem Blech oder in einer großen Form verteilen.",
"Feta in die Mitte legen, mit etwas Öl beträufeln und nach Wunsch mit etwas Honig.",
"Ca. 25 Min. backen, bis das Gemüse weich und leicht gebräunt ist.",
"In der Zwischenzeit Couscous mit 250 ml kochender, gesalzener Brühe übergießen, abdecken und 5 Min. quellen lassen, dann auflockern.",
"Couscous mit dem Ofengemüse servieren, den Feta darüberbröseln."]},
d40:{v:"30 g Butter, Salz, Pfeffer, 1 TL Senf, Muskat",s:[
"Makkaroni in Salzwasser bissfest kochen und abgießen.",
"In einem Topf 30 g Butter schmelzen. Mehl einrühren und 1 Min. anschwitzen, ohne dass es braun wird.",
"Milch nach und nach mit dem Schneebesen einrühren, damit keine Klümpchen entstehen. Aufkochen und 2–3 Min. köcheln, bis die Sauce andickt.",
"Topf vom Herd nehmen und den Cheddar einrühren, bis er geschmolzen ist.",
"Mit Salz, Pfeffer, Senf und einer Prise Muskat abschmecken.",
"Nudeln unterrühren und sofort servieren.",
"Tipp: Mit etwas Käse bestreut 10 Min. bei 200 °C überbacken wird es knusprig."]},
d41:{v:"Öl, Salz, 1 TL Kreuzkümmel, 1 TL Currypulver, Zitronensaft, evtl. Ingwer",s:[
"Zwiebel schälen und würfeln. Karotten schälen und in kleine Stücke schneiden.",
"Linsen in einem Sieb abspülen.",
"In einem Topf 1 EL Öl erhitzen. Zwiebel und Karotten 4 Min. andünsten. Kreuzkümmel und Curry dazugeben und kurz mitrösten.",
"Linsen und Brühe dazugeben, aufkochen und ca. 15 Min. köcheln, bis Linsen und Karotten weich sind.",
"Kokosmilch einrühren und die Suppe fein pürieren.",
"Mit Salz und einem Spritzer Zitronensaft abschmecken.",
"Fladenbrot kurz im Ofen aufbacken und zur Suppe reichen."]},
d42:{v:"Salz, Pfeffer, 1 Knoblauchzehe, evtl. Minze oder Petersilie",s:[
"Ofen auf 180 °C vorheizen oder eine Pfanne bereitstellen.",
"Falafel nach Packungsangabe im Ofen (ca. 10 Min.) oder in der Pfanne mit etwas Öl erwärmen.",
"Für die Sauce die Hälfte der Gurke grob raspeln und leicht ausdrücken. Mit dem Joghurt, 1 gepressten Knoblauchzehe, Salz und Pfeffer verrühren.",
"Restliche Gurke und Tomaten in Würfel schneiden. Salat waschen und in Streifen schneiden.",
"Wraps kurz in einer trockenen Pfanne erwärmen.",
"Wraps mit Sauce bestreichen, Salat, Gemüse und zerdrückte Falafel darauf verteilen und einrollen."]},
d43:{v:"Salz, Muskat, reichlich Öl zum Braten",s:[
"Kartoffeln schälen und auf der feinen Seite der Reibe reiben. Zwiebel schälen und ebenfalls reiben.",
"Masse in ein sauberes Küchentuch geben und kräftig ausdrücken – je trockener, desto knuspriger.",
"Mit Eiern, Mehl, 1 TL Salz und einer Prise Muskat zu einem Teig verrühren.",
"In einer großen Pfanne reichlich Öl (ca. 3–4 mm hoch) stark erhitzen.",
"Pro Puffer 1–2 EL Teig in die Pfanne geben und flach drücken. Je Seite 3–4 Min. goldbraun und knusprig braten.",
"Auf Küchenpapier abtropfen lassen und im Ofen bei 80 °C warm halten, bis alle fertig sind.",
"Mit Apfelmus servieren."]},
d44:{v:"Öl, Butter, Salz, Pfeffer, evtl. 1 TL Mehl",s:[
"Semmelknödel nach Packungsangabe in siedendem Salzwasser garen (meist ca. 20 Min.).",
"Champignons putzen und in Scheiben schneiden. Zwiebel schälen und fein würfeln. Petersilie hacken.",
"In einer großen Pfanne 1 EL Öl stark erhitzen. Champignons in 2 Portionen je 3–4 Min. scharf anbraten, bis sie gebräunt sind.",
"Hitze reduzieren, 1 EL Butter und die Zwiebel dazugeben und 2 Min. dünsten.",
"Sahne angießen, aufkochen und 3 Min. köcheln lassen. Ist die Sauce zu dünn, 1 TL Mehl mit wenig Wasser verrühren und einrühren.",
"Mit Salz und Pfeffer abschmecken und Petersilie unterrühren.",
"Knödel aus dem Beutel nehmen, in Scheiben schneiden und mit der Pilzsauce servieren."]},
d45:{v:"3 EL Sojasauce, 1 Stück Ingwer, evtl. Sesamöl, Chili für Erwachsene",s:[
"Eier in kochendes Wasser legen und 7 Min. kochen (wachsweich). Kalt abschrecken, pellen und halbieren.",
"Pak Choi waschen, die Blätter vom Strunk lösen und grob schneiden. Frühlingszwiebeln in Ringe schneiden.",
"Brühe in einem Topf aufkochen. Mit Sojasauce und ein paar Scheiben Ingwer würzen.",
"Pak Choi hineingeben und 3 Min. köcheln.",
"Mie-Nudeln in die Brühe geben und nach Packungsangabe garen (meist 3–4 Min.).",
"Suppe in Schalen verteilen, Eierhälften und Frühlingszwiebeln obenauf legen.",
"Nach Wunsch mit ein paar Tropfen Sesamöl und für die Erwachsenen mit Chili verfeinern."]},
d46:{v:"Öl, Salz, Pfeffer, 2 TL Paprikapulver, 1 TL Kreuzkümmel, 1 EL Tomatenmark, Chili nach Geschmack",s:[
"Reis nach Packungsangabe kochen.",
"Zwiebel schälen und würfeln. Paprika waschen und würfeln. Bohnen und Mais abspülen.",
"In einem großen Topf 1 EL Öl erhitzen. Zwiebel und Paprika 5 Min. andünsten.",
"Tomatenmark, Paprikapulver und Kreuzkümmel einrühren und 1 Min. rösten.",
"Stückige Tomaten, Bohnen und Mais dazugeben, salzen und pfeffern und 15 Min. köcheln lassen.",
"Für das Kind eine Portion abnehmen, den Rest nach Geschmack mit Chili schärfen.",
"Mit Reis servieren, dazu passen Schmand oder Joghurt und ein paar Nachos."]},
d47:{v:"Salz, Pfeffer, Oregano",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen, Blech mit Backpapier auslegen.",
"Aufbackbrötchen waagerecht halbieren und mit der Schnittfläche nach oben aufs Blech legen.",
"Passierte Tomaten mit Salz, Pfeffer und 1 TL Oregano würzen und auf die Brötchenhälften streichen.",
"Paprika waschen und fein würfeln. Mais abtropfen lassen.",
"Paprika und Mais auf den Brötchen verteilen, mit Käse bestreuen.",
"Ca. 10–12 Min. backen, bis der Käse goldbraun ist.",
"Tipp: Kinder können ihre Pizzabrötchen selbst belegen. Dazu passt Rohkost."]},
d48:{v:"Olivenöl, 1 Knoblauchzehe, Salz, Pfeffer, Muskat, evtl. Zitronenschale",s:[
"Spinat vorher auftauen lassen und etwas ausdrücken.",
"Nudelwasser aufsetzen, salzen und die Penne bissfest kochen.",
"Knoblauch schälen und fein hacken. Parmesan reiben.",
"In einer großen Pfanne 1 EL Öl erhitzen, Knoblauch 1 Min. andünsten. Spinat dazugeben und 3 Min. erhitzen.",
"Ricotta und 4–6 EL Nudelwasser einrühren, bis eine cremige Sauce entsteht. Mit Salz, Pfeffer und Muskat würzen.",
"Nudeln abgießen und unter die Sauce heben.",
"Mit Parmesan und nach Wunsch etwas Zitronenschale servieren."]},
d49:{v:"2–3 EL Zucker, 1 Prise Salz, Zimt, 1 TL Speisestärke",s:[
"Milch mit 2 EL Zucker und 1 Prise Salz in einem Topf mit dickem Boden aufkochen.",
"Milchreis einrühren, erneut kurz aufkochen lassen.",
"Hitze auf die kleinste Stufe stellen und den Reis zugedeckt ca. 25 Min. quellen lassen. Alle 5 Min. umrühren, damit nichts anbrennt.",
"Sauerkirschen abtropfen lassen, den Saft auffangen.",
"Den Saft in einem kleinen Topf aufkochen. 1 TL Speisestärke mit 2 EL kaltem Wasser verrühren, einrühren und kurz köcheln, bis er andickt. Kirschen dazugeben.",
"Zimt mit 1 EL Zucker mischen.",
"Milchreis mit Kirschen und Zimtzucker servieren – warm oder kalt."]},
d50:{v:"Öl, Salz, Pfeffer, 1 TL Paprikapulver, 1 Knoblauchzehe, evtl. Minze",s:[
"Zucchini und Paprika waschen und in kleine Würfel schneiden.",
"In einer großen Pfanne (mit Deckel) 2 EL Öl erhitzen. Gemüse 5 Min. anbraten.",
"Bulgur dazugeben und 1 Min. mitrösten. Paprikapulver darüberstäuben.",
"Brühe angießen, aufkochen, Deckel auflegen und bei kleiner Hitze ca. 10 Min. quellen lassen, bis die Flüssigkeit aufgesogen ist.",
"Topf vom Herd nehmen und 5 Min. zugedeckt ruhen lassen. Mit Salz und Pfeffer abschmecken.",
"Joghurt mit 1 gepressten Knoblauchzehe und Salz verrühren, nach Wunsch Minze dazugeben.",
"Bulgur-Pfanne mit dem Joghurt servieren."]},
d51:{v:"Olivenöl, Salz, Pfeffer, Oregano, evtl. Chiliflocken",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Kirschtomaten waschen und in eine Auflaufform geben. Knoblauch schälen und dazugeben.",
"Feta als Block in die Mitte legen. Alles mit 4 EL Olivenöl beträufeln, mit Pfeffer und Oregano würzen (Feta ist schon salzig).",
"Ca. 25 Min. backen, bis die Tomaten aufplatzen und der Feta weich ist.",
"In der Zwischenzeit Penne in Salzwasser bissfest kochen. Etwas Nudelwasser auffangen.",
"Feta, Tomaten und Knoblauch mit einer Gabel zerdrücken und zu einer Sauce verrühren.",
"Nudeln und einen Schuss Nudelwasser unterrühren, mit Basilikum servieren."]},
d52:{v:"2 EL Reisessig, 1 TL Zucker, Salz, Sojasauce, Sesam",s:[
"Reis in einem Sieb waschen, bis das Wasser klar bleibt. Nach Packungsangabe kochen.",
"Reisessig, Zucker und ½ TL Salz verrühren und unter den heißen Reis heben. Abkühlen lassen.",
"Edamame in Salzwasser 4 Min. kochen, abgießen und kalt abschrecken.",
"Gurke und Karotten in feine Streifen schneiden oder hobeln.",
"Avocado halbieren, Kern entfernen, schälen und in Scheiben schneiden.",
"Reis in Schalen verteilen, Gemüse, Avocado und Edamame daraufsetzen.",
"Mit Sojasauce beträufeln und mit Sesam bestreuen."]},
d53:{v:"Öl, Salz, Pfeffer, Paprikapulver, Ketchup zum Dippen",s:[
"Ofen auf 220 °C Ober-/Unterhitze vorheizen. Zwei Bleche mit Backpapier auslegen (oder ein Blech mit Rost darüber).",
"Kartoffeln waschen und in Spalten schneiden. Mit 2 EL Öl, Salz und Paprikapulver mischen, auf einem Blech verteilen und 10 Min. vorbacken.",
"Hähnchen trocken tupfen und in nuggetgroße Stücke schneiden. Salzen und pfeffern.",
"Ei in einem tiefen Teller verquirlen. Cornflakes in einem Gefrierbeutel mit dem Nudelholz grob zerbröseln und auf einen zweiten Teller geben.",
"Hähnchenstücke erst durch das Ei ziehen, dann in den Cornflakes wenden und leicht andrücken.",
"Nuggets aufs zweite Blech legen, mit etwas Öl beträufeln und zusammen mit den Kartoffeln ca. 15 Min. backen, bis sie goldbraun und durchgegart sind.",
"Mit Ketchup oder Joghurt-Dip servieren."]},
d54:{v:"Öl, Salz",s:[
"Reis nach Packungsangabe kochen.",
"Tomaten und Gurke waschen, würfeln, mischen und leicht salzen.",
"Eine große Pfanne ohne oder mit wenig Öl stark erhitzen.",
"Gyros in zwei Portionen hineingeben und jeweils 5–6 Min. kräftig braten, bis es knusprig ist. Nicht zu viel auf einmal, sonst kocht es statt zu braten.",
"Prüfen, dass das Fleisch durchgegart ist.",
"Reis, Gyros und Salat auf Teller verteilen und Tzatziki dazugeben."]},
d55:{v:"3 EL Essig, 3 EL Öl, 1 TL Senf, Salz, Pfeffer, 1 Prise Zucker, evtl. Schnittlauch",s:[
"Kartoffeln mit Schale in Salzwasser ca. 20 Min. kochen, bis sie gar sind.",
"Abgießen, kurz ausdampfen lassen und noch warm pellen. In dünne Scheiben schneiden.",
"Zwiebel schälen und sehr fein würfeln.",
"Brühe erhitzen und mit Zwiebel, Essig, Senf, Salz, Pfeffer und Zucker verrühren. Über die warmen Kartoffeln gießen und vorsichtig mischen.",
"10 Min. ziehen lassen, dann das Öl unterheben. Gurke in dünne Scheiben hobeln und dazugeben.",
"Würstchen in heißes (nicht kochendes!) Wasser legen und 5–8 Min. ziehen lassen, sonst platzen sie.",
"Mit Senf servieren, nach Wunsch Schnittlauch über den Salat streuen."]},
d56:{v:"Öl, Butter, 1 TL Senf, Salz, Pfeffer, Muskat, Paprikapulver",s:[
"Kartoffeln schälen, in Stücke schneiden und in Salzwasser ca. 18–20 Min. weich kochen.",
"Hackfleisch mit Ei, Semmelbröseln, Senf, ½ TL Salz, Pfeffer und etwas Paprikapulver gründlich verkneten.",
"Mit feuchten Händen 8–10 kleine, flache Frikadellen formen.",
"In einer Pfanne 2 EL Öl erhitzen. Frikadellen bei mittlerer Hitze je Seite 4–5 Min. braten, bis sie durchgegart sind.",
"Erbsen in wenig Salzwasser 3–4 Min. kochen und mit etwas Butter verfeinern.",
"Kartoffeln abgießen, mit warmer Milch und 1–2 EL Butter stampfen, mit Salz und Muskat abschmecken.",
"Frikadellen mit Püree und Erbsen servieren."]},
d57:{v:"Öl, Salz, Pfeffer, Paprikapulver, evtl. Koriander",s:[
"Fisch am Vortag im Kühlschrank auftauen lassen. Trocken tupfen und in Stücke schneiden.",
"Schmand mit 2 EL Zitronensaft, Salz und Pfeffer verrühren.",
"Fisch mit Salz, Pfeffer und Paprikapulver würzen.",
"In einer Pfanne 2 EL Öl erhitzen, Fisch bei mittlerer Hitze je Seite 2–3 Min. braten, bis er durchgegart ist und leicht zerfällt.",
"Wraps kurz in einer trockenen Pfanne erwärmen.",
"Wraps mit Krautsalat, Fisch und Zitronen-Schmand füllen, einmal zusammenklappen.",
"Mit Zitronenspalten und nach Wunsch Koriander servieren."]},
d58:{v:"Olivenöl, Salz, Pfeffer, Oregano, evtl. Kapern oder Oliven",s:[
"Nudelwasser aufsetzen, salzen und die Spaghetti bissfest kochen.",
"Zwiebel schälen und fein würfeln.",
"In einem Topf 1 EL Öl erhitzen und die Zwiebel 3 Min. andünsten.",
"Passierte Tomaten dazugeben, mit Oregano, Salz und Pfeffer würzen und 5 Min. köcheln.",
"Thunfisch gut abtropfen lassen, mit einer Gabel zerzupfen und unter die Sauce rühren. 2 Min. erwärmen.",
"Nach Wunsch für die Erwachsenen ein paar Kapern oder Oliven dazugeben.",
"Mit den Nudeln mischen und servieren."]},
d59:{v:"Öl, Salz, Pfeffer, Paprikapulver, 1 Knoblauchzehe, evtl. Kräuter",s:[
"Hähnchen trocken tupfen und in dünne Streifen schneiden. Mit Salz, Pfeffer und 1 TL Paprikapulver würzen.",
"Joghurt mit 1 gepressten Knoblauchzehe, Salz und nach Wunsch Kräutern verrühren.",
"Salat waschen und in Streifen schneiden, Tomaten würfeln.",
"In einer Pfanne 1 EL Öl stark erhitzen und das Hähnchen 5–6 Min. rundum braten, bis es durchgegart ist.",
"Wraps kurz in einer trockenen Pfanne erwärmen.",
"Wraps mit Joghurtsauce bestreichen, Salat, Tomaten und Hähnchen darauf verteilen und einrollen."]},
d60:{v:"Olivenöl, Salz, Pfeffer, evtl. Dill oder Rosmarin",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Kartoffeln waschen und halbieren oder vierteln. Mit 2 EL Öl und Salz mischen und auf einem Blech verteilen. 15 Min. vorbacken.",
"Brokkoli in Röschen teilen. Zitrone in Scheiben schneiden.",
"Lachs trocken tupfen, salzen und pfeffern.",
"Kartoffeln auf dem Blech zur Seite schieben. Lachs und Brokkoli dazulegen, Zitronenscheiben auf den Lachs legen. Brokkoli mit etwas Öl beträufeln und salzen.",
"Weitere 12–15 Min. backen, bis der Lachs gerade gar ist (er sollte sich leicht zerteilen lassen).",
"Nach Wunsch mit Dill bestreuen und servieren."]}
});

b01:{v:"Rapsöl, Salz, Pfeffer, Muskat",s:[
"Für die Pfannkuchen beide Mehlsorten, Milch, Mineralwasser, Eier und 1 Prise Salz glatt rühren und 10 Min. quellen lassen.",
"Zwiebel und Knoblauch schälen und fein würfeln. Gemüse putzen und klein schneiden. Kartoffeln schälen und würfeln.",
"In einer beschichteten Pfanne wenig Rapsöl erhitzen und aus dem Teig 3–4 dünne Pfannkuchen backen. Etwas abkühlen lassen, aufrollen und in feine Streifen schneiden.",
"In einem großen Topf 1 EL Rapsöl erhitzen, Zwiebel und Knoblauch 2–3 Min. andünsten.",
"Gemüse und Kartoffeln dazugeben, kurz mitdünsten und mit der Brühe aufgießen.",
"Aufkochen und zugedeckt ca. 15 Min. köcheln, bis alles gar ist.",
"Mit Salz, Pfeffer und Muskat abschmecken. Pfannkuchenstreifen in die Teller geben und die heiße Suppe darübergießen."]},
b02:{v:"2 EL Rapsöl, Salz, Pfeffer, 1 TL Honig, 1 TL Currypulver",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen. Zwei Bleche mit Backpapier auslegen.",
"Kartoffeln, Karotten und Pastinaken schälen, Zucchini waschen. Alles in gleich dicke Stifte schneiden (ca. 1 cm).",
"Gemüsestifte mit Rapsöl und Salz mischen und nebeneinander auf den Blechen verteilen – nicht übereinander, sonst werden sie nicht knusprig.",
"Ca. 30–35 Min. backen, nach der Hälfte einmal wenden. Zucchini ist schneller fertig und kann auch erst nach 10 Min. dazukommen.",
"Für den Dip Quark und Joghurt glatt rühren. Honig, 1 TL Zitronensaft und Curry einrühren, mit Salz und Pfeffer abschmecken.",
"Gemüsepommes mit dem Dip servieren."]},
b03:{v:"Rapsöl, Salz, Paprikapulver, evtl. Kreuzkümmel, Kräuter für den Dip, Essig und Öl für den Salat",s:[
"Bohnen in ein Sieb geben, abspülen und gut abtropfen lassen. In einer Schüssel mit einer Gabel oder einem Stampfer fein zerdrücken.",
"Zwiebel und Knoblauch schälen und sehr fein würfeln. Petersilie hacken.",
"Zwiebel, Knoblauch, Petersilie, Eier, Haferflocken und Käse zu den Bohnen geben. Mit Salz, 1 TL Paprikapulver und nach Wunsch Kreuzkümmel würzen und gut verkneten. 5 Min. quellen lassen.",
"Mit feuchten Händen kleine Kugeln formen und flach drücken (ergibt ca. 15 Stück).",
"In einer Pfanne 2–3 EL Rapsöl erhitzen. Frikadellen bei mittlerer Hitze je Seite 3–4 Min. knusprig braten.",
"Joghurt mit Salz und Kräutern verrühren. Salat waschen und mit Essig und Öl anmachen.",
"Frikadellen mit Salat und Dip servieren."]},
b04:{v:"Salz, Pfeffer, Muskat, 1 TL getrocknete Kräuter der Provence",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Brokkoli in Röschen teilen und 5 Min. in Salzwasser vorgaren. Mit einer Schaumkelle herausnehmen.",
"Im selben Wasser die Vollkornnudeln kochen, aber 2 Min. kürzer als auf der Packung angegeben. Abgießen.",
"Getrocknete Tomaten klein schneiden.",
"Sahne mit Ei, Salz, Pfeffer, Muskat und Kräutern verquirlen.",
"Nudeln, Brokkoli und Tomaten in einer Auflaufform mischen (wer mag, gibt für die Erwachsenen etwas Kochschinken dazu). Sahne darübergießen, Käse daraufstreuen.",
"Ca. 20–25 Min. backen, bis der Käse goldbraun ist."]},
b05:{v:"Olivenöl, 2 EL Senf, Salz, Pfeffer",s:[
"Vollkornreis nach Packungsangabe kochen – er braucht ca. 25–30 Min., deshalb zuerst aufsetzen.",
"Hähnchen trocken tupfen und in mundgerechte Stücke schneiden. Paprika waschen und würfeln. Knoblauch fein hacken.",
"In einer großen Pfanne 2 TL Olivenöl erhitzen. Hähnchen und Paprika 4–5 Min. rundum anbraten. Knoblauch 1 Min. mitrösten.",
"Brühe angießen und den Senf einrühren.",
"Erbsen (gefroren) dazugeben und 5 Min. köcheln, bis das Hähnchen durchgegart ist.",
"4–5 EL saure Sahne unterrühren, nicht mehr kochen lassen. Mit Salz und Pfeffer abschmecken.",
"Mit dem Vollkornreis servieren."]},
b06:{v:"Olivenöl, Salz, Pfeffer, 6 EL heller Balsamico, 2 TL süßer Senf, Dill",s:[
"Couscous mit 150 ml kochender, gesalzener Brühe übergießen, abdecken und 5 Min. quellen lassen. Auflockern und abkühlen lassen.",
"Lachs trocken tupfen, mit etwas Limettensaft, 1 EL Öl, Salz und Pfeffer würzen.",
"Lachs in einer Pfanne bei mittlerer Hitze von beiden Seiten je 3–4 Min. braten, bis er gerade gar ist. Mit zwei Gabeln in Stücke zupfen.",
"Salate waschen und trocken schleudern, Römersalat in Streifen schneiden. Tomaten halbieren, Gurke in Scheiben schneiden.",
"Mango schälen, Fruchtfleisch vom Kern schneiden und würfeln. Avocado halbieren, entkernen und in Scheiben schneiden.",
"Für das Dressing Balsamico, 4 EL Olivenöl, süßen Senf, gehackten Dill und etwas Limettensaft verrühren.",
"Couscous, Salat, Gemüse, Obst und Lachs in Schalen anrichten und mit Dressing beträufeln."]},
b07:{v:"Olivenöl, 1 TL Gemüsebrühe-Pulver, Salz, Pfeffer",s:[
"Vollkornnudeln in Salzwasser nach Packungsangabe kochen.",
"Zucchini waschen, längs halbieren und in Scheiben schneiden. Knoblauch fein hacken. Lachs in Würfel schneiden.",
"In einer großen Pfanne 1 EL Olivenöl erhitzen. Zucchini bei mittlerer Hitze 4–5 Min. anbraten.",
"Lachs und Knoblauch dazugeben und 1–2 Min. vorsichtig mitbraten.",
"Kokosmilch angießen und das Brühpulver einrühren. 2–3 Min. köcheln, bis der Lachs gar ist.",
"Mit Salz und Pfeffer abschmecken. Statt Kokosmilch geht auch Sahne oder Milch.",
"Nudeln abgießen und mit der Sauce mischen."]},
b08:{v:"Öl, 3 TL Gemüsebrühe-Pulver, Salz, Pfeffer, evtl. Chili",s:[
"Couscous in eine Schüssel geben, mit 200 ml kochendem Wasser übergießen, umrühren und zugedeckt quellen lassen.",
"Zwiebel, Knoblauch und Ingwer schälen und sehr fein würfeln. Kirschtomaten halbieren.",
"Bohnen und Mais in ein Sieb geben und abspülen.",
"In einer großen Pfanne 1 EL Öl erhitzen. Zwiebel und Ingwer 3 Min. glasig dünsten, dann Knoblauch und Kirschtomaten 1–2 Min. mitbraten.",
"Bohnen, Mais und stückige Tomaten dazugeben. Brühpulver mit 100 ml Wasser verrühren und dazugießen.",
"5 Min. köcheln lassen, dann den Couscous unterrühren.",
"Abschmecken und für die Erwachsenen nach Wunsch mit Chili schärfen."]},
b09:{v:"Kokos- oder Rapsöl, 1 EL Currypulver, 2 TL süßer Senf, Salz, Pfeffer",s:[
"Vollkornreis nach Packungsangabe kochen (ca. 25–30 Min.).",
"Karotten schälen und in Scheiben oder Würfel schneiden. Zwiebel würfeln. Frühlingszwiebeln in Ringe schneiden. Kichererbsen abspülen.",
"In einem Topf 1 EL Öl erhitzen und die Zwiebel 2–3 Min. andünsten. Karotten dazugeben und 3 Min. mitdünsten.",
"Mit Brühe und Kokosmilch ablöschen. Senf und Curry einrühren.",
"Aufkochen und 10 Min. köcheln lassen.",
"Kichererbsen dazugeben und weitere 10 Min. köcheln, bis die Karotten weich sind.",
"Frühlingszwiebeln unterheben, mit Salz und Pfeffer abschmecken und mit Reis servieren."]},
b10:{v:"Rapsöl, 1 TL Paprikapulver, 1 TL Kurkuma, Salz, Pfeffer, 1 Knoblauchzehe, evtl. 1 EL geschroteter Leinsamen",s:[
"Linsen abspülen und mit der Brühe in einem Topf aufkochen. Bei kleiner Hitze 10–12 Min. garen, bis die Flüssigkeit aufgesogen ist. Abgießen und gut abtropfen und abkühlen lassen.",
"Zwiebel und Paprika sehr fein würfeln. Karotte fein reiben. Petersilie hacken.",
"Gemahlene Mandeln in einer trockenen Pfanne goldbraun rösten.",
"Zwiebel und Paprika in 1 EL Öl 3 Min. andünsten.",
"Linsen, Gemüse, Karotte, Petersilie, Mandeln, Mehl und Gewürze (und nach Wunsch Leinsamen) verkneten. Ist die Masse zu weich, etwas mehr Mehl dazugeben.",
"Mit feuchten Händen ca. 15 flache Bratlinge formen. In Rapsöl bei mittlerer Hitze je Seite 2–3 Min. goldbraun braten.",
"Für den Dip die Gurke raspeln, leicht ausdrücken und mit Joghurt, Knoblauch und Salz verrühren."]},
b11:{v:"Butter, Salz, Pfeffer, Muskat",s:[
"Kartoffeln schälen, halbieren und in Salzwasser ca. 20 Min. kochen.",
"Zwiebel schälen und fein würfeln.",
"In einem Topf 40 g Butter schmelzen und die Zwiebel 3 Min. andünsten.",
"Mehl einrühren und 1 Min. anschwitzen. Nach und nach Sahne und 100 ml Wasser mit dem Schneebesen einrühren.",
"Gefrorenen Spinat dazugeben, gut umrühren und bei mittlerer Hitze ca. 15 Min. köcheln lassen, bis er aufgetaut und cremig ist. Öfter umrühren.",
"Mit Salz, Pfeffer und Muskat abschmecken.",
"Spiegeleier in einer Pfanne braten, Kartoffeln abgießen und alles zusammen servieren."]},
b12:{v:"Öl zum Braten, Salz, evtl. Zitrone",s:[
"Kartoffeln schälen und in Salzwasser ca. 20 Min. kochen.",
"Kohlrabi schälen und in ca. 1 cm dicke Scheiben schneiden.",
"Kohlrabischeiben in kochendem Salzwasser 5 Min. vorgaren, abgießen und gut trocken tupfen.",
"Drei tiefe Teller vorbereiten: Mehl, verquirlte Eier mit 1 Prise Salz, Semmelbrösel.",
"Scheiben leicht salzen und nacheinander in Mehl, Ei und Bröseln wenden, die Panade gut andrücken.",
"In einer großen Pfanne reichlich Öl erhitzen. Schnitzel bei mittlerer Hitze je Seite 2–3 Min. goldbraun braten und auf Küchenpapier abtropfen lassen.",
"Mit Kartoffeln und Zitronenspalten servieren. Dazu passt ein Salat oder Kräuterquark."]},
b13:{v:"Olivenöl, 2 EL Tomatenmark, 2 TL Kreuzkümmel, 2 TL Koriander, 1 TL Paprikapulver, 1 Lorbeerblatt, Salz, evtl. Chiliflocken",s:[
"Zwiebel und Knoblauch schälen und würfeln. Karotten schälen und würfeln, Zucchini waschen und würfeln. Kichererbsen abspülen.",
"In einem großen Topf 1 EL Olivenöl erhitzen, Zwiebel und Knoblauch 2–3 Min. andünsten.",
"Karotten dazugeben und 5 Min. mitdünsten. Tomatenmark einrühren und 1 Min. anrösten.",
"Stückige Tomaten und Brühe dazugeben. Kreuzkümmel, Koriander, Paprikapulver und Lorbeerblatt dazugeben und 5 Min. köcheln.",
"Kichererbsen und Zucchini dazugeben und ca. 25 Min. bei kleiner Hitze köcheln.",
"Lorbeerblatt entfernen und mit Salz abschmecken. Erwachsene können Chiliflocken darüberstreuen.",
"Fladenbrot kurz aufbacken und zum Eintopf servieren."]},
b14:{v:"30 g Butter, Salz, Pfeffer, Muskat, 1 Prise Zucker",s:[
"Blumenkohl putzen, in kleine Röschen teilen, den Strunk in kleine Stücke schneiden.",
"In Salzwasser ca. 10 Min. weich kochen. Abgießen und dabei das Kochwasser auffangen. Mit Wasser auf ca. 600 ml auffüllen.",
"Im leeren Topf 30 g Butter schmelzen, Mehl einrühren und 1 Min. anschwitzen.",
"Nach und nach Kochwasser und Milch mit dem Schneebesen einrühren. 5 Min. köcheln lassen.",
"Topf vom Herd nehmen. Ei trennen, Eigelb mit 2 EL Suppe verrühren und in die Suppe einrühren (nicht mehr kochen lassen).",
"Blumenkohl zurück in die Suppe geben, nach Wunsch teilweise pürieren. Mit Salz, Pfeffer, Muskat und 1 Prise Zucker abschmecken.",
"Mit Vollkornbrot servieren."]},
c01:{v:"Öl, 40 g Butter, Salz, Pfeffer, Muskat, Oregano, 1 EL Tomatenmark",s:[
"Ofen auf 180 °C Ober-/Unterhitze vorheizen.",
"Zwiebel, Karotten, Zucchini und Paprika in kleine Würfel schneiden.",
"In einem Topf 1 EL Öl erhitzen, Gemüse 5–6 Min. andünsten. Tomatenmark kurz mitrösten, passierte Tomaten dazugeben, mit Salz, Pfeffer und Oregano würzen und 10 Min. köcheln.",
"Für die Béchamel 40 g Butter schmelzen, Mehl einrühren und 1 Min. anschwitzen. Milch nach und nach mit dem Schneebesen einrühren, aufkochen und 3 Min. köcheln, bis sie andickt. Mit Salz und Muskat würzen.",
"In eine gefettete Auflaufform (ca. 20 × 30 cm) etwas Gemüsesauce geben, dann eine Lage Lasagneplatten, Gemüsesauce, Béchamel. So weiterschichten, bis alles verbraucht ist. Obenauf Béchamel.",
"Mit Käse bestreuen und ca. 35 Min. backen, bis die Oberfläche goldbraun ist und die Platten weich sind (mit einem Messer prüfen).",
"Vor dem Anschneiden 5–10 Min. ruhen lassen, dann zerfällt sie nicht."]},
c02:{v:"Öl, 40 g Butter, Salz, Pfeffer, Muskat, Oregano, 1 EL Tomatenmark, 1 TL Paprikapulver",s:[
"Ofen auf 180 °C Ober-/Unterhitze vorheizen.",
"Zwiebel und Karotten fein würfeln. Linsen abspülen.",
"In einem Topf 1 EL Öl erhitzen, Zwiebel und Karotten 5 Min. andünsten. Tomatenmark kurz mitrösten.",
"Linsen, stückige Tomaten und 200 ml Wasser dazugeben, kräftig mit Salz, Pfeffer, Oregano und Paprikapulver würzen und 15 Min. köcheln.",
"Béchamel aus 40 g Butter, Mehl und Milch kochen (wie bei der Gemüselasagne) und mit Salz und Muskat würzen.",
"In einer gefetteten Form abwechselnd Linsensauce, Lasagneplatten und Béchamel schichten, mit Béchamel abschließen.",
"Mozzarella in Scheiben darauflegen und ca. 35 Min. backen. 5–10 Min. ruhen lassen, dann servieren."]},
c03:{v:"Butter, Salz, Pfeffer, Muskat, Essig und Öl für den Salat",s:[
"Ofen auf 180 °C Ober-/Unterhitze vorheizen.",
"Eine Auflaufform mit der halbierten Knoblauchzehe kräftig ausreiben und mit Butter einfetten.",
"Kartoffeln schälen und in sehr dünne Scheiben (2–3 mm) hobeln oder schneiden.",
"Kartoffelscheiben dachziegelartig in die Form schichten.",
"Sahne und Milch mit 1 TL Salz, Pfeffer und Muskat verrühren und gleichmäßig darübergießen. Die Kartoffeln sollten fast bedeckt sein.",
"Mit Käse bestreuen und ca. 50 Min. backen, bis die Kartoffeln weich sind (mit einem Messer prüfen) und die Oberfläche goldbraun ist. Wird es zu dunkel, mit Alufolie abdecken.",
"10 Min. ruhen lassen. Salat waschen, anmachen und dazu servieren."]},
c04:{v:"Öl, Salz, Pfeffer, 1 TL Paprikapulver, Oregano",s:[
"Reis nach Packungsangabe kochen.",
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Von den Paprika einen Deckel abschneiden, Kerne und weiße Häutchen entfernen.",
"Gekochten Reis mit abgetropftem Mais, zerbröseltem Feta, Paprikapulver und etwas Pfeffer mischen.",
"Zwiebel fein würfeln und mit den passierten Tomaten, Salz, Pfeffer und Oregano in eine Auflaufform geben.",
"Paprika mit der Reismischung füllen, in die Tomatensauce setzen und die Deckel auflegen.",
"Ca. 35 Min. backen, bis die Paprika weich sind. Mit der Sauce servieren."]},
c05:{v:"Öl, Salz, Pfeffer, Paprikapulver, Rosmarin oder Thymian, evtl. Knoblauch",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Kartoffeln waschen und vierteln. Karotten schälen und in dicke Stücke schneiden. Zwiebeln schälen und in Spalten schneiden.",
"Gemüse mit 3 EL Öl, Salz und Rosmarin mischen und auf einem Blech oder in einer großen Form verteilen.",
"Hähnchenschenkel trocken tupfen und mit etwas Öl, Salz, Pfeffer und Paprikapulver rundum einreiben.",
"Schenkel mit der Hautseite nach oben auf das Gemüse legen.",
"Ca. 45 Min. backen, bis die Haut knusprig ist und beim Einstechen klarer Saft austritt.",
"Mit dem Gemüse und dem Bratensaft servieren."]},
c06:{v:"Butter, 1 TL Senf, Salz, Pfeffer, Paprikapulver, Muskat, evtl. Petersilie",s:[
"Ofen auf 180 °C Ober-/Unterhitze vorheizen.",
"Zwiebel sehr fein würfeln. Hackfleisch mit Ei, Semmelbröseln, Zwiebel, Senf, 1 TL Salz, Pfeffer und Paprikapulver gründlich verkneten.",
"Zu einem länglichen Laib formen, in eine gefettete Auflaufform legen und ca. 45 Min. backen, bis er durchgegart ist. Nach 20 Min. mit etwas Wasser angießen, dann gibt es Bratensaft.",
"Kartoffeln schälen, in Stücke schneiden und in Salzwasser ca. 20 Min. kochen.",
"Karotten schälen, in Scheiben schneiden und mit wenig Wasser, 1 TL Butter und 1 Prise Salz zugedeckt ca. 10 Min. garen.",
"Kartoffeln abgießen und mit warmer Milch und Butter zu Püree stampfen, mit Salz und Muskat abschmecken.",
"Falschen Hasen 5 Min. ruhen lassen, in Scheiben schneiden und mit Püree, Karotten und Bratensaft servieren."]},
c07:{v:"Salz, Pfeffer, Oregano, 1 Knoblauchzehe",s:[
"Spinat auftauen lassen und gut ausdrücken.",
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Passierte Tomaten mit Sahne, gepresstem Knoblauch, Salz, Pfeffer und 1 TL Oregano verrühren.",
"Ungekochte Tortellini, Spinat und Sauce in einer Auflaufform mischen. Die Tortellini sollten gut mit Sauce bedeckt sein – sonst etwas Wasser dazugeben.",
"Mozzarella abtropfen lassen, zerzupfen und darauf verteilen.",
"Ca. 25–30 Min. backen, bis die Tortellini weich sind und der Käse goldbraun ist."]},
c08:{v:"Öl, Butter, Salz, Pfeffer, evtl. Salbei oder Thymian",s:[
"Ofen auf 200 °C vorheizen. Hokkaido waschen, halbieren und entkernen.",
"Die Hälfte des Kürbisses in grobe Würfel schneiden, mit etwas Öl und Salz mischen und auf einem Blech ca. 20–25 Min. rösten.",
"Den Rest des Kürbisses fein würfeln. Zwiebel fein würfeln. Brühe erhitzen und warm halten. Parmesan reiben.",
"In einem breiten Topf 1 EL Öl erhitzen. Zwiebel und feine Kürbiswürfel 3 Min. andünsten. Reis dazugeben und 1–2 Min. glasig anschwitzen.",
"Kellenweise heiße Brühe dazugeben und immer wieder umrühren, bis sie aufgesogen ist. Das dauert ca. 18–20 Min. Die feinen Kürbiswürfel zerfallen dabei und machen das Risotto cremig.",
"Vom Herd nehmen, Parmesan und 1 EL Butter unterrühren und mit Salz und Pfeffer abschmecken.",
"Mit den gerösteten Kürbiswürfeln obenauf servieren."]},
c09:{v:"Butter, Salz, Pfeffer, Muskat, Essig und Öl für den Salat",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Eine Quiche- oder Springform (ca. 26 cm) mit dem Blätterteig samt Backpapier auslegen, Rand hochziehen. Boden mehrmals mit einer Gabel einstechen.",
"Lauch längs halbieren, waschen und in feine Ringe schneiden. In 1 EL Butter 5 Min. andünsten, salzen und etwas abkühlen lassen.",
"Lauch auf dem Teig verteilen.",
"Eier mit Sahne, Käse, Salz, Pfeffer und Muskat verquirlen und über den Lauch gießen.",
"Im unteren Drittel des Ofens ca. 35 Min. backen, bis die Füllung gestockt und goldbraun ist.",
"5 Min. abkühlen lassen, in Stücke schneiden und mit Salat servieren. Schmeckt auch kalt."]},
c10:{v:"Öl, Salz, Pfeffer, 1 TL Majoran, 1 Lorbeerblatt, evtl. Petersilie",s:[
"Kartoffeln schälen und würfeln. Karotten schälen und in Scheiben schneiden. Lauch waschen und in Ringe schneiden.",
"In einem großen Topf 1 EL Öl erhitzen und das Gemüse 5 Min. andünsten.",
"Mit der Brühe aufgießen, Lorbeerblatt dazugeben und ca. 20 Min. köcheln.",
"Bohnen abspülen und dazugeben. Weitere 10 Min. köcheln.",
"Ein paar Kellen Eintopf herausnehmen, pürieren und zurückgeben – so wird er sämiger.",
"Lorbeerblatt entfernen und mit Majoran, Salz und Pfeffer abschmecken. Nach Wunsch Petersilie darüberstreuen.",
"Mit Vollkornbrot servieren."]},
c11:{v:"Olivenöl, Salz, Pfeffer, Rosmarin oder Thymian, 1 Knoblauchzehe",s:[
"Fisch am Vortag im Kühlschrank auftauen lassen.",
"Ofen auf 200 °C Ober-/Unterhitze vorheizen.",
"Kartoffeln in Spalten schneiden, mit 2 EL Öl, Salz und Rosmarin mischen und auf einem Blech 20 Min. vorbacken.",
"Fisch trocken tupfen, salzen und pfeffern und in eine Auflaufform legen.",
"Kirschtomaten halbieren, Oliven abtropfen lassen, Knoblauch in Scheiben schneiden. Alles um den Fisch verteilen. Zitronenscheiben auf den Fisch legen und mit 2 EL Olivenöl beträufeln.",
"Form zu den Kartoffeln in den Ofen schieben und ca. 15–20 Min. backen, bis der Fisch sich leicht zerteilen lässt.",
"Fisch mit Tomaten, Oliven und Kartoffeln servieren."]},
c12:{v:"Öl, Salz, Pfeffer, Muskat",s:[
"Lauch längs halbieren, gründlich waschen und in Ringe schneiden.",
"In einem großen Topf 1 EL Öl erhitzen. Hackfleisch 5 Min. krümelig anbraten, salzen und pfeffern.",
"Lauch dazugeben und 5 Min. mitdünsten.",
"Brühe angießen, aufkochen und 15 Min. köcheln lassen.",
"Hitze reduzieren und den Schmelzkäse in Stücken einrühren, bis er vollständig geschmolzen ist. Nicht mehr sprudelnd kochen lassen.",
"Mit Pfeffer und Muskat abschmecken (Salz meist nicht nötig, der Käse ist salzig).",
"Baguette aufbacken und dazu servieren."]},
c13:{v:"Olivenöl, Salz, Pfeffer, 2 TL Kräuter der Provence, 1–2 Knoblauchzehen, Butter, evtl. Gemüsebrühe für die Polenta",s:[
"Aubergine, Zucchini und Paprika in ca. 2 cm große Würfel schneiden. Zwiebel und Knoblauch würfeln.",
"In einem großen Topf 3 EL Olivenöl erhitzen. Aubergine 5 Min. anbraten, bis sie leicht gebräunt ist (sie saugt viel Öl auf, notfalls etwas nachgießen).",
"Zwiebel, Knoblauch, Paprika und Zucchini dazugeben und 5 Min. mitbraten.",
"Stückige Tomaten und Kräuter dazugeben, salzen und pfeffern. Zugedeckt bei kleiner Hitze ca. 30 Min. schmoren, gelegentlich umrühren.",
"Für die Polenta 800 ml Wasser oder Brühe mit ½ TL Salz aufkochen. Polenta unter Rühren einrieseln lassen und nach Packungsangabe (meist 5–10 Min.) unter Rühren garen.",
"Parmesan reiben und mit 1 EL Butter unter die Polenta rühren.",
"Ratatouille abschmecken und auf der Polenta servieren."]},
c14:{v:"1 TL Salz, 2 EL Olivenöl, 1 Prise Zucker, Oregano, Pfeffer",s:[
"Mehl, Trockenhefe, 1 TL Salz und 1 Prise Zucker in einer Schüssel mischen. 2 EL Olivenöl und ca. 250 ml lauwarmes Wasser dazugeben.",
"Mindestens 5 Min. zu einem glatten, geschmeidigen Teig kneten (mit den Händen oder der Küchenmaschine).",
"Abgedeckt an einem warmen Ort ca. 30–45 Min. gehen lassen, bis er sich sichtbar vergrößert hat.",
"Ofen auf 230 °C Ober-/Unterhitze vorheizen. Passierte Tomaten mit Salz, Pfeffer und Oregano würzen. Paprika und Champignons in Scheiben schneiden, Mozzarella zerzupfen.",
"Teig auf einem mit Backpapier belegten Blech dünn ausrollen oder mit den Händen ausziehen.",
"Mit Tomatensauce bestreichen und belegen – hier dürfen die Kinder ihre Seite selbst gestalten.",
"Im unteren Drittel ca. 12–15 Min. backen, bis der Rand goldbraun und knusprig ist."]},
c15:{v:"Öl, 1–2 EL Currypulver, Salz, Zitronensaft, evtl. Ingwer und Knoblauch",s:[
"Reis nach Packungsangabe kochen.",
"Hähnchen in Würfel schneiden. Zwiebel würfeln, Paprika in Stücke schneiden, Brokkoli in kleine Röschen teilen.",
"In einem großen Topf 1 EL Öl erhitzen, Hähnchen 3–4 Min. rundum anbraten, salzen und herausnehmen.",
"Zwiebel und Paprika im Topf 3 Min. andünsten. Nach Wunsch Ingwer und Knoblauch dazu. Curry darüberstäuben und kurz mitrösten.",
"Kokosmilch und Brokkoli dazugeben und 8–10 Min. köcheln.",
"Hähnchen zurückgeben und 5 Min. ziehen lassen, bis es durchgegart ist.",
"Mit Salz und etwas Zitronensaft abschmecken und mit Reis servieren."]},
c16:{v:"Olivenöl, Salz, Pfeffer, 1 TL Paprikapulver, etwas Milch, Essig und Öl für den Salat",s:[
"Ofen auf 200 °C Ober-/Unterhitze vorheizen, Blech mit Backpapier auslegen.",
"Süßkartoffeln waschen, längs halbieren, die Schnittfläche mit Öl bepinseln und salzen.",
"Mit der Schnittfläche nach unten aufs Blech legen und ca. 35 Min. backen, bis sie ganz weich sind.",
"Kichererbsen abspülen, gut trocken tupfen und mit 1 EL Öl, Paprikapulver und Salz mischen. Nach 15 Min. mit aufs Blech geben, damit sie knusprig werden.",
"Quark mit 3–4 EL Milch glatt rühren, Schnittlauch in Röllchen schneiden und unterrühren. Mit Salz und Pfeffer würzen.",
"Salat waschen und anmachen.",
"Süßkartoffeln umdrehen, mit einer Gabel etwas auflockern, Kräuterquark und Kichererbsen daraufgeben."]}
});
