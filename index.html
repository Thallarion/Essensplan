<meta charset="utf-8">
<script>
/* Umzug von thallarion.github.io/Essensplan nach wasessenwir.at:
   Die alten Browser-Daten holt die Umzugsseite (liegt noch unter thallarion.github.io) und gibt sie per #umzug=… zurück. */
(function(){
  var MIG = "https://thallarion.github.io/Portfolio/essensplan-umzug.html", NEW = "wasessenwir.at", FLAG = "essensplan-umzug";
  try{
    var m = location.hash.match(/^#umzug=([A-Za-z0-9_\-]+)$/);
    if(m){
      if(m[1] !== "leer"){
        var data = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
        Object.keys(data).forEach(function(k){
          if((/^essensplan/.test(k) || k === "einsenden-name") && k !== FLAG && localStorage.getItem(k) === null) localStorage.setItem(k, data[k]);
        });
      }
      localStorage.setItem(FLAG, "1");
      history.replaceState(null, "", location.pathname + location.search);
      return;
    }
    var h = location.hostname;
    if((h === NEW || h === "www." + NEW) && location.protocol === "http:"){
      // HTTPS ist aktiv – alte/gemerkte http-Aufrufe auf https umleiten
      location.replace("https://" + NEW + location.pathname + location.search + location.hash);
      return;
    }
    if((h === NEW || h === "www." + NEW) && !localStorage.getItem(FLAG)){
      var has = false;
      for(var i = 0; i < localStorage.length; i++) if(/^essensplan/.test(localStorage.key(i))){ has = true; break; }
      localStorage.setItem(FLAG, has ? "1" : "pending");
      if(!has && !/#join=/.test(location.hash)) location.replace(MIG);
    }
  }catch(e){}
})();
</script>

    --ground:#121814; --surface:#1B231D; --sunk:#232D26; --ink:#E6ECE5; --muted:#9AA79C; --line:#2F3A32;
    --basil:#7CC494; --basil-ink:#0F1A12; --basil-soft:#23392A; --mustard:#E3B94E; --mustard-soft:#3A3120;

}

}

body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.ttl{display:flex;align-items:center;gap:10px}
.fridge-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit}

.fr-in{display:flex;gap:8px;margin:8px 0}

.fr-have{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fr-have button{font:700 14px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--basil);background:var(--basil-soft);color:var(--basil);cursor:pointer}
.fr-res{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.fr-item{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface)}

.count{font-size:12px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--sunk);color:var(--ink)}

button{font-family:var(--body)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{font:700 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--basil)}
.btn.primary{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--mustard-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}

/* Einkauf */

.cat h3{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}

.item:last-child{border-bottom:0}

.item label{flex:1;min-width:0;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.qty{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.item label>span:only-child{grid-column:1/-1}
.for{font-size:12px;color:var(--muted);grid-column:1/-1}
.item.done label{color:var(--muted);text-decoration:line-through}
.item .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}

.seg button{flex:1;font:700 14px var(--body);border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.pantry{font-size:13px;color:var(--muted);margin-top:14px}

/* Ideen */

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:700 13px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.idea h4{margin:0;font-size:16px;cursor:pointer}
.idea h4:hover{color:var(--basil)}

.surprise{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--basil-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.surprise strong{font-family:var(--display);font-size:20px;display:block}
.surprise small{color:var(--muted)}

.sheet h3{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}

<script>
/* ---------- Gerichte (Mengen für 2 Erwachsene + 1 Kind) ---------- */
// [Menge, Einheit, Zutat, Kategorie]  Kategorien: g=Obst & Gemüse, k=Kühlregal, v=Vorrat, f=Fleisch & Fisch, b=Brot, t=Tiefkühl
const DISHES = [
 {id:"d01",N:{kcal:670,p:27,f:15,kh:104,bs:7,gv:200,pm:0,q:"s"},n:"Spaghetti mit Tomatensauce & Parmesan",t:20,k:"veg",kid:1,i:[[400,"g","Spaghetti","v"],[500,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[60,"g","Parmesan","k"],[1,"Bund","Basilikum","g"]],m:"Zwiebel und Knoblauch fein würfeln, in Öl andünsten, Tomaten dazu und 10 Min. köcheln. Nudeln kochen, Sauce mit Salz, Pfeffer und Basilikum abschmecken, Parmesan drüber."},
 {id:"d02",N:{kcal:550,p:33,f:34,kh:26,bs:5,gv:140,pm:0,q:"s"},n:"Gemüse-Frittata mit Feta",t:25,k:"veg",i:[[8,"Stk","Eier","k"],[1,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[150,"g","Feta","k"],[400,"g","Kartoffeln (festkochend)","g"]],m:"Kartoffeln in dünne Scheiben schneiden und in der Pfanne 10 Min. braten. Gemüse würfeln, kurz mitbraten. Verquirlte Eier drüber, Feta darauf bröseln, zugedeckt bei kleiner Hitze 8–10 Min. stocken lassen."},
 {id:"d03",N:{kcal:600,p:16,f:19,kh:85,bs:10,gv:130,pm:0,q:"s"},n:"Kartoffel-Lauch-Suppe",t:30,k:"veg",i:[[700,"g","Kartoffeln (mehligkochend)","g"],[2,"Stangen","Lauch","g"],[1,"l","Gemüsebrühe","v"],[100,"ml","Sahne","k"],[1,"Stk","Baguette","b"]],m:"Kartoffeln würfeln, Lauch in Ringe schneiden, beides andünsten. Mit Brühe aufgießen, 15 Min. kochen, pürieren, Sahne einrühren. Mit Baguette servieren."},
 {id:"d04",N:{kcal:620,p:22,f:19,kh:88,bs:4,gv:0,pm:0,q:"s"},n:"Pfannkuchen mit Apfelmus",t:20,k:"veg",kid:1,i:[[250,"g","Mehl","v"],[500,"ml","Milch","k"],[3,"Stk","Eier","k"],[1,"Glas","Apfelmus","v"]],m:"Mehl, Milch, Eier und eine Prise Salz glatt rühren, 5 Min. quellen lassen. In Butter dünne Pfannkuchen ausbacken, mit Apfelmus und etwas Zucker essen."},
 {id:"d05",N:{kcal:960,p:35,f:47,kh:93,bs:15,gv:330,pm:0,q:"s"},n:"Wraps mit Bohnen, Mais & Käse",t:20,k:"veg",kid:1,i:[[6,"Stk","Tortilla-Wraps","b"],[1,"Dose","Kidneybohnen","v"],[1,"Dose","Mais","v"],[1,"Stk","Paprika","g"],[200,"g","Schmand","k"],[150,"g","Gouda gerieben","k"],[1,"Kopf","Salat","g"]],m:"Bohnen und Mais abspülen, mit gewürfelter Paprika kurz in der Pfanne erwärmen und würzen. Wraps warm machen, mit Schmand bestreichen, Füllung, Käse und Salat drauf, einrollen."},
 {id:"d06",N:{kcal:680,p:21,f:23,kh:95,bs:8,gv:150,pm:0,q:"s"},n:"Gnocchi mit Spinat & Frischkäse",t:15,k:"veg",i:[[800,"g","Gnocchi","k"],[450,"g","Blattspinat","t"],[150,"g","Frischkäse","k"],[1,"Zehen","Knoblauch","g"],[40,"g","Parmesan","k"]],m:"Gnocchi in der Pfanne goldbraun braten. Spinat und Knoblauch dazu, bis der Spinat zusammenfällt. Frischkäse mit einem Schluck Wasser unterrühren, mit Parmesan servieren."},
 {id:"d07",N:{kcal:770,p:32,f:10,kh:132,bs:14,gv:300,pm:0,q:"s"},n:"Linsen-Bolognese",t:30,k:"veg",kid:1,i:[[400,"g","Spaghetti","v"],[150,"g","Rote Linsen","v"],[500,"g","Passierte Tomaten","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zwiebel","g"]],m:"Zwiebel und Karotten fein würfeln und andünsten. Linsen, Tomaten und 300 ml Wasser dazu, 15 Min. köcheln bis die Linsen weich sind. Mit Salz, Pfeffer, Oregano würzen. Zu den Nudeln."},
 {id:"d08",N:{kcal:550,p:21,f:16,kh:79,bs:7,gv:170,pm:0,q:"s"},cu:"asia",n:"Gebratener Reis mit Ei & Gemüse",t:20,k:"veg",kid:1,i:[[250,"g","Reis","v"],[4,"Stk","Eier","k"],[200,"g","Erbsen","t"],[2,"Stk","Karotten","g"],[1,"Bund","Frühlingszwiebeln","g"]],m:"Reis kochen (am besten vom Vortag). Karotten würfeln und anbraten, Erbsen und Reis dazu, kräftig braten. Eier an den Rand schlagen, verrühren, alles mischen, mit Sojasauce und Frühlingszwiebeln."},
 {id:"d09",N:{kcal:450,p:28,f:8,kh:60,bs:8,gv:130,pm:0,q:"s"},n:"Pellkartoffeln mit Kräuterquark",t:25,k:"veg",i:[[1000,"g","Kartoffeln (festkochend)","g"],[500,"g","Quark","k"],[1,"Bund","Schnittlauch","g"],[1,"Stk","Gurke","g"]],m:"Kartoffeln mit Schale 20 Min. kochen. Quark mit etwas Milch glatt rühren, Schnittlauch, Salz, Pfeffer dazu. Gurke in Scheiben als Beilage."},
 {id:"d10",N:{kcal:800,p:30,f:28,kh:101,bs:8,gv:130,pm:0,q:"s"},n:"Nudeln mit Brokkoli-Käsesauce",t:20,k:"veg",kid:1,i:[[400,"g","Fusilli","v"],[1,"Stk","Brokkoli","g"],[200,"g","Frischkäse","k"],[40,"g","Parmesan","k"]],m:"Brokkoli in Röschen die letzten 5 Min. mit den Nudeln kochen. Abgießen, etwas Nudelwasser aufheben. Frischkäse, Parmesan und Nudelwasser zu einer cremigen Sauce unterrühren."},
 {id:"d11",N:{kcal:890,p:24,f:46,kh:89,bs:6,gv:100,pm:0,q:"s"},n:"Flammkuchen mit Lauch",t:25,k:"veg",kid:1,i:[[2,"Pck","Flammkuchenteig","k"],[200,"g","Schmand","k"],[1,"Stangen","Lauch","g"],[1,"Stk","Zwiebel","g"],[100,"g","Gouda gerieben","k"]],m:"Ofen auf 220 °C vorheizen. Teig ausrollen, mit gewürztem Schmand bestreichen, Lauch- und Zwiebelringe und Käse drauf. 12–15 Min. backen."},
 {id:"d12",N:{kcal:670,p:28,f:24,kh:79,bs:11,gv:270,pm:0,q:"s"},n:"Couscous-Salat mit Feta & Kichererbsen",t:15,k:"veg",i:[[250,"g","Couscous","v"],[1,"Stk","Gurke","g"],[1,"Stk","Paprika","g"],[200,"g","Feta","k"],[1,"Stk","Zitrone","g"],[1,"Dose","Kichererbsen","v"]],m:"Couscous mit heißer Brühe übergießen, 5 Min. ziehen lassen. Gemüse würfeln, Kichererbsen abspülen. Alles mischen, mit Zitronensaft, Öl, Salz anmachen, Feta drüber."},
 {id:"d13",N:{kcal:900,p:31,f:37,kh:108,bs:10,gv:170,pm:0,q:"s"},n:"Tortellini in Tomatensahne",t:15,k:"veg",kid:1,i:[[750,"g","Käse-Tortellini","k"],[500,"g","Passierte Tomaten","v"],[100,"ml","Sahne","k"],[1,"Bund","Basilikum","g"]],m:"Tomaten mit Sahne aufkochen, würzen. Tortellini nach Packung kochen und in der Sauce schwenken, Basilikum drüber."},
 {id:"d14",N:{kcal:540,p:28,f:24,kh:48,bs:10,gv:190,pm:0,q:"s"},n:"Rührei mit Brot & Rohkost",t:10,k:"veg",kid:1,i:[[8,"Stk","Eier","k"],[1,"Laib","Vollkornbrot","b"],[2,"Stk","Karotten","g"],[1,"Stk","Gurke","g"]],m:"Eier mit einem Schuss Milch verquirlen, in Butter bei mittlerer Hitze stocken lassen. Karotten und Gurke in Sticks schneiden, dazu Brot."},
 {id:"d15",N:{kcal:810,p:17,f:32,kh:111,bs:11,gv:280,pm:0,q:"s"},cu:"indien",n:"Süßkartoffel-Kichererbsen-Curry",t:30,k:"veg",i:[[250,"g","Reis","v"],[1,"Dose","Kokosmilch","v"],[1,"Dose","Kichererbsen","v"],[1,"Stk","Süßkartoffel","g"],[100,"g","Babyspinat","g"],[1,"Stk","Zwiebel","g"]],m:"Reis kochen. Zwiebel andünsten, Süßkartoffel würfeln, mit 2 TL Currypulver anrösten. Kokosmilch und Kichererbsen dazu, 15 Min. köcheln. Spinat unterheben."},
 {id:"d16",N:{kcal:920,p:35,f:50,kh:76,bs:11,gv:180,pm:0,q:"s"},n:"Quesadillas mit Käse & Bohnen",t:15,k:"veg",kid:1,i:[[6,"Stk","Tortilla-Wraps","b"],[200,"g","Gouda gerieben","k"],[1,"Dose","Kidneybohnen","v"],[3,"Stk","Tomaten","g"],[200,"g","Schmand","k"]],m:"Bohnen grob zerdrücken, würzen. Auf eine Wrap-Hälfte Bohnen, Tomatenwürfel und Käse, zuklappen, in der Pfanne von beiden Seiten knusprig braten. Mit Schmand."},
 {id:"d17",N:{kcal:450,p:16,f:19,kh:52,bs:5,gv:0,pm:0,q:"s"},n:"Grießbrei mit Beeren",t:15,k:"veg",kid:1,i:[[1000,"ml","Milch","k"],[120,"g","Weichweizengrieß","v"],[300,"g","Beerenmischung","t"]],m:"Milch mit etwas Zucker aufkochen, Grieß einrühren, unter Rühren 5 Min. quellen lassen. Beeren kurz erwärmen und drübergeben."},
 {id:"d18",N:{kcal:420,p:19,f:13,kh:53,bs:10,gv:220,pm:0,q:"s"},n:"Schnelle Minestrone",t:30,k:"veg",i:[[1,"l","Gemüsebrühe","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zucchini","g"],[150,"g","Suppennudeln","v"],[1,"Dose","Weiße Bohnen","v"],[40,"g","Parmesan","k"]],m:"Gemüse würfeln und andünsten, mit Brühe aufgießen, 10 Min. köcheln. Nudeln und Bohnen dazu, weitere 8 Min. Mit Parmesan servieren."},
 {id:"d19",N:{kcal:670,p:28,f:30,kh:67,bs:6,gv:220,pm:0,q:"s"},n:"Blechpizza mit Gemüse",t:25,k:"veg",kid:1,i:[[1,"Pck","Pizzateig","k"],[250,"g","Passierte Tomaten","v"],[2,"Kugeln","Mozzarella","k"],[1,"Stk","Paprika","g"],[250,"g","Champignons","g"]],m:"Ofen auf 220 °C. Teig aufs Blech, mit gewürzten Tomaten bestreichen, Gemüse und zerzupften Mozzarella drauf. 15 Min. backen."},
 {id:"d20",N:{kcal:670,p:32,f:28,kh:70,bs:11,gv:300,pm:0,q:"s"},n:"Veggie-Burger",t:20,k:"veg",kid:1,i:[[4,"Stk","Burgerbrötchen","b"],[4,"Stk","Veggie-Patties","k"],[2,"Stk","Tomaten","g"],[1,"Kopf","Salat","g"],[1,"Stk","Gurke","g"]],m:"Patties nach Packung braten, Brötchen kurz toasten. Mit Salat, Tomate, Gurke und Ketchup belegen."},
 {id:"d21",N:{kcal:640,p:33,f:28,kh:62,bs:8,gv:410,pm:0,q:"s"},n:"Shakshuka mit Baguette",t:25,k:"veg",i:[[6,"Stk","Eier","k"],[800,"g","Stückige Tomaten","v"],[2,"Stk","Paprika","g"],[1,"Stk","Zwiebel","g"],[100,"g","Feta","k"],[1,"Stk","Baguette","b"]],m:"Zwiebel und Paprika andünsten, Tomaten dazu, mit Paprikapulver und Kreuzkümmel 10 Min. köcheln. Mulden machen, Eier hineinschlagen, zugedeckt 6–8 Min. garen. Feta drüber."},
 {id:"d22",N:{kcal:1040,p:45,f:35,kh:133,bs:8,gv:170,pm:0,q:"s"},n:"Käsespätzle mit Salat",t:20,k:"veg",kid:1,i:[[800,"g","Frische Spätzle","k"],[200,"g","Emmentaler gerieben","k"],[2,"Stk","Zwiebel","g"],[1,"Kopf","Salat","g"]],m:"Zwiebeln in Ringen goldbraun braten, rausnehmen. Spätzle in der Pfanne erhitzen, Käse unterheben bis er schmilzt. Zwiebeln drauf, Salat dazu."},
 {id:"d23",N:{kcal:610,p:35,f:20,kh:71,bs:11,gv:240,pm:0,q:"s"},cu:"asia",n:"Asia-Nudeln mit Tofu",t:20,k:"veg",i:[[250,"g","Mie-Nudeln","v"],[400,"g","Tofu","k"],[1,"Stk","Brokkoli","g"],[2,"Stk","Karotten","g"],[1,"Bund","Frühlingszwiebeln","g"]],m:"Tofu würfeln und knusprig braten. Gemüse in feine Stücke schneiden und kurz braten. Nudeln kochen, alles mischen, mit Sojasauce und etwas Honig abschmecken."},
 {id:"d24",N:{kcal:550,p:39,f:10,kh:72,bs:4,gv:190,pm:0,q:"s"},n:"Hähnchen-Gemüse-Pfanne mit Reis",t:25,k:"fleisch",kid:1,i:[[400,"g","Hähnchenbrust","f"],[250,"g","Reis","v"],[2,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"]],m:"Reis kochen. Hähnchen in Streifen scharf anbraten, würzen, rausnehmen. Gemüse braten, Hähnchen zurück, mit Sojasauce oder Paprikapulver abschmecken."},
 {id:"d25",N:{kcal:680,p:33,f:23,kh:80,bs:12,gv:100,pm:0,q:"s"},n:"Fischstäbchen mit Püree & Erbsen",t:25,k:"fisch",kid:1,i:[[15,"Stk","Fischstäbchen","t"],[800,"g","Kartoffeln (mehligkochend)","g"],[200,"ml","Milch","k"],[300,"g","Erbsen","t"]],m:"Kartoffeln schälen, 18 Min. kochen, mit warmer Milch und Butter stampfen. Fischstäbchen in der Pfanne braten, Erbsen kurz kochen."},
 {id:"d26",N:{kcal:920,p:41,f:39,kh:97,bs:4,gv:0,pm:0,q:"s"},n:"Lachs mit Zitronen-Nudeln",t:20,k:"fisch",i:[[350,"g","Lachsfilet","f"],[400,"g","Spaghetti","v"],[1,"Stk","Zitrone","g"],[150,"g","Crème fraîche","k"]],m:"Nudeln kochen. Lachs würfeln und kurz braten. Crème fraîche mit Zitronenabrieb und -saft erwärmen, Nudeln und Lachs unterheben, pfeffern."},
 {id:"d27",N:{kcal:930,p:43,f:36,kh:105,bs:7,gv:230,pm:0,q:"s"},n:"Spaghetti Bolognese",t:30,k:"fleisch",kid:1,i:[[400,"g","Hackfleisch gemischt","f"],[400,"g","Spaghetti","v"],[500,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"],[1,"Stk","Karotten","g"]],m:"Hack krümelig anbraten, Zwiebel und Karotte fein gewürfelt dazu. Tomaten angießen, 15 Min. köcheln, würzen. Zu den Nudeln."},
 {id:"d28",N:{kcal:880,p:44,f:30,kh:99,bs:12,gv:380,pm:0,q:"s"},n:"Chili con Carne mit Reis",t:30,k:"fleisch",i:[[400,"g","Rinderhack","f"],[1,"Dose","Kidneybohnen","v"],[1,"Dose","Mais","v"],[500,"g","Passierte Tomaten","v"],[250,"g","Reis","v"],[1,"Stk","Zwiebel","g"]],m:"Hack mit Zwiebel anbraten, mit Paprikapulver und Kreuzkümmel würzen. Tomaten, Bohnen und Mais dazu, 15 Min. köcheln. Reis parallel kochen."},
 {id:"d29",N:{kcal:840,p:51,f:31,kh:84,bs:5,gv:80,pm:0,q:"s"},n:"Putengeschnetzeltes mit Bandnudeln",t:25,k:"fleisch",kid:1,i:[[400,"g","Putenbrust","f"],[250,"g","Champignons","g"],[200,"ml","Sahne","k"],[350,"g","Bandnudeln","v"]],m:"Nudeln kochen. Pute in Streifen anbraten, rausnehmen. Pilze braten, Sahne angießen, Fleisch zurück, 3 Min. köcheln, würzen."},
 {id:"d30",N:{kcal:720,p:26,f:24,kh:97,bs:8,gv:170,pm:0,q:"s"},n:"Ofen-Gnocchi mit Tomaten & Mozzarella",t:25,k:"veg",kid:1,i:[[800,"g","Gnocchi","k"],[500,"g","Kirschtomaten","g"],[2,"Kugeln","Mozzarella","k"],[1,"Bund","Basilikum","g"]],m:"Ofen auf 200 °C. Gnocchi und halbierte Tomaten mit Öl, Salz und Knoblauch in eine Form, 15 Min. backen. Mozzarella drauf, 5 Min. weiter, Basilikum drüber."},
 {id:"d31",N:{kcal:640,p:16,f:33,kh:74,bs:10,gv:330,pm:0,q:"s"},n:"Kürbissuppe mit Kokosmilch",t:30,k:"veg",i:[[1,"Stk","Hokkaido-Kürbis","g"],[1,"Dose","Kokosmilch","v"],[1,"l","Gemüsebrühe","v"],[1,"Stk","Zwiebel","g"],[1,"Stk","Baguette","b"]],m:"Hokkaido entkernen (Schale kann dranbleiben) und würfeln, mit der Zwiebel andünsten. Brühe dazu, 15 Min. kochen, Kokosmilch einrühren, pürieren. Mit Salz, Pfeffer und etwas Curry abschmecken, Baguette dazu."},
 {id:"d32",N:{kcal:540,p:23,f:25,kh:53,bs:7,gv:300,pm:0,q:"s"},n:"Tomatensuppe mit Käsetoast",t:20,k:"veg",kid:1,i:[[800,"g","Stückige Tomaten","v"],[0.5,"l","Gemüsebrühe","v"],[1,"Pck","Toastbrot","b"],[150,"g","Gouda in Scheiben","k"],[1,"Stk","Zwiebel","g"]],m:"Zwiebel andünsten, Tomaten und Brühe dazu, 10 Min. köcheln, pürieren und mit etwas Zucker abschmecken. Toast mit Gouda belegen, zuklappen und in der Pfanne mit etwas Butter goldbraun braten."},
 {id:"d33",N:{kcal:510,p:25,f:19,kh:52,bs:10,gv:150,pm:0,q:"s"},n:"Ofen-Pommes mit Spiegelei & Spinat",t:30,k:"veg",kid:1,i:[[1000,"g","Kartoffeln (festkochend)","g"],[6,"Stk","Eier","k"],[450,"g","Blattspinat","t"]],m:"Ofen auf 220 °C. Kartoffeln in Stifte schneiden, mit Öl und Salz aufs Blech, 25 Min. backen. Spinat mit Knoblauch in der Pfanne erwärmen, Spiegeleier braten."},
 {id:"d34",N:{kcal:590,p:21,f:14,kh:92,bs:7,gv:130,pm:0,q:"s"},n:"Erbsen-Risotto",t:30,k:"veg",i:[[300,"g","Risottoreis","v"],[300,"g","Erbsen","t"],[1,"l","Gemüsebrühe","v"],[60,"g","Parmesan","k"],[1,"Stk","Zwiebel","g"]],m:"Zwiebel andünsten, Reis kurz mitrösten. Nach und nach heiße Brühe angießen und rühren, ca. 18 Min. Die letzten 5 Min. Erbsen dazu. Parmesan und ein Stück Butter unterrühren."},
 {id:"d35",N:{kcal:880,p:28,f:39,kh:101,bs:6,gv:80,pm:0,q:"s"},n:"Nudelsalat mit Pesto & Mozzarella",t:20,k:"veg",kid:1,i:[[400,"g","Fusilli","v"],[1,"Glas","Grünes Pesto","v"],[250,"g","Kirschtomaten","g"],[1,"Kugeln","Mozzarella","k"]],m:"Nudeln kochen, kalt abschrecken. Mit Pesto mischen, halbierte Tomaten und Mozzarella-Würfel unterheben. Hält sich gut bis zum nächsten Tag."},
 {id:"d36",N:{kcal:620,p:24,f:13,kh:99,bs:6,gv:170,pm:0,q:"s"},n:"Spaghetti mit Zucchini & Knoblauch",t:15,k:"veg",i:[[400,"g","Spaghetti","v"],[2,"Stk","Zucchini","g"],[3,"Zehen","Knoblauch","g"],[40,"g","Parmesan","k"]],m:"Zucchini in dünne Scheiben schneiden und in Olivenöl goldbraun braten, Knoblauch kurz mitbraten. Mit den Nudeln und etwas Nudelwasser mischen, Parmesan drüber."},
 {id:"d37",N:{kcal:570,p:21,f:20,kh:75,bs:4,gv:0,pm:0,q:"s"},n:"Kaiserschmarrn mit Apfelmus",t:25,k:"veg",kid:1,i:[[200,"g","Mehl","v"],[400,"ml","Milch","k"],[4,"Stk","Eier","k"],[1,"Glas","Apfelmus","v"]],m:"Eier trennen. Mehl, Milch, Eigelb und eine Prise Zucker verrühren, Eiweiß steif schlagen und unterheben. In Butter backen, wenden, mit zwei Gabeln zerreißen, mit Zucker karamellisieren. Mit Apfelmus."},
 {id:"d38",N:{kcal:500,p:23,f:19,kh:55,bs:8,gv:170,pm:0,q:"s"},n:"Bratkartoffeln mit Spiegelei & Gurkensalat",t:25,k:"veg",kid:1,i:[[1000,"g","Kartoffeln (festkochend)","g"],[6,"Stk","Eier","k"],[1,"Stk","Gurke","g"],[1,"Stk","Zwiebel","g"]],m:"Kartoffeln in dünne Scheiben schneiden und in reichlich Öl 15–20 Min. knusprig braten, Zwiebel am Ende dazu. Gurke hobeln, mit Essig, Öl, Salz und Zucker anmachen. Spiegeleier braten."},
 {id:"d39",N:{kcal:600,p:24,f:23,kh:70,bs:8,gv:270,pm:0,q:"s"},n:"Ofengemüse mit Feta & Couscous",t:30,k:"veg",i:[[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[250,"g","Kirschtomaten","g"],[200,"g","Feta","k"],[250,"g","Couscous","v"]],m:"Ofen auf 200 °C. Gemüse grob schneiden, mit Öl, Salz und Kräutern aufs Blech, Feta in die Mitte, 25 Min. backen. Couscous mit heißer Brühe übergießen und 5 Min. quellen lassen."},
 {id:"d40",N:{kcal:920,p:39,f:35,kh:108,bs:4,gv:0,pm:0,q:"s"},n:"Mac and Cheese",t:20,k:"veg",kid:1,i:[[400,"g","Makkaroni","v"],[400,"ml","Milch","k"],[200,"g","Cheddar gerieben","k"],[30,"g","Mehl","v"]],m:"Nudeln kochen. 30 g Butter schmelzen, Mehl einrühren, nach und nach Milch dazu, aufkochen. Käse darin schmelzen, mit Salz und etwas Senf würzen, mit den Nudeln mischen."},
 {id:"d41",N:{kcal:970,p:36,f:33,kh:124,bs:16,gv:200,pm:0,q:"s"},n:"Rote-Linsen-Suppe mit Karotten",t:30,k:"veg",i:[[250,"g","Rote Linsen","v"],[3,"Stk","Karotten","g"],[1,"Dose","Kokosmilch","v"],[1,"l","Gemüsebrühe","v"],[1,"Stk","Zwiebel","g"],[1,"Stk","Fladenbrot","b"]],m:"Zwiebel und Karotten würfeln, andünsten. Linsen und Brühe dazu, 15 Min. kochen. Kokosmilch einrühren, pürieren, mit Kreuzkümmel und Zitrone abschmecken. Fladenbrot dazu."},
 {id:"d42",N:{kcal:850,p:28,f:37,kh:100,bs:15,gv:300,pm:0,q:"s"},n:"Falafel-Wraps mit Joghurtsauce",t:20,k:"veg",i:[[300,"g","Falafel (fertig)","k"],[6,"Stk","Tortilla-Wraps","b"],[250,"g","Naturjoghurt","k"],[1,"Stk","Gurke","g"],[2,"Stk","Tomaten","g"],[1,"Kopf","Salat","g"]],m:"Falafel in der Pfanne oder im Ofen erwärmen. Joghurt mit Salz, Knoblauch und geriebener Gurke verrühren. Wraps mit Salat, Tomaten, Falafel und Sauce füllen."},
 {id:"d43",N:{kcal:510,p:14,f:11,kh:82,bs:9,gv:30,pm:0,q:"s"},n:"Kartoffelpuffer mit Apfelmus",t:30,k:"veg",kid:1,i:[[1000,"g","Kartoffeln (festkochend)","g"],[2,"Stk","Eier","k"],[40,"g","Mehl","v"],[1,"Stk","Zwiebel","g"],[1,"Glas","Apfelmus","v"]],m:"Kartoffeln und Zwiebel fein reiben, gut ausdrücken. Mit Eiern, Mehl und Salz mischen. Flache Puffer in reichlich Öl von beiden Seiten knusprig braten. Mit Apfelmus."},
 {id:"d44",N:{kcal:540,p:15,f:30,kh:50,bs:7,gv:200,pm:0,q:"s"},n:"Champignon-Rahm mit Semmelknödeln",t:20,k:"veg",i:[[500,"g","Champignons","g"],[200,"ml","Sahne","k"],[1,"Pck","Semmelknödel (Kochbeutel)","v"],[1,"Stk","Zwiebel","g"],[1,"Bund","Petersilie","g"]],m:"Knödel nach Packung garen. Pilze in Scheiben scharf anbraten, Zwiebel dazu. Sahne angießen, 3 Min. köcheln, mit Salz, Pfeffer und Petersilie abschmecken."},
 {id:"d45",N:{kcal:490,p:21,f:16,kh:64,bs:5,gv:150,pm:0,q:"s"},cu:"asia",n:"Nudelsuppe mit Ei & Pak Choi",t:20,k:"veg",i:[[250,"g","Mie-Nudeln","v"],[1.5,"l","Gemüsebrühe","v"],[3,"Stk","Eier","k"],[2,"Stk","Pak Choi","g"],[1,"Bund","Frühlingszwiebeln","g"]],m:"Eier 7 Min. kochen und pellen. Brühe mit Sojasauce und etwas Ingwer würzen, Pak Choi darin 3 Min. garen. Nudeln dazu, in Schalen mit halbierten Eiern und Frühlingszwiebeln servieren."},
 {id:"d46",N:{kcal:700,p:26,f:10,kh:117,bs:20,gv:620,pm:0,q:"s"},n:"Chili sin Carne",t:30,k:"veg",i:[[2,"Dose","Kidneybohnen","v"],[1,"Dose","Mais","v"],[800,"g","Stückige Tomaten","v"],[1,"Stk","Paprika","g"],[250,"g","Reis","v"],[1,"Stk","Zwiebel","g"]],m:"Reis kochen. Zwiebel und Paprika andünsten, mit Paprikapulver und Kreuzkümmel würzen. Tomaten, Bohnen und Mais dazu, 15 Min. köcheln. Für das Kind vor dem Schärfen eine Portion abnehmen."},
 {id:"d47",N:{kcal:660,p:27,f:24,kh:81,bs:9,gv:230,pm:0,q:"s"},n:"Pizzabrötchen",t:20,k:"veg",kid:1,i:[[6,"Stk","Aufbackbrötchen","b"],[250,"g","Passierte Tomaten","v"],[150,"g","Gouda gerieben","k"],[1,"Stk","Paprika","g"],[1,"Dose","Mais","v"]],m:"Ofen auf 200 °C. Brötchen halbieren, mit gewürzten Tomaten bestreichen, Paprika, Mais und Käse drauf. 10–12 Min. backen. Dazu passt Rohkost."},
 {id:"d48",N:{kcal:740,p:33,f:22,kh:99,bs:7,gv:150,pm:0,q:"s"},n:"Penne mit Spinat & Ricotta",t:15,k:"veg",i:[[400,"g","Penne","v"],[450,"g","Blattspinat","t"],[250,"g","Ricotta","k"],[40,"g","Parmesan","k"]],m:"Nudeln kochen. Spinat mit etwas Knoblauch in der Pfanne auftauen lassen, Ricotta und etwas Nudelwasser einrühren, mit Muskat würzen. Nudeln unterheben, Parmesan drüber."},
 {id:"d49",N:{kcal:640,p:18,f:19,kh:96,bs:2,gv:0,pm:0,q:"s"},n:"Milchreis mit Kirschen",t:30,k:"veg",kid:1,i:[[250,"g","Milchreis","v"],[1000,"ml","Milch","k"],[1,"Glas","Sauerkirschen","v"]],m:"Milch mit etwas Zucker aufkochen, Milchreis einrühren, bei kleinster Hitze 25 Min. zugedeckt quellen lassen, ab und zu rühren. Kirschen erwärmen, mit etwas Stärke andicken, mit Zimt und Zucker servieren."},
 {id:"d50",N:{kcal:440,p:15,f:12,kh:67,bs:9,gv:140,pm:0,q:"s"},n:"Bulgur-Gemüse-Pfanne mit Joghurt",t:25,k:"veg",i:[[250,"g","Bulgur","v"],[1,"Stk","Zucchini","g"],[1,"Stk","Paprika","g"],[250,"g","Naturjoghurt","k"],[0.5,"l","Gemüsebrühe","v"]],m:"Gemüse würfeln und anbraten, Bulgur kurz mitrösten. Brühe angießen, zugedeckt 10 Min. quellen lassen. Mit Paprikapulver würzen, Joghurt mit Salz und Knoblauch dazu."},
 {id:"d51",N:{kcal:750,p:30,f:23,kh:101,bs:6,gv:170,pm:0,q:"s"},n:"Ofen-Feta-Pasta",t:30,k:"veg",kid:1,i:[[200,"g","Feta","k"],[500,"g","Kirschtomaten","g"],[400,"g","Penne","v"],[2,"Zehen","Knoblauch","g"],[1,"Bund","Basilikum","g"]],m:"Ofen auf 200 °C. Tomaten und Knoblauch in eine Form, Feta in die Mitte, Olivenöl drüber, 25 Min. backen. Nudeln kochen. Feta und Tomaten zerdrücken, Nudeln unterrühren, Basilikum drüber."},
 {id:"d52",N:{kcal:570,p:15,f:21,kh:79,bs:10,gv:300,pm:0,q:"s"},cu:"asia",n:"Bunte Reis-Bowl mit Edamame",t:25,k:"veg",i:[[250,"g","Sushireis","v"],[1,"Stk","Gurke","g"],[2,"Stk","Karotten","g"],[1,"Stk","Avocado","g"],[200,"g","Edamame","t"]],m:"Reis kochen, mit etwas Reisessig und Zucker würzen. Edamame 4 Min. kochen. Gemüse in Streifen schneiden, Avocado in Scheiben. Alles in Schalen anrichten, mit Sojasauce und Sesam."},
 {id:"d53",N:{kcal:560,p:41,f:11,kh:67,bs:6,gv:0,pm:0,q:"s"},n:"Ofen-Nuggets mit Kartoffelspalten",t:30,k:"fleisch",kid:1,i:[[400,"g","Hähnchenbrust","f"],[100,"g","Cornflakes (ungezuckert)","v"],[1,"Stk","Eier","k"],[800,"g","Kartoffeln (festkochend)","g"]],m:"Ofen auf 220 °C. Kartoffeln in Spalten schneiden, mit Öl und Salz aufs Blech, 10 Min. vorbacken. Hähnchen in Stücke schneiden, durch verquirltes Ei und zerbröselte Cornflakes ziehen, mit aufs Blech, weitere 15 Min. backen."},
 {id:"d54",N:{kcal:740,p:36,f:32,kh:74,bs:3,gv:200,pm:0,q:"s"},n:"Gyros-Pfanne mit Tzatziki & Reis",t:25,k:"fleisch",i:[[400,"g","Gyros (gewürzt)","f"],[250,"g","Reis","v"],[250,"g","Tzatziki","k"],[2,"Stk","Tomaten","g"],[1,"Stk","Gurke","g"]],m:"Reis kochen. Gyros in der heißen Pfanne portionsweise knusprig braten. Tomaten und Gurke als schnellen Salat dazu, Tzatziki drauf."},
 {id:"d55",N:{kcal:550,p:20,f:30,kh:46,bs:7,gv:170,pm:1,q:"s"},n:"Würstchen mit Kartoffelsalat",t:25,k:"fleisch",kid:1,i:[[6,"Stk","Wiener Würstchen","k"],[800,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Gurke","g"],[1,"Stk","Zwiebel","g"],[0.25,"l","Gemüsebrühe","v"]],m:"Kartoffeln 20 Min. kochen, pellen, in Scheiben schneiden. Mit heißer Brühe, fein gewürfelter Zwiebel, Essig, Öl, Senf, Salz und Pfeffer anmachen, Gurke dazu. Würstchen in heißem Wasser erwärmen."},
 {id:"d56",N:{kcal:800,p:41,f:39,kh:66,bs:11,gv:100,pm:0,q:"s"},n:"Frikadellen mit Püree & Erbsen",t:30,k:"fleisch",kid:1,i:[[400,"g","Hackfleisch gemischt","f"],[1,"Stk","Eier","k"],[50,"g","Semmelbrösel","v"],[800,"g","Kartoffeln (mehligkochend)","g"],[200,"ml","Milch","k"],[300,"g","Erbsen","t"]],m:"Hack mit Ei, Semmelbröseln, Senf, Salz und Pfeffer verkneten, kleine Frikadellen formen und 10 Min. braten. Kartoffeln kochen, mit Milch und Butter stampfen. Erbsen kurz kochen."},
 {id:"d57",N:{kcal:740,p:36,f:35,kh:69,bs:5,gv:80,pm:0,q:"s"},n:"Fisch-Tacos mit Krautsalat",t:20,k:"fisch",i:[[400,"g","Seelachsfilet","t"],[6,"Stk","Tortilla-Wraps","b"],[250,"g","Krautsalat","k"],[200,"g","Schmand","k"],[1,"Stk","Zitrone","g"]],m:"Fisch auftauen, trocken tupfen, würzen und in Stücken in der Pfanne braten. Schmand mit Zitronensaft und Salz verrühren. Wraps erwärmen, mit Krautsalat, Fisch und Sauce füllen."},
 {id:"d58",N:{kcal:700,p:44,f:10,kh:103,bs:7,gv:200,pm:0,q:"s"},n:"Thunfisch-Tomaten-Pasta",t:15,k:"fisch",kid:1,i:[[400,"g","Spaghetti","v"],[2,"Dose","Thunfisch (im eigenen Saft)","v"],[500,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"]],m:"Zwiebel andünsten, Tomaten dazu, 5 Min. köcheln. Thunfisch abtropfen, unterrühren, mit Oregano, Salz und Pfeffer würzen. Mit den Nudeln mischen."},
 {id:"d59",N:{kcal:630,p:41,f:20,kh:67,bs:6,gv:170,pm:0,q:"s"},n:"Hähnchen-Wraps mit Joghurt",t:20,k:"fleisch",kid:1,i:[[350,"g","Hähnchenbrust","f"],[6,"Stk","Tortilla-Wraps","b"],[1,"Kopf","Salat","g"],[2,"Stk","Tomaten","g"],[250,"g","Naturjoghurt","k"]],m:"Hähnchen in Streifen schneiden, mit Paprikapulver würzen und braten. Joghurt mit Salz und Kräutern verrühren. Wraps mit Salat, Tomaten, Hähnchen und Sauce füllen."},
 {id:"d60",N:{kcal:580,p:37,f:25,kh:45,bs:9,gv:130,pm:0,q:"s"},n:"Ofenlachs mit Kartoffeln & Brokkoli",t:30,k:"fisch",i:[[400,"g","Lachsfilet","f"],[800,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Brokkoli","g"],[1,"Stk","Zitrone","g"]],m:"Ofen auf 200 °C. Kartoffeln halbieren, mit Öl und Salz aufs Blech, 15 Min. backen. Lachs und Brokkoli-Röschen dazulegen, mit Zitronenscheiben und Öl, weitere 12 Min. backen."},
 {id:"b01",N:{kcal:460,p:17,f:15,kh:62,bs:11,gv:230,pm:0,q:"s"},aus:1,src:["DGE / IN FORM: Günstig und lecker durch die Woche","https://www.dge.de/fileadmin/dok/gesunde-ernaehrung/ernaehrungsempfehlung/Broschuere-DGE-InForm-Rezepte-Familien.pdf"],n:"Gemüsesuppe mit Vollkorn-Pfannkuchenstreifen",t:40,k:"veg",kid:1,i:[[75,"g","Mehl","v"],[75,"g","Vollkornmehl","v"],[150,"ml","Milch","k"],[150,"ml","Mineralwasser (mit Kohlensäure)","v"],[2,"Stk","Eier","k"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[600,"g","Suppengemüse / gemischtes Gemüse","g"],[250,"g","Kartoffeln (festkochend)","g"],[0.9,"l","Gemüsebrühe","v"]],m:"Mehl, Vollkornmehl, Milch, Mineralwasser, Eier und eine Prise Salz verrühren und dünne Pfannkuchen in Rapsöl backen, aufrollen und in Streifen schneiden. Zwiebel und Knoblauch andünsten, klein geschnittenes Gemüse und Kartoffelwürfel dazu, mit Brühe aufgießen und ca. 15 Min. garen. Mit Salz, Pfeffer und Muskat abschmecken, Pfannkuchenstreifen in die Teller geben."},
 {id:"b02",N:{kcal:420,p:18,f:10,kh:58,bs:11,gv:230,pm:0,q:"s"},aus:1,src:["DGE / IN FORM: Günstig und lecker durch die Woche","https://www.dge.de/fileadmin/dok/gesunde-ernaehrung/ernaehrungsempfehlung/Broschuere-DGE-InForm-Rezepte-Familien.pdf"],n:"Bunte Gemüsepommes mit Curry-Quarkdip",t:45,k:"veg",kid:1,i:[[6,"Stk","Kartoffeln (mittelgroß)","g"],[3,"Stk","Karotten","g"],[1,"Stk","Zucchini","g"],[200,"g","Pastinaken","g"],[200,"g","Quark","k"],[200,"g","Naturjoghurt","k"],[1,"Stk","Zitrone","g"]],m:"Ofen auf 200 °C. Kartoffeln, Karotten, Zucchini und Pastinaken in Stifte schneiden, mit 2 EL Rapsöl und Salz mischen und auf dem Blech ca. 30–35 Min. backen, einmal wenden. Quark mit Joghurt, 1 TL Honig, etwas Zitronensaft, 1 TL Curry, Salz und Pfeffer verrühren."},
 {id:"b03",N:{kcal:690,p:40,f:32,kh:53,bs:18,gv:300,pm:0,q:"s"},aus:1,src:["familienkost.de: Vegetarische Frikadellen","https://www.familienkost.de/rezept_vegetarische_frikadellen.html"],n:"Bohnen-Frikadellen mit Salat & Joghurtdip",t:25,k:"veg",kid:1,i:[[2,"Dose","Kidneybohnen","v"],[120,"g","Haferflocken","v"],[2,"Stk","Eier","k"],[150,"g","Gouda gerieben","k"],[1,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[1,"Bund","Petersilie","g"],[1,"Kopf","Salat","g"],[250,"g","Naturjoghurt","k"]],m:"Bohnen abspülen und fein zerdrücken. Fein gewürfelte Zwiebel, Knoblauch, gehackte Petersilie, Eier, Haferflocken und Käse dazu, mit Salz und Paprikapulver würzen und verkneten. Kleine Frikadellen formen und in Rapsöl bei mittlerer Hitze von allen Seiten knusprig braten. Dazu Salat und Joghurt mit Salz und Kräutern."},
 {id:"b04",N:{kcal:680,p:28,f:39,kh:50,bs:10,gv:130,pm:0,q:"s"},aus:1,src:["familienkost.de: Brokkoli-Auflauf mit Vollkornnudeln","https://www.familienkost.de/rezept_brokkoli_auflauf_mit_vollkornnudeln.html"],n:"Brokkoli-Auflauf mit Vollkornnudeln",t:35,k:"veg",kid:1,i:[[1,"Stk","Brokkoli","g"],[200,"g","Vollkornnudeln","v"],[30,"g","Getrocknete Tomaten","v"],[150,"ml","Sahne","k"],[1,"Stk","Eier","k"],[120,"g","Gouda gerieben","k"]],m:"Brokkoli-Röschen 5 Min. in Salzwasser vorgaren, Nudeln bissfest kochen. Sahne mit Ei, Salz, Muskat und Kräutern verquirlen. Nudeln, Brokkoli und gehackte getrocknete Tomaten in eine Form geben (wer mag: etwas Kochschinken dazu), Sahne drübergießen, Käse drauf. Bei 200 °C ca. 20–25 Min. goldbraun backen."},
 {id:"b05",N:{kcal:580,p:41,f:18,kh:60,bs:6,gv:100,pm:0,q:"s"},aus:1,src:["familienkost.de: Schnelle Hähnchenpfanne mit Senfsauce","https://www.familienkost.de/rezept_schnelle-haehnchenpfanne-senfsauce.html"],n:"Hähnchenpfanne mit Senfsauce & Vollkornreis",t:20,k:"fleisch",kid:1,i:[[400,"g","Hähnchenbrust","f"],[1,"Stk","Paprika","g"],[150,"g","Erbsen","t"],[0.25,"l","Gemüsebrühe","v"],[1,"Becher","Saure Sahne","k"],[1,"Zehen","Knoblauch","g"],[200,"g","Vollkornreis","v"]],m:"Vollkornreis kochen (dauert ca. 25 Min., am besten zuerst aufsetzen). Hähnchen in Stücke und Paprika in Würfel schneiden, in Olivenöl anbraten, Knoblauch kurz mitrösten. Brühe und 2 EL Senf einrühren, Erbsen dazu, 5 Min. köcheln. 4–5 EL saure Sahne unterrühren, mit Salz und Pfeffer abschmecken."},
 {id:"b06",N:{kcal:730,p:38,f:36,kh:60,bs:12,gv:430,pm:0,q:"s"},aus:1,src:["familienkost.de: Pulled Lachs mit Salat","https://www.familienkost.de/rezept_pulled-lachs-salat.html"],n:"Lachs-Salat-Bowl mit Mango & Avocado",t:20,k:"fisch",i:[[400,"g","Lachsfilet","f"],[1,"Stk","Limette","g"],[1,"Kopf","Römersalat","g"],[100,"g","Feldsalat","g"],[250,"g","Kirschtomaten","g"],[1,"Stk","Avocado","g"],[1,"Stk","Mango","g"],[1,"Stk","Gurke","g"],[150,"g","Couscous","v"]],m:"Couscous mit heißer Brühe übergießen und quellen lassen. Lachs mit Limettensaft, Öl, Salz und Pfeffer würzen, von beiden Seiten braten und mit zwei Gabeln zerzupfen. Salat, Tomaten, Gurke, Mango und Avocado schneiden. Dressing aus hellem Balsamico, Olivenöl, süßem Senf und Dill. Alles in Schalen anrichten."},
 {id:"b07",N:{kcal:640,p:30,f:31,kh:57,bs:8,gv:80,pm:0,q:"s"},aus:1,src:["familienkost.de: Nudeln mit Zucchini und Lachs","https://www.familienkost.de/rezept_nudeln_mit_zucchini_und_lachs.html"],n:"Vollkornnudeln mit Zucchini & Lachs",t:15,k:"fisch",kid:1,i:[[250,"g","Vollkornnudeln","v"],[1,"Stk","Zucchini","g"],[1,"Zehen","Knoblauch","g"],[250,"g","Lachsfilet","f"],[200,"ml","Kokosmilch","v"]],m:"Nudeln kochen. Zucchini in Halbmonde schneiden und in Olivenöl anbraten. Lachswürfel und Knoblauch kurz mitbraten, Kokosmilch und 1 TL Brühpulver einrühren, 2–3 Min. köcheln. Mit den Nudeln mischen. Statt Kokosmilch geht auch Sahne oder Milch."},
 {id:"b08",N:{kcal:420,p:16,f:9,kh:61,bs:14,gv:430,pm:0,q:"s"},aus:1,src:["familienkost.de: Couscous-Pfanne mit Kidneybohnen","https://www.familienkost.de/rezept_couscous-kidneybohnen-tomaten.html"],n:"Couscous-Pfanne mit Kidneybohnen & Mais",t:15,k:"veg",kid:1,i:[[100,"g","Couscous","v"],[1,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[150,"g","Kirschtomaten","g"],[1,"Dose","Kidneybohnen","v"],[1,"Dose","Mais","v"],[500,"g","Stückige Tomaten","v"]],m:"Couscous mit 200 ml kochendem Wasser übergießen und quellen lassen. Zwiebel und Ingwer fein würfeln und in Öl glasig dünsten, Knoblauch und Kirschtomaten kurz mitbraten. Abgespülte Bohnen und Mais, Tomaten und 3 TL Brühpulver in 100 ml Wasser dazu, kurz köcheln. Couscous unterrühren."},
 {id:"b09",N:{kcal:700,p:16,f:34,kh:81,bs:14,gv:320,pm:0,q:"s"},cu:"indien",aus:1,src:["familienkost.de: Kichererbsen-Möhren-Curry","https://www.familienkost.de/rezept_kichererbsen-moehren-curry.html"],n:"Kichererbsen-Möhren-Curry mit Reis",t:35,k:"veg",i:[[6,"Stk","Karotten","g"],[1,"Stk","Zwiebel","g"],[1,"Bund","Frühlingszwiebeln","g"],[1,"Dose","Kichererbsen","v"],[0.25,"l","Gemüsebrühe","v"],[1,"Dose","Kokosmilch","v"],[200,"g","Vollkornreis","v"]],m:"Reis kochen. Zwiebel und Karotten würfeln, in etwas Öl andünsten. Mit Brühe und Kokosmilch ablöschen, 1 TL süßen Senf und 1 EL Curry einrühren, 10 Min. köcheln. Abgespülte Kichererbsen dazu, weitere 10 Min. garen. Frühlingszwiebeln unterheben, mit Salz und Pfeffer abschmecken."},
 {id:"b10",N:{kcal:580,p:29,f:22,kh:58,bs:14,gv:320,pm:0,q:"s"},aus:1,src:["familienkost.de: Rote Linsen Bratlinge","https://www.familienkost.de/rezept_rote-linsen-bratlinge.html"],n:"Rote-Linsen-Bratlinge mit Gurken-Joghurt",t:45,k:"veg",i:[[225,"g","Rote Linsen","v"],[0.4,"l","Gemüsebrühe","v"],[1,"Stk","Zwiebel","g"],[1,"Stk","Paprika","g"],[1,"Stk","Karotten","g"],[1,"Bund","Petersilie","g"],[60,"g","Gemahlene Mandeln","v"],[30,"g","Dinkelmehl","v"],[250,"g","Naturjoghurt","k"],[1,"Stk","Gurke","g"]],m:"Linsen in der Brühe 10–12 Min. garen, bis sie die Flüssigkeit aufgenommen haben, gut abtropfen. Zwiebel und Paprika fein würfeln und andünsten, Karotte reiben, Petersilie hacken, Mandeln anrösten. Alles mit Mehl, Paprikapulver, Kurkuma, Salz und Pfeffer vermengen, ca. 15 Bratlinge formen und pro Seite 2–3 Min. braten. Dazu Joghurt mit geriebener Gurke."},
 {id:"b11",N:{kcal:600,p:28,f:30,kh:46,bs:10,gv:280,pm:0,q:"s"},aus:1,src:["familienkost.de: Spinat mit Kartoffeln und Ei","https://www.familienkost.de/rezept_spinat-mit-kartoffeln.html"],n:"Spinat mit Kartoffeln & Spiegelei",t:30,k:"veg",kid:1,i:[[750,"g","Spinat gehackt","t"],[1,"Stk","Zwiebel","g"],[40,"g","Mehl","v"],[100,"ml","Sahne","k"],[600,"g","Kartoffeln (festkochend)","g"],[6,"Stk","Eier","k"]],m:"Kartoffeln schälen und ca. 20 Min. kochen. Zwiebel in Butter andünsten, Mehl einrühren, nach und nach Sahne und 100 ml Wasser dazu. Spinat einrühren und bei mittlerer Hitze ca. 15 Min. köcheln, mit Salz, Pfeffer und Muskat würzen. Spiegeleier braten."},
 {id:"b12",N:{kcal:690,p:26,f:15,kh:107,bs:12,gv:300,pm:0,q:"s"},aus:1,src:["familienkost.de: Kohlrabischnitzel","https://www.familienkost.de/rezept_vegetarisches_kohlrabischnitzel.html"],n:"Kohlrabi-Schnitzel mit Kartoffeln",t:30,k:"veg",kid:1,i:[[3,"Stk","Kohlrabi","g"],[3,"Stk","Eier","k"],[60,"g","Mehl","v"],[180,"g","Semmelbrösel","v"],[750,"g","Kartoffeln (festkochend)","g"]],m:"Kartoffeln kochen. Kohlrabi schälen, in ca. 1 cm dicke Scheiben schneiden und 5 Min. in Salzwasser vorgaren, abtropfen. Scheiben salzen, nacheinander in Mehl, verquirltem Ei und Semmelbröseln wenden und in Öl von beiden Seiten goldbraun braten."},
 {id:"b13",N:{kcal:590,p:21,f:12,kh:96,bs:13,gv:380,pm:0,q:"s"},aus:1,src:["familienkost.de: Kichererbsen-Eintopf mit Gemüse","https://www.familienkost.de/rezept_kichererbsen-eintopf.html"],n:"Kichererbsen-Gemüse-Eintopf",t:45,k:"veg",i:[[1,"Dose","Kichererbsen","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zucchini","g"],[0.5,"l","Gemüsebrühe","v"],[400,"g","Stückige Tomaten","v"],[1,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[1,"Stk","Fladenbrot","b"]],m:"Zwiebel und Knoblauch in Olivenöl andünsten, Karottenwürfel 5 Min. mitbraten, 1 EL Tomatenmark kurz anrösten. Tomaten und Brühe dazu, mit Kreuzkümmel, Koriander, Paprikapulver und einem Lorbeerblatt würzen. Kichererbsen und Zucchini dazu und ca. 25 Min. köcheln. Mit Fladenbrot servieren."},
 {id:"b14",N:{kcal:430,p:17,f:13,kh:55,bs:13,gv:200,pm:0,q:"s"},aus:1,src:["familienkost.de: Blumenkohlsuppe nach Omas Rezept","https://www.familienkost.de/rezept_blumenkohlsuppe.html"],n:"Blumenkohlsuppe mit Vollkornbrot",t:20,k:"veg",kid:1,i:[[1,"Stk","Blumenkohl","g"],[30,"g","Mehl","v"],[200,"ml","Milch","k"],[1,"Stk","Eier","k"],[1,"Laib","Vollkornbrot","b"]],m:"Blumenkohl in Röschen teilen und 10 Min. in Salzwasser kochen, abgießen und das Kochwasser auffangen (auf ca. 600 ml auffüllen). 30 g Butter schmelzen, Mehl einrühren, Kochwasser und Milch dazugeben und 5 Min. köcheln. Vom Herd nehmen, Eigelb und Blumenkohl unterrühren, mit Salz, Pfeffer, Muskat und einer Prise Zucker abschmecken."},
 {id:"c01",N:{kcal:790,p:35,f:29,kh:93,bs:9,gv:390,pm:0,q:"s"},n:"Gemüselasagne",t:60,k:"veg",kid:1,i:[[250,"g","Lasagneplatten","v"],[1,"Stk","Zucchini","g"],[2,"Stk","Karotten","g"],[1,"Stk","Paprika","g"],[500,"g","Passierte Tomaten","v"],[500,"ml","Milch","k"],[40,"g","Mehl","v"],[150,"g","Gouda gerieben","k"],[1,"Stk","Zwiebel","g"]],m:"Zwiebel und fein gewürfeltes Gemüse andünsten, Tomaten dazu, würzen und 10 Min. köcheln. Für die Béchamel 40 g Butter schmelzen, Mehl einrühren, Milch nach und nach dazu, aufkochen, mit Salz und Muskat würzen. Abwechselnd Sauce, Platten, Gemüse und Béchamel schichten, Käse drauf. Bei 180 °C ca. 35 Min. backen."},
 {id:"c02",N:{kcal:880,p:41,f:23,kh:118,bs:14,gv:400,pm:0,q:"s"},n:"Linsen-Lasagne",t:60,k:"veg",i:[[250,"g","Lasagneplatten","v"],[150,"g","Rote Linsen","v"],[800,"g","Stückige Tomaten","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zwiebel","g"],[500,"ml","Milch","k"],[40,"g","Mehl","v"],[1,"Kugeln","Mozzarella","k"]],m:"Zwiebel und Karotten würfeln und andünsten, Linsen, Tomaten und 200 ml Wasser dazu, 15 Min. köcheln, kräftig würzen. Béchamel aus 40 g Butter, Mehl und Milch kochen. Schichten wie bei klassischer Lasagne, Mozzarella obenauf. Bei 180 °C ca. 35 Min. backen."},
 {id:"c03",N:{kcal:690,p:20,f:39,kh:58,bs:8,gv:100,pm:0,q:"s"},n:"Kartoffelgratin mit Salat",t:60,k:"veg",kid:1,i:[[1000,"g","Kartoffeln (festkochend)","g"],[200,"ml","Sahne","k"],[200,"ml","Milch","k"],[100,"g","Gouda gerieben","k"],[1,"Zehen","Knoblauch","g"],[1,"Kopf","Salat","g"]],m:"Ofen auf 180 °C. Form mit Knoblauch ausreiben und fetten. Kartoffeln in dünne Scheiben hobeln und dachziegelartig einschichten. Sahne und Milch mit Salz, Pfeffer und Muskat verrühren, darübergießen, Käse drauf. Ca. 50 Min. backen, bis die Kartoffeln weich sind. Salat dazu."},
 {id:"c04",N:{kcal:610,p:22,f:23,kh:74,bs:10,gv:510,pm:0,q:"s"},n:"Gefüllte Paprika mit Reis & Feta",t:50,k:"veg",i:[[4,"Stk","Paprika","g"],[150,"g","Reis","v"],[200,"g","Feta","k"],[500,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"],[1,"Dose","Mais","v"]],m:"Reis kochen. Paprika-Deckel abschneiden, entkernen. Reis mit Mais, zerbröseltem Feta und etwas Paprikapulver mischen und einfüllen. Tomaten mit gewürfelter Zwiebel und Gewürzen in eine Form geben, Paprika hineinsetzen, Deckel drauf. Bei 200 °C ca. 35 Min. backen."},
 {id:"c05",N:{kcal:620,p:38,f:26,kh:51,bs:10,gv:170,pm:0,q:"s"},n:"Ofen-Hähnchenschenkel mit Kartoffeln & Möhren",t:55,k:"fleisch",kid:1,i:[[3,"Stk","Hähnchenschenkel","f"],[800,"g","Kartoffeln (festkochend)","g"],[4,"Stk","Karotten","g"],[2,"Stk","Zwiebel","g"]],m:"Ofen auf 200 °C. Kartoffeln vierteln, Karotten in dicke Stücke, Zwiebeln in Spalten schneiden, mit Öl, Salz und Rosmarin aufs Blech. Hähnchenschenkel mit Öl, Salz und Paprikapulver einreiben und obenauf legen. Ca. 45 Min. backen, bis die Haut knusprig ist."},
 {id:"c06",N:{kcal:860,p:43,f:45,kh:64,bs:10,gv:140,pm:0,q:"s"},n:"Falscher Hase mit Püree & Möhren",t:60,k:"fleisch",kid:1,i:[[500,"g","Hackfleisch gemischt","f"],[1,"Stk","Eier","k"],[50,"g","Semmelbrösel","v"],[1,"Stk","Zwiebel","g"],[800,"g","Kartoffeln (mehligkochend)","g"],[200,"ml","Milch","k"],[4,"Stk","Karotten","g"]],m:"Hack mit Ei, Semmelbröseln, fein gewürfelter Zwiebel, Senf, Salz und Pfeffer verkneten, zu einem Laib formen und in einer Form bei 180 °C ca. 45 Min. backen. Kartoffeln kochen und mit Milch und Butter stampfen. Karotten in Scheiben in wenig Wasser mit etwas Butter garen."},
 {id:"c07",N:{kcal:800,p:33,f:39,kh:76,bs:10,gv:320,pm:0,q:"s"},n:"Tortellini-Auflauf mit Spinat",t:40,k:"veg",kid:1,i:[[500,"g","Käse-Tortellini","k"],[450,"g","Blattspinat","t"],[500,"g","Passierte Tomaten","v"],[100,"ml","Sahne","k"],[1,"Kugeln","Mozzarella","k"]],m:"Spinat auftauen lassen und gut ausdrücken. Tomaten mit Sahne, Salz, Pfeffer und Oregano verrühren. Ungekochte Tortellini, Spinat und Sauce in einer Form mischen, Mozzarella darauf zupfen. Bei 200 °C ca. 25–30 Min. backen."},
 {id:"c08",N:{kcal:630,p:20,f:15,kh:105,bs:9,gv:330,pm:0,q:"s"},n:"Kürbis-Risotto",t:45,k:"veg",i:[[300,"g","Risottoreis","v"],[1,"Stk","Hokkaido-Kürbis","g"],[1,"l","Gemüsebrühe","v"],[60,"g","Parmesan","k"],[1,"Stk","Zwiebel","g"]],m:"Die Hälfte des Kürbisses fein würfeln, den Rest grob. Zwiebel andünsten, Reis und feine Kürbiswürfel mitrösten. Nach und nach heiße Brühe angießen und rühren, ca. 20 Min. Grobe Kürbiswürfel parallel im Ofen bei 200 °C rösten. Parmesan und Butter unter das Risotto rühren, gerösteten Kürbis obenauf."},
 {id:"c09",N:{kcal:960,p:33,f:72,kh:42,bs:6,gv:230,pm:0,q:"s"},n:"Lauch-Quiche mit Blätterteig",t:50,k:"veg",kid:1,i:[[1,"Pck","Blätterteig","k"],[4,"Stk","Eier","k"],[200,"ml","Sahne","k"],[2,"Stangen","Lauch","g"],[150,"g","Gouda gerieben","k"],[1,"Kopf","Salat","g"]],m:"Ofen auf 200 °C. Form mit Blätterteig auslegen. Lauch in Ringe schneiden und 5 Min. andünsten, auf dem Teig verteilen. Eier mit Sahne, Käse, Salz, Pfeffer und Muskat verquirlen und darübergießen. Ca. 35 Min. backen. Salat dazu."},
 {id:"c10",N:{kcal:600,p:24,f:10,kh:89,bs:25,gv:290,pm:0,q:"s"},n:"Weiße-Bohnen-Eintopf",t:50,k:"veg",i:[[2,"Dose","Weiße Bohnen","v"],[400,"g","Kartoffeln (festkochend)","g"],[2,"Stk","Karotten","g"],[1,"Stangen","Lauch","g"],[1,"l","Gemüsebrühe","v"],[1,"Laib","Vollkornbrot","b"]],m:"Kartoffeln, Karotten und Lauch klein schneiden und in etwas Öl andünsten. Brühe dazu und ca. 20 Min. köcheln. Abgespülte Bohnen dazu, weitere 10 Min. garen, mit Majoran, Salz und Pfeffer abschmecken. Mit Brot servieren."},
 {id:"c11",N:{kcal:430,p:30,f:12,kh:44,bs:7,gv:80,pm:0,q:"s"},n:"Ofenfisch mit Tomaten, Oliven & Kartoffeln",t:45,k:"fisch",i:[[400,"g","Seelachsfilet","t"],[250,"g","Kirschtomaten","g"],[1,"Glas","Oliven","v"],[800,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Zitrone","g"]],m:"Ofen auf 200 °C. Kartoffeln in Spalten mit Öl und Salz 20 Min. vorbacken. Fisch auftauen, trocken tupfen, würzen und mit halbierten Tomaten, Oliven und Zitronenscheiben in eine Form legen, mit Olivenöl beträufeln. Zu den Kartoffeln in den Ofen, weitere 20 Min. backen."},
 {id:"c12",N:{kcal:850,p:42,f:51,kh:53,bs:5,gv:130,pm:0,q:"s"},n:"Käse-Lauch-Suppe mit Hack",t:40,k:"fleisch",i:[[400,"g","Hackfleisch gemischt","f"],[2,"Stangen","Lauch","g"],[200,"g","Schmelzkäse","k"],[1,"l","Gemüsebrühe","v"],[1,"Stk","Baguette","b"]],m:"Hack krümelig anbraten, Lauch in Ringen dazu und 5 Min. mitdünsten. Brühe angießen, 15 Min. köcheln. Schmelzkäse einrühren, bis er geschmolzen ist, mit Pfeffer und Muskat abschmecken. Baguette dazu."},
 {id:"c13",N:{kcal:460,p:16,f:13,kh:67,bs:11,gv:460,pm:0,q:"s"},n:"Ratatouille mit Polenta",t:50,k:"veg",i:[[1,"Stk","Aubergine","g"],[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[400,"g","Stückige Tomaten","v"],[1,"Stk","Zwiebel","g"],[200,"g","Polenta","v"],[40,"g","Parmesan","k"]],m:"Gemüse würfeln. Zwiebel und Aubergine in Olivenöl anbraten, restliches Gemüse dazu, Tomaten und Kräuter der Provence, zugedeckt ca. 30 Min. schmoren. Polenta nach Packung in Brühe kochen, Parmesan und Butter einrühren."},
 {id:"c14",N:{kcal:780,p:33,f:25,kh:102,bs:8,gv:220,pm:0,q:"s"},n:"Selbstgemachte Pizza vom Blech",t:60,k:"veg",kid:1,i:[[400,"g","Mehl","v"],[1,"Pck","Trockenhefe","v"],[250,"g","Passierte Tomaten","v"],[2,"Kugeln","Mozzarella","k"],[1,"Stk","Paprika","g"],[250,"g","Champignons","g"]],m:"Mehl, Hefe, 1 TL Salz, 2 EL Olivenöl und ca. 250 ml lauwarmes Wasser verkneten und 30 Min. gehen lassen. Teig aufs Blech ausrollen, mit gewürzten Tomaten bestreichen, belegen. Bei 230 °C ca. 15 Min. backen. Kinder dürfen selbst belegen."},
 {id:"c15",N:{kcal:800,p:44,f:33,kh:77,bs:7,gv:220,pm:0,q:"s"},cu:"indien",n:"Hähnchen-Curry mit Gemüse & Reis",t:40,k:"fleisch",i:[[400,"g","Hähnchenbrust","f"],[1,"Dose","Kokosmilch","v"],[1,"Stk","Brokkoli","g"],[1,"Stk","Paprika","g"],[250,"g","Reis","v"],[1,"Stk","Zwiebel","g"]],m:"Reis kochen. Hähnchen würfeln und anbraten, rausnehmen. Zwiebel und Paprika andünsten, 1–2 EL Currypulver kurz mitrösten. Kokosmilch und Brokkoli-Röschen dazu, 10 Min. köcheln. Hähnchen zurück, 5 Min. ziehen lassen, mit Salz und etwas Zitrone abschmecken."},
 {id:"c16",N:{kcal:630,p:33,f:10,kh:102,bs:19,gv:580,pm:0,q:"s"},n:"Ofen-Süßkartoffeln mit Kichererbsen & Kräuterquark",t:45,k:"veg",i:[[3,"Stk","Süßkartoffel","g"],[1,"Dose","Kichererbsen","v"],[500,"g","Quark","k"],[1,"Bund","Schnittlauch","g"],[1,"Kopf","Salat","g"]],m:"Ofen auf 200 °C. Süßkartoffeln längs halbieren, mit Öl einpinseln, salzen und mit der Schnittfläche nach unten ca. 35 Min. backen. Abgetropfte Kichererbsen mit Öl, Paprikapulver und Salz nach 15 Min. mit aufs Blech. Quark mit Milch, Schnittlauch, Salz und Pfeffer verrühren."},
 {id:"e01",N:{kcal:740,p:32,f:12,kh:118,bs:13,gv:250,pm:0,q:"s"},cu:"indien",n:"Dal Tadka (Linsen-Dal) mit Basmatireis",t:35,k:"veg",i:[[250,"g","Rote Linsen","v"],[400,"g","Stückige Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[250,"g","Basmatireis","v"],[250,"g","Naturjoghurt","k"]],m:"Reis kochen. Linsen mit 700 ml Wasser und 1 TL Kurkuma ca. 15 Min. weich kochen. Zwiebel, Knoblauch und Ingwer fein hacken und in Öl anbraten, 1 TL Kreuzkümmel, 1 TL Garam Masala und die Tomaten dazu, 5 Min. köcheln, unter die Linsen rühren und salzen. Mit Joghurt servieren. Chili erst am Tisch für die Erwachsenen."},
 {id:"e02",N:{kcal:580,p:22,f:18,kh:80,bs:15,gv:390,pm:0,q:"s"},cu:"indien",n:"Chana Masala (Kichererbsen-Curry) mit Naan",t:35,k:"veg",i:[[2,"Dose","Kichererbsen","v"],[400,"g","Stückige Tomaten","v"],[2,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[100,"g","Babyspinat","g"],[3,"Stk","Naan-Brot","b"]],m:"Zwiebeln fein würfeln und in Öl goldbraun braten, Knoblauch und Ingwer dazu. 2 TL Garam Masala, 1 TL Kreuzkümmel, ½ TL Kurkuma kurz mitrösten. Tomaten und abgespülte Kichererbsen dazu, 15 Min. köcheln. Spinat unterheben, salzen, mit etwas Zitrone abschmecken. Naan im Ofen aufbacken."},
 {id:"e03",N:{kcal:750,p:46,f:27,kh:77,bs:4,gv:170,pm:0,q:"s"},cu:"indien",n:"Butter Chicken (mild) mit Reis",t:40,k:"fleisch",kid:1,i:[[450,"g","Hähnchenbrust","f"],[150,"g","Naturjoghurt","k"],[400,"g","Passierte Tomaten","v"],[150,"ml","Sahne","k"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[250,"g","Basmatireis","v"]],m:"Hähnchen würfeln und mit Joghurt, 1 TL Garam Masala, Paprikapulver und Salz 10 Min. marinieren. Reis kochen. Hähnchen in Butter anbraten, rausnehmen. Zwiebel, Knoblauch und Ingwer andünsten, 1 TL Garam Masala mitrösten, Tomaten dazu, 10 Min. köcheln. Sahne und Hähnchen dazu, 5 Min. ziehen lassen."},
 {id:"e04",N:{kcal:900,p:36,f:50,kh:74,bs:5,gv:180,pm:0,q:"s"},cu:"indien",n:"Palak Paneer (Spinat mit Käse) & Reis",t:40,k:"veg",i:[[400,"g","Paneer (oder Halloumi)","k"],[450,"g","Blattspinat","t"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[100,"ml","Sahne","k"],[250,"g","Basmatireis","v"]],m:"Reis kochen. Paneer würfeln und in Öl rundum goldbraun braten, rausnehmen. Zwiebel, Knoblauch und Ingwer andünsten, 1 TL Garam Masala und ½ TL Kreuzkümmel mitrösten. Spinat dazu, erhitzen und grob pürieren. Sahne einrühren, salzen, Paneer unterheben."},
 {id:"e05",N:{kcal:540,p:17,f:14,kh:81,bs:12,gv:370,pm:0,q:"s"},cu:"indien",n:"Aloo Gobi (Kartoffel-Blumenkohl-Curry)",t:40,k:"veg",kid:1,i:[[500,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Blumenkohl","g"],[1,"Stk","Zwiebel","g"],[400,"g","Stückige Tomaten","v"],[2,"Zehen","Knoblauch","g"],[3,"Stk","Naan-Brot","b"]],m:"Kartoffeln würfeln, Blumenkohl in Röschen teilen. Zwiebel und Knoblauch in Öl andünsten, 1 TL Kurkuma, 1 TL Kreuzkümmel und 1 TL Garam Masala kurz mitrösten. Kartoffeln und Blumenkohl dazu, gut wenden, Tomaten und 150 ml Wasser dazu, zugedeckt ca. 20 Min. garen. Mit Naan."},
 {id:"e06",N:{kcal:670,p:19,f:18,kh:102,bs:9,gv:240,pm:0,q:"s"},cu:"indien",n:"Gemüse-Biryani mit Cashews",t:55,k:"veg",i:[[300,"g","Basmatireis","v"],[2,"Stk","Karotten","g"],[200,"g","Erbsen","t"],[1,"Stk","Paprika","g"],[2,"Stk","Zwiebel","g"],[250,"g","Naturjoghurt","k"],[50,"g","Cashewkerne","v"]],m:"Reis waschen und 10 Min. einweichen. Eine Zwiebel in Ringen knusprig braten und beiseitestellen. Zweite Zwiebel würfeln, mit Karotten und Paprika anbraten, 2 TL Garam Masala und ½ TL Kurkuma dazu. Reis, Erbsen und 550 ml Wasser dazu, salzen, zugedeckt bei kleiner Hitze 15 Min. garen, 10 Min. ruhen lassen. Mit Röstzwiebeln, gerösteten Cashews und Joghurt."},
 {id:"e07",N:{kcal:680,p:15,f:32,kh:80,bs:8,gv:270,pm:0,q:"s"},cu:"asia",n:"Thai-Gemüsecurry mit Kokosmilch",t:30,k:"veg",i:[[1,"Glas","Rote Currypaste","v"],[1,"Dose","Kokosmilch","v"],[1,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[1,"Stk","Brokkoli","g"],[250,"g","Jasminreis","v"],[1,"Stk","Limette","g"]],m:"Reis kochen. 1–2 EL Currypaste in etwas Öl anrösten (für Kinder wenig nehmen), Kokosmilch dazu. Gemüse in Stücken dazu und 8–10 Min. köcheln, bis es bissfest ist. Mit Sojasauce, etwas Zucker und Limettensaft abschmecken."},
 {id:"e08",N:{kcal:580,p:43,f:10,kh:77,bs:5,gv:130,pm:0,q:"s"},cu:"asia",n:"Teriyaki-Hähnchen mit Reis & Brokkoli",t:30,k:"fleisch",kid:1,i:[[400,"g","Hähnchenbrust","f"],[1,"Flasche","Teriyakisauce","v"],[250,"g","Jasminreis","v"],[1,"Stk","Brokkoli","g"]],m:"Reis kochen, Brokkoli-Röschen die letzten 5 Min. über dem Reis dämpfen oder kurz kochen. Hähnchen in Streifen schneiden und scharf anbraten. 5–6 EL Teriyakisauce dazu und kurz einköcheln lassen, bis alles glänzt. Mit Sesam bestreuen."},
 {id:"e09",N:{kcal:490,p:19,f:14,kh:66,bs:8,gv:270,pm:0,q:"s"},cu:"asia",n:"Yaki Udon mit Gemüse & Ei",t:20,k:"veg",kid:1,i:[[600,"g","Udon-Nudeln (vorgegart)","k"],[2,"Stk","Pak Choi","g"],[2,"Stk","Karotten","g"],[200,"g","Champignons","g"],[1,"Bund","Frühlingszwiebeln","g"],[3,"Stk","Eier","k"]],m:"Gemüse in Streifen schneiden und im Wok oder in einer großen Pfanne scharf anbraten. Udon-Nudeln dazu und lockern. Eier an den Rand schlagen, verrühren, alles mischen. Mit 3 EL Sojasauce, 1 EL Honig und etwas Sesamöl würzen."},
 {id:"e10",N:{kcal:560,p:20,f:21,kh:71,bs:7,gv:290,pm:0,q:"s"},cu:"asia",n:"Sommerrollen mit Erdnussdip",t:40,k:"veg",kid:1,i:[[1,"Pck","Reispapier","v"],[100,"g","Reisnudeln","v"],[1,"Stk","Gurke","g"],[2,"Stk","Karotten","g"],[1,"Kopf","Salat","g"],[200,"g","Tofu","k"],[1,"Glas","Erdnussmus","v"],[1,"Stk","Limette","g"]],m:"Reisnudeln einweichen. Gemüse in feine Streifen, Tofu in Stifte schneiden und kurz anbraten. Reispapier einzeln kurz in warmes Wasser tauchen, belegen und aufrollen. Für den Dip 3 EL Erdnussmus mit Sojasauce, Limettensaft, etwas Honig und warmem Wasser glatt rühren. Rollen am Tisch selber machen macht Kindern Spaß."},
 {id:"e11",N:{kcal:520,p:18,f:14,kh:78,bs:6,gv:290,pm:0,q:"s"},cu:"asia",n:"Bibimbap-Bowl mit Spiegelei",t:35,k:"veg",i:[[250,"g","Sushireis","v"],[3,"Stk","Eier","k"],[100,"g","Babyspinat","g"],[2,"Stk","Karotten","g"],[200,"g","Champignons","g"],[1,"Stk","Gurke","g"],[1,"Tube","Gochujang (koreanische Chilipaste)","v"]],m:"Reis kochen. Karotten und Gurke in Streifen schneiden, Pilze in Scheiben braten, Spinat kurz zusammenfallen lassen, alles leicht mit Sojasauce und Sesamöl würzen. Spiegeleier braten. Reis in Schalen, Gemüse darauf verteilen, Ei obenauf. Gochujang nur für die Erwachsenen."},
 {id:"e12",N:{kcal:620,p:33,f:21,kh:76,bs:5,gv:120,pm:0,q:"s"},cu:"asia",n:"Pad Thai mit Garnelen",t:30,k:"fisch",i:[[250,"g","Reisnudeln","v"],[250,"g","Garnelen","t"],[2,"Stk","Eier","k"],[200,"g","Mungbohnensprossen","g"],[1,"Bund","Frühlingszwiebeln","g"],[50,"g","Erdnüsse (geröstet)","v"],[1,"Stk","Limette","g"]],m:"Reisnudeln nach Packung einweichen. Sauce aus 3 EL Sojasauce, 2 EL Zucker, Limettensaft und etwas Tomatenketchup verrühren. Garnelen im Wok anbraten, zur Seite schieben, Eier darin stocken lassen. Nudeln und Sauce dazu, kräftig durchschwenken. Sprossen und Frühlingszwiebeln unterheben, mit gehackten Erdnüssen bestreuen."},
 {id:"e13",N:{kcal:710,p:20,f:18,kh:119,bs:6,gv:230,pm:0,q:"s"},cu:"asia",n:"Gemüse-Gyoza mit Reis & Gurkensalat",t:20,k:"veg",kid:1,i:[[500,"g","Gyoza mit Gemüsefüllung","t"],[250,"g","Jasminreis","v"],[1,"Stk","Gurke","g"],[2,"Stk","Pak Choi","g"]],m:"Reis kochen. Gyoza nach Packung in der Pfanne anbraten, mit etwas Wasser ablöschen und zugedeckt garen, bis das Wasser verdampft ist. Pak Choi halbieren und kurz mitbraten. Gurke hobeln und mit Reisessig, etwas Zucker und Salz anmachen. Sojasauce zum Dippen."},
 {id:"k01",N:{kcal:470,p:11,f:31,kh:39,bs:16,gv:390,pm:0,q:"b"},foto:1,aus:1,n:"Wraps mit Avocado & Roter Bete",t:15,k:"veg",i:[[4,"Stk","Vollkorn-Tortillas","b"],[2,"Stk","Avocados (reif)","g"],[1,"Stk","Zitrone","g"],[1,"Zehen","Knoblauch","g"],[75,"g","Feldsalat","g"],[1,"Stk","Salatgurke","g"],[1,"Pck","Rote Bete (gegart, vakuumverpackt)","g"],[75,"g","Gouda am Stück","k"],[1,"Beet","Kresse","g"]],m:"Avocados mit Zitronensaft und Knoblauch zu einer Creme zerdrücken. Feldsalat waschen, Gurke und Rote Bete klein würfeln, Gouda reiben. Tortillas kurz in der Pfanne erwärmen, mit Avocadocreme bestreichen, belegen, aufrollen und sofort essen."},
 {id:"k02",N:{kcal:465,p:40,f:27,kh:12,bs:5,gv:250,pm:0,q:"b"},foto:1,aus:1,cu:"asia",n:"Hähnchen-Saté mit Thai-Gurkensalat & Erdnusssauce",t:20,k:"fleisch",i:[[400,"g","Hähnchenbrustfilet","f"],[1,"Stk","Salatgurke (groß)","g"],[1,"Bund","Frühlingszwiebeln","g"],[1,"Bund","Koriander","g"],[1,"Stk","Rote Chilischote","g"],[1,"Stk","Limette","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[1,"Stk","Zwiebel","g"],[30,"g","Erdnusskerne (ungesalzen)","v"],[1,"Glas","Erdnussmus","v"],[1,"Flasche","Fischsauce","v"],[1,"Flasche","Sesamöl","v"],[200,"g","Reisnudeln (optional)","v"],[1,"Pck","Holzspieße","x"]],m:"Gurke in Streifen hobeln, mit Frühlingszwiebeln, Koriander und einem Dressing aus Limettensaft, Fischsauce, Zucker und Chili mischen. Erdnusssauce aus Knoblauch, Ingwer, Zwiebel, Sesamöl und Erdnussmus kochen. Hähnchen in Streifen auf Spieße fädeln, 3–5 Min. scharf anbraten, mit Sauce, Salat und gerösteten Erdnüssen servieren."},
 {id:"k03",N:{kcal:425,p:29,f:18,kh:33,bs:22,gv:530,pm:0,q:"b"},foto:1,aus:1,n:"Buntes Ofengemüse mit Limetten-Dill-Quark",t:35,k:"veg",i:[[600,"g","Rosenkohl","g"],[3,"Stk","Pastinaken","g"],[3,"Stk","Petersilienwurzeln","g"],[3,"Stk","Möhren (lila oder orange)","g"],[1,"Bund","Dill","g"],[1,"Stk","Limette (Bio)","g"],[400,"g","Quark (20 % Fett)","k"]],m:"Ofen auf 200 °C. Rosenkohl halbieren, Wurzelgemüse vierteln, mit Öl, Salz, Pfeffer und Räucherpaprika mischen und 15–20 Min. backen. Quark mit gehacktem Dill und Limettensaft verrühren, abschmecken. Gemüse mit Quark und Limettenspalten servieren."},
 {id:"k04",N:{kcal:335,p:17,f:13,kh:29,bs:10,gv:320,pm:0,q:"b"},foto:1,aus:1,n:"Linsen-Mangold-Suppe mit Joghurt",t:35,k:"veg",i:[[2,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[600,"g","Mangold (oder Blattspinat)","g"],[1,"Stk","Zitrone (Bio)","g"],[1,"Bund","Koriander","g"],[150,"g","Grüne Linsen","v"],[150,"g","Naturjoghurt (3,8 %)","k"]],m:"Zwiebel, Knoblauch und zerstoßene Korianderkörner in Öl 5 Min. anbraten. Mangold und Zitronenschale 3–4 Min. mitbraten. Brühe, Wasser und Linsen dazu, zugedeckt 20 Min. köcheln, abschmecken. Mit Zitronensaft, Joghurt und Koriander servieren."},
 {id:"k05",N:{kcal:685,p:32,f:43,kh:41,bs:11,gv:270,pm:0,q:"b"},foto:1,aus:1,n:"Grüner Spargel mit Tofu, Graupenrisotto & Pesto",t:45,k:"veg",i:[[750,"g","Grüner Spargel","g"],[300,"g","Tofu mit Kräutern","k"],[120,"g","Gerstengraupen (oder Risottoreis)","v"],[0.4,"l","Gemüsebrühe","v"],[1,"Bund","Bärlauch (oder Schnittlauch / fertiges grünes Pesto)","g"],[75,"g","Walnusskerne","v"],[1,"Pck","Hefeflocken","v"],[1,"Stk","Zitrone (Bio)","g"],[2,"Stk","Schalotten","g"],[2,"Zehen","Knoblauch","g"],[50,"g","Parmesan am Stück","k"]],m:"Ofen auf 180 °C. Pesto aus Bärlauch, Walnüssen, Hefeflocken, Zitronensaft und Öl pürieren. Spargel und Tofuwürfel mit Öl, Salz, Pfeffer 15 Min. im Ofen garen. Schalotte und Knoblauch andünsten, Graupen und Brühe dazu, 20 Min. köcheln, Parmesan unterziehen. Mit Spargel, Tofu, Pesto und Zitronenschale anrichten."},
 {id:"k06",N:{kcal:500,p:52,f:22,kh:24,bs:9,gv:300,pm:0,q:"b"},foto:1,aus:1,cu:"asia",n:"Grüne Power-Pfanne mit Hähnchen",t:15,k:"fleisch",kid:1,i:[[450,"g","Hähnchenbrustfilet","f"],[450,"g","Brokkoli (TK)","t"],[300,"g","Grüne Bohnen (TK)","t"],[1,"Bund","Frühlingszwiebeln","g"],[30,"g","Cashewkerne","v"],[1,"Flasche","Sesamöl","v"],[250,"g","Reis (optional)","v"]],m:"Brokkoli und Bohnen antauen lassen. Hähnchen in Streifen im Wok in Sesamöl rundum anbraten. Brokkoli 3 Min. mitdünsten, dann Bohnen, Frühlingszwiebeln und Cashews dazu. Mit Sojasauce, Pfeffer und Kurkuma würzen und sofort servieren."},
 {id:"k07",N:{kcal:550,p:16,f:27,kh:55,bs:14,gv:180,pm:0,q:"s"},web:1,aus:1,src:["einfachkochen.de: Rote-Bete-Carpaccio","https://www.einfachkochen.de/rezepte/rote-bete-carpaccio-einfach-lecker"],n:"Rote-Bete-Carpaccio mit Walnüssen & Ziegenkäse",t:20,k:"veg",i:[[3,"Stk","Rote Bete (klein, roh)","g"],[75,"g","Rucola","g"],[1,"Bund","Petersilie","g"],[60,"g","Walnusskerne","v"],[75,"g","Ziegenfrischkäse (oder Feta)","k"],[1,"Stk","Zitrone","g"],[1,"Laib","Vollkornbrot","b"]],m:"Rote Bete schälen und hauchdünn hobeln. Walnüsse rösten und hacken. Dressing aus Öl, Zitronensaft, Honig, Senf, hellem Balsamico, Salz und Pfeffer rühren. Bete fächerförmig anrichten, mit Petersilie, Rucola, Dressing, Käse und Walnüssen belegen. Mit Vollkornbrot servieren."},
 {id:"k08",N:{kcal:850,p:48,f:58,kh:35,bs:1,gv:0,pm:0,q:"s"},web:1,kid:1,src:["Instagram @meraschkoch: Reis-Papier-Börek","https://www.instagram.com/reel/DaGJ2zdN37m/"],n:"Reispapier-Börek mit Hackfleisch & Käse",t:40,k:"fleisch",i:[[450,"g","Hackfleisch gemischt","f"],[150,"g","Gouda gerieben","k"],[2,"Stk","Eier","k"],[100,"ml","Milch","k"],[1,"Pck","Reispapier","v"],[2,"Zehen","Knoblauch","g"],[1,"Pck","Schwarzer Sesam","v"]],m:"Hack mit Salz, Pfeffer und Knoblauch krümelig durchbraten, abkühlen lassen und mit Käse mischen. Eier mit Milch verquirlen. Je 2 Reispapierblätter darin einweichen, Füllung daraufgeben, fest aufrollen, zur Schnecke drehen und in eine Form legen. Mit Sesam bestreuen und bei 200 °C knusprig backen."},
 {id:"k09",N:{kcal:470,p:17,f:22,kh:48,bs:11,gv:280,pm:1,q:"s"},foto:1,kid:1,n:"Bohneneintopf mit Wurst",t:40,k:"fleisch",i:[[500,"g","Grüne Bohnen","g"],[600,"g","Kartoffeln (festkochend)","g"],[250,"g","Möhren","g"],[1,"Stk","Zwiebel","g"],[150,"g","Wurst (z. B. Mettwurst oder Fleischwurst)","f"],[1,"l","Fleischbrühe","v"]],m:"Wurst und Zwiebel fein würfeln und in Öl anbraten. Kartoffeln und Möhren schälen, würfeln und kurz mitbraten. Mit Brühe ablöschen, 10 Min. kochen, Bohnen dazu und weitere 15 Min. garen. Mit Pfeffer und Bohnenkraut abschmecken."},
 {id:"k10",N:{kcal:515,p:31,f:22,kh:44,bs:20,gv:420,pm:0,q:"b"},foto:1,gf:1,n:"Würziger Bohnenauflauf",t:30,k:"veg",i:[[1,"Stk","Zwiebel","g"],[1,"Stk","Grüne Peperoni","g"],[2,"Dose","Schwarze Bohnen","v"],[1,"Dose","Kidneybohnen","v"],[400,"g","Stückige Tomaten","v"],[2,"Kugeln","Mozzarella","k"],[1,"Bund","Koriander","g"]],m:"Zwiebel und Peperoni andünsten, mit abgespülten Bohnen und Tomaten in eine Auflaufform geben und würzen. Mozzarella darauf verteilen und bei 200 °C ca. 20 Min. überbacken, mit Koriander bestreuen."},
 {id:"k11",N:{kcal:470,p:36,f:27,kh:20,bs:5,gv:300,pm:0,q:"b"},foto:1,gf:1,ai:1,kid:1,n:"Zanderfilet mit Kohlrabipommes",t:45,k:"fisch",i:[[3,"Stk","Kohlrabi","g"],[480,"g","Zanderfilet (mit Haut)","f"],[1,"Bund","Petersilie","g"],[1,"Stk","Zitrone (Bio)","g"],[1,"Glas","Mandelmus (hell)","v"],[3,"Zweige","Thymian","g"]],m:"Kohlrabi in Pommes-Streifen schneiden, mit Kokosöl, Gewürzen und Stärke mischen und bei 200 °C Umluft ca. 25 Min. backen. Zander auf der Hautseite in Olivenöl, Butter und Thymian knusprig braten. Dazu ein Dip aus Mandelmus, Öl, Senf und Zitrone."},
 {id:"k12",N:{kcal:350,p:1,f:37,kh:2,bs:0,gv:0,pm:0,q:"b"},side:1,web:1,gf:1,src:["Emmi kocht einfach: Aioli ohne Ei","https://emmikochteinfach.de/aioli-ohne-ei-rezept/"],n:"Aioli ohne Ei (Dip)",t:5,k:"veg",i:[[60,"ml","Milch","k"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Zitrone","g"]],m:"Knoblauch, Öl und Milch in ein hohes Gefäß geben und mit dem Pürierstab ohne Bewegen mixen, bis es cremig wird. Mit Salz und Zitronensaft abschmecken – passt zu Ofengemüse, Kartoffeln, Pommes und Gegrilltem."},
 {id:"k13",N:{kcal:910,p:29,f:55,kh:67,bs:8,gv:200,pm:0,q:"s"},foto:1,kid:1,n:"Schnelle Gemüselasagne",t:45,k:"veg",i:[[2,"Pck","Buttergemüse (TK)","t"],[200,"ml","Sahne","k"],[250,"ml","Milch","k"],[100,"g","Kräuter-Schmelzkäse","k"],[200,"g","Lasagneplatten","v"],[100,"g","Gouda gerieben","k"]],m:"TK-Buttergemüse im großen Topf garen, dann Sahne, Milch und Kräuter-Schmelzkäse einrühren und kurz köcheln. Mit Saucenbinder leicht andicken, mit Salz, Pfeffer und Brühe abschmecken. Sauce und Lasagneplatten abwechselnd in eine Auflaufform schichten, mit Käse bestreuen und bei 180 °C ca. 30 Min. backen."},
 {id:"k14",N:{kcal:560,p:23,f:29,kh:47,bs:11,gv:290,pm:0,q:"s"},foto:1,n:"Bulgur-Gemüse-Feta-Auflauf",t:60,k:"veg",i:[[150,"g","Bulgur","v"],[0.3,"l","Gemüsebrühe","v"],[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[1,"Stk","Aubergine","g"],[200,"g","Feta","k"],[30,"g","Pinienkerne","v"],[1,"Bund","Minze","g"]],m:"Bulgur mit heißer, gewürzter Gemüsebrühe (Kurkuma, Curry, Schwarzkümmel, Koriander, etwas Harissa) 30 Min. quellen lassen. Gemüse würfeln, in Olivenöl anbraten und unter den Bulgur mischen. Feta würfeln, mit Minze und gerösteten Pinienkernen mischen. Die Hälfte Bulgur in eine geölte Form, Feta darauf, Rest Bulgur darüber und zugedeckt bei 190 °C ca. 30 Min. backen."},
 {id:"k15",N:{kcal:990,p:39,f:55,kh:82,bs:10,gv:270,pm:1,q:"s"},foto:1,kid:1,n:"Kürbisquiche mit Speck",t:90,k:"fleisch",i:[[250,"g","Mehl","v"],[3,"Stk","Eier","k"],[600,"g","Hokkaido-Kürbis","g"],[125,"g","Speckwürfel","f"],[2,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[0.2,"l","Gemüsebrühe","v"],[150,"g","Crème fraîche","k"],[100,"g","Gouda gerieben","k"],[30,"g","Kürbiskerne","v"]],m:"Aus Mehl, Butter, 1 Ei und Salz einen Mürbeteig kneten und 30 Min. kühlen. Kürbis, Speck und Zwiebeln würfeln und andünsten, Knoblauch dazu, würzen, mit Brühe ablöschen, 20 Min. garen und pürieren. Teig in eine gefettete Form legen, Kürbispüree mit 2 Eiern, Crème fraîche und Käse verrühren, einfüllen und bei 200 °C ca. 45 Min. backen."},
 {id:"k16",N:{kcal:1230,p:46,f:56,kh:130,bs:7,gv:100,pm:0,q:"s"},foto:1,kid:1,n:"Kässpätzle mit Röstzwiebeln",t:40,k:"veg",i:[[750,"g","Frische Spätzle","k"],[3,"Stk","Zwiebel","g"],[200,"ml","Sahne","k"],[150,"ml","Milch","k"],[200,"g","Emmentaler gerieben","k"]],m:"Zwei Zwiebeln in Butterschmalz dunkel rösten, die dritte in Streifen glasig dünsten und mit Milch und Sahne ablöschen. Spätzle darin rühren, bis die Flüssigkeit aufgesogen ist, die Hälfte des Käses unterheben. Röstzwiebeln und restlichen Käse darauf und bei 200 °C ca. 20 Min. überbacken."},
 {id:"k17",N:{kcal:650,p:35,f:24,kh:70,bs:9,gv:230,pm:1,q:"s"},foto:1,kid:1,n:"Krautfleckerl mit Schinken",t:40,k:"fleisch",i:[[500,"g","Weißkohl","g"],[2,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[250,"g","Bandnudeln","v"],[150,"g","Kochschinken","k"],[100,"g","Bergkäse gerieben","k"],[20,"g","Kürbiskerne","v"]],m:"Zwiebeln und Knoblauch in einer ofenfesten Pfanne andünsten, mit Paprika, Majoran und braunem Zucker kurz anbraten und mit Brühe aufgießen. Kohlstreifen darin 10–15 Min. schmoren. Nudeln und angebratenen Schinken untermischen, mit Bergkäse bestreuen und bei 200 °C ca. 10 Min. überbacken."},
 {id:"k18",N:{kcal:690,p:31,f:36,kh:52,bs:16,gv:320,pm:0,q:"s"},foto:1,kid:1,n:"Mamas Wirsingtopf mit Kartoffeln",t:40,k:"veg",i:[[250,"g","Veggie-Hack (Erbsenprotein)","k"],[1,"Kopf","Wirsing (klein)","g"],[800,"g","Kartoffeln (festkochend)","g"],[200,"g","Crème fraîche","k"]],m:"Veggie-Hack in einem großen Topf scharf anbraten und mit Brühe ablöschen. Wirsing in Streifen dazugeben und einkochen, bis er weich ist. Crème fraîche einrühren und mit Salz, Pfeffer und Maggi abschmecken. Mit Salzkartoffeln im tiefen Teller servieren."},
 {id:"k19",N:{kcal:870,p:31,f:38,kh:96,bs:9,gv:180,pm:0,q:"s"},foto:1,kid:1,n:"Gnocchi-Spinat-Auflauf",t:35,k:"veg",i:[[800,"g","Gnocchi","k"],[450,"g","Blattspinat","t"],[1,"Stk","Zwiebel","g"],[200,"g","Frischkäse","k"],[150,"g","Emmentaler gerieben","k"]],m:"Gnocchi in Salzwasser garen, bis sie oben schwimmen. Zwiebel andünsten, Spinat dazugeben, würzen, mit Brühe ablöschen und Frischkäse darin auflösen. Gnocchi untermischen, mit Käse bestreuen und bei 180 °C backen, bis der Käse braun ist."},
 {id:"k20",N:{kcal:780,p:20,f:32,kh:99,bs:9,gv:200,pm:0,q:"s"},foto:1,kid:1,n:"Gnocchi mit grünem Spargel",t:25,k:"veg",i:[[800,"g","Gnocchi","k"],[500,"g","Grüner Spargel","g"],[1,"Stk","Zwiebel","g"],[1,"Zehen","Knoblauch","g"],[150,"ml","Sahne","k"],[30,"g","Pinienkerne","v"],[30,"g","Parmesan","k"],[1,"Stk","Zitrone","g"]],m:"Zwiebel andünsten, Spargelstücke 5 Min. mitbraten, Knoblauch dazu. Mit Sahne und Brühe ablöschen, 5 Min. einköcheln und mit Salz, Pfeffer, Muskat und Zitronensaft abschmecken. Über die angebratenen Gnocchi geben, mit gerösteten Pinienkernen und Parmesan servieren."},
 {id:"k21",N:{kcal:840,p:44,f:57,kh:37,bs:3,gv:120,pm:1,q:"s"},foto:1,kid:1,n:"Zucchinistrudel mit Schinken",t:70,k:"fleisch",i:[[1,"Stk","Zucchini","g"],[1,"Stk","Zwiebel","g"],[200,"g","Kochschinken","k"],[200,"g","Gouda gerieben","k"],[1,"Pck","Blätterteig","k"],[3,"Stk","Eier","k"]],m:"Zwiebel und gewürfelte Zucchini in Öl dünsten, Schinkenwürfel zugeben und gut durchbraten. Abgekühlt mit 2 Eiern und der Hälfte des Käses mischen, auf den ausgerollten, mit Käse bestreuten Blätterteig geben und einrollen. Mit Ei bestreichen und ca. 35 Min. bei 180 °C backen."},
 {id:"k22",N:{kcal:600,p:33,f:39,kh:22,bs:12,gv:410,pm:1,q:"s"},foto:1,kid:1,n:"Blumenkohl-Brokkoli-Auflauf mit Schinken",t:45,k:"fleisch",i:[[1,"Stk","Blumenkohl","g"],[1,"Stk","Brokkoli","g"],[3,"Stk","Karotten","g"],[200,"g","Kochschinken","k"],[200,"ml","Sahne","k"],[100,"g","Gouda gerieben","k"],[20,"g","Mehl","v"]],m:"Blumenkohl, Brokkoli und Möhren in Salzwasser garen. Aus Butter, Mehl, Sahne und etwas Gemüsewasser eine Käsesauce rühren. Gemüse und Schinkenwürfel in eine Form geben, Sauce darübergießen, mit Käse bestreuen und ca. 20 Min. bei 180 °C überbacken."},
 {id:"k23",N:{kcal:580,p:27,f:25,kh:58,bs:11,gv:230,pm:0,q:"s"},foto:1,kid:1,n:"Zucchinipuffer mit Kräuterjoghurt",t:35,k:"veg",i:[[2,"Stk","Zucchini","g"],[2,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[2,"Stk","Eier","k"],[200,"g","Haferflocken","v"],[70,"g","Gouda gerieben","k"],[30,"g","Semmelbrösel","v"],[1,"Bund","Basilikum","g"],[1,"Bund","Schnittlauch","g"],[150,"g","Naturjoghurt","k"],[1,"Stk","Zitrone","g"]],m:"Geraspelte Zucchini mit Zwiebeln, Knoblauch, Haferflocken, Käse, Basilikum und Gewürzen mischen, Eier unterrühren (bei zu flüssiger Masse Semmelbrösel zugeben). Als kleine Häufchen flach gebraten, bis sie goldbraun sind. Dazu Joghurt mit Zitronensaft und Schnittlauch."},
 {id:"k24",N:{kcal:440,p:19,f:18,kh:50,bs:8,gv:30,pm:0,q:"s"},foto:1,kid:1,n:"Getreidekücherl (Grünkernküchle)",t:55,k:"veg",i:[[200,"g","Grünkernschrot","v"],[1,"Stk","Zwiebel","g"],[2,"Stk","Eier","k"],[30,"g","Haferflocken","v"],[50,"g","Gouda gerieben","k"],[1,"Zehen","Knoblauch","g"]],m:"Zwiebel andünsten, Getreideschrot zugeben und mit Brühe aufkochen, dann ca. 30 Min. quellen lassen. Eier, Haferflocken, Käse, Knoblauch und Senf untermischen, kräftig abschmecken, zu kleinen Küchle formen und von beiden Seiten ca. 5 Min. in heißem Fett braten."},
 {id:"k25",N:{kcal:630,p:28,f:30,kh:59,bs:3,gv:0,pm:0,q:"s"},foto:1,kid:1,n:"Hirse-Käse-Bratlinge",t:35,k:"veg",i:[[150,"g","Hirse","v"],[100,"g","Semmelbrösel","v"],[1,"Stk","Eier","k"],[200,"g","Gouda gerieben","k"]],m:"Hirse in Wasser oder Brühe kochen und abkühlen lassen. Semmelbrösel, Ei, Käse und Salz untermischen, Bratlinge formen und in heißem Öl von beiden Seiten knusprig braun braten."},
 {id:"k26",N:{kcal:460,p:12,f:32,kh:28,bs:12,gv:350,pm:0,q:"s"},foto:1,cu:"indien",n:"Auberginen-Kichererbsen-Curry",t:30,k:"veg",i:[[2,"Stk","Aubergine","g"],[1,"Dose","Kichererbsen","v"],[2,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[2,"Stk","Rote Chilischote","g"],[1,"Dose","Kokosmilch","v"],[1,"Bund","Petersilie","g"]],m:"Zwiebeln und Knoblauch andünsten, mit Currypulver und Chili anrösten und mit Brühe und Kokosmilch ablöschen. Auberginenwürfel ca. 10 Min. mitköcheln, Kichererbsen darin heiß werden lassen, mit Salz abschmecken und Petersilie untermischen."},
 {id:"s01",N:{kcal:930,p:33,f:32,kh:120,bs:14,gv:300,pm:0,q:"s"},ai:1,cu:"indien",kid:1,n:"Rote-Linsen-Dal mit Spinat & Basmatireis",t:30,k:"veg",i:[[250,"g","Rote Linsen","v"],[250,"g","Basmatireis","v"],[1,"Dose","Kokosmilch","v"],[400,"g","Passierte Tomaten","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[150,"g","Babyspinat","g"],[1,"Stk","Zitrone","g"]],m:"Zwiebel, Knoblauch und Ingwer in Öl andünsten, Gewürze kurz mitrösten. Linsen, Tomaten, Kokosmilch und Wasser dazu, 15 Min. köcheln. Spinat unterheben, mit Zitrone abschmecken, mit Reis servieren."},
 {id:"s02",N:{kcal:770,p:21,f:34,kh:91,bs:15,gv:350,pm:0,q:"s"},ai:1,cu:"indien",kid:1,n:"Paprika-Brokkoli-Curry mit Kichererbsen & Vollkornreis",t:35,k:"veg",i:[[250,"g","Vollkornreis","v"],[1,"Stk","Brokkoli","g"],[2,"Stk","Paprika","g"],[1,"Dose","Kichererbsen","v"],[1,"Dose","Kokosmilch","v"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Ingwer (klein)","g"],[1,"Stk","Limette","g"]],m:"Vollkornreis kochen. Zwiebel, Knoblauch, Ingwer und Gewürze anschwitzen, Paprika und Brokkoli kurz mitbraten. Kichererbsen und Kokosmilch dazu, 10 Min. köcheln, mit Limette abschmecken."},
 {id:"s03",N:{kcal:690,p:25,f:24,kh:89,bs:19,gv:440,pm:0,q:"s"},ai:1,n:"Ofengemüse-Quinoa-Bowl mit Tahin-Zitronen-Dressing",t:35,k:"veg",i:[[200,"g","Quinoa","v"],[1,"Stk","Süßkartoffel","g"],[1,"Stk","Zucchini","g"],[2,"Stk","Paprika","g"],[1,"Dose","Kichererbsen","v"],[100,"g","Babyspinat","g"],[1,"Glas","Tahin (Sesammus)","v"],[1,"Stk","Zitrone","g"],[1,"Bund","Petersilie","g"]],m:"Süßkartoffel, Zucchini, Paprika und Kichererbsen mit Öl und Gewürzen 25 Min. im Ofen rösten. Quinoa kochen. Dressing aus Tahin, Zitrone und Wasser rühren. Alles mit Spinat in Schalen anrichten."},
 {id:"s04",N:{kcal:720,p:23,f:27,kh:92,bs:14,gv:130,pm:0,q:"s"},ai:1,kid:1,n:"Vollkornnudeln mit Walnuss-Petersilien-Pesto & Kirschtomaten",t:20,k:"veg",i:[[400,"g","Vollkornnudeln","v"],[75,"g","Walnusskerne","v"],[2,"Bund","Petersilie","g"],[1,"Zehen","Knoblauch","g"],[1,"Stk","Zitrone","g"],[400,"g","Kirschtomaten","g"]],m:"Nudeln kochen. Walnüsse rösten und mit Petersilie, Knoblauch, Zitrone und Olivenöl zu Pesto pürieren. Kirschtomaten halbieren, alles mit etwas Nudelwasser mischen."},
 {id:"s05",N:{kcal:480,p:41,f:12,kh:45,bs:10,gv:130,pm:0,q:"s"},ai:1,kid:1,n:"Forelle aus dem Ofen mit Kräuterkartoffeln & Brokkoli",t:35,k:"fisch",i:[[450,"g","Forellenfilet","f"],[800,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Brokkoli","g"],[1,"Stk","Zitrone","g"],[1,"Bund","Dill","g"],[1,"Bund","Petersilie","g"]],m:"Kartoffeln mit Öl im Ofen rösten. Forellenfilets mit Zitrone und Kräutern die letzten 12 Min. mitgaren. Brokkoli dämpfen. Forelle ist ein Süßwasserfisch und jodärmer als Seefisch."},
 {id:"s06",N:{kcal:480,p:24,f:9,kh:70,bs:16,gv:250,pm:0,q:"s"},ai:1,kid:1,n:"Linsen-Gemüse-Eintopf mit Kurkuma",t:45,k:"veg",i:[[200,"g","Grüne Linsen","v"],[3,"Stk","Karotten","g"],[1,"Stangen","Lauch","g"],[500,"g","Kartoffeln (festkochend)","g"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[1.2,"l","Gemüsebrühe (ohne Jodsalz)","v"],[1,"Bund","Petersilie","g"]],m:"Zwiebel und Knoblauch andünsten, Kurkuma dazu. Linsen, Gemüse und Brühe zugeben und 30 Min. köcheln. Mit Essig, Salz und Petersilie abschmecken."},
 {id:"s07",N:{kcal:520,p:17,f:20,kh:64,bs:9,gv:220,pm:0,q:"s"},ai:1,n:"Buchweizen-Pilz-Pfanne mit Spinat & Walnüssen",t:25,k:"veg",i:[[250,"g","Buchweizen","v"],[400,"g","Champignons","g"],[150,"g","Babyspinat","g"],[1,"Stk","Zwiebel","g"],[2,"Zehen","Knoblauch","g"],[0.5,"l","Gemüsebrühe (ohne Jodsalz)","v"],[50,"g","Walnusskerne","v"],[1,"Bund","Petersilie","g"]],m:"Buchweizen in Brühe garen. Pilze scharf anbraten, Zwiebel und Knoblauch dazu, Spinat unterheben. Mit Buchweizen mischen und mit Walnüssen und Petersilie servieren."},
 {id:"s08",N:{kcal:620,p:43,f:15,kh:76,bs:8,gv:240,pm:0,q:"s"},ai:1,cu:"asia",kid:1,n:"Rindfleisch-Brokkoli-Pfanne mit Ingwer & Reis",t:25,k:"fleisch",i:[[400,"g","Rindersteak (Hüfte)","f"],[250,"g","Basmatireis","v"],[1,"Stk","Brokkoli","g"],[1,"Stk","Paprika","g"],[1,"Bund","Frühlingszwiebeln","g"],[1,"Stk","Ingwer (klein)","g"],[2,"Zehen","Knoblauch","g"],[1,"Stk","Limette","g"],[1,"Pck","Schwarzer Sesam","v"]],m:"Reis kochen. Rindfleisch in Streifen scharf anbraten, herausnehmen. Brokkoli, Paprika, Ingwer und Knoblauch braten, Fleisch zurück, mit Honig, Limette und etwas Wasser glasieren. Ohne Sojasauce (jodarm)."},
 {id:"s09",N:{kcal:440,p:13,f:11,kh:71,bs:8,gv:310,pm:0,q:"s"},ai:1,kid:1,n:"Hirse-Gemüse-Pfanne mit Paprika & Zucchini",t:25,k:"veg",i:[[250,"g","Hirse","v"],[2,"Stk","Paprika","g"],[1,"Stk","Zucchini","g"],[1,"Stk","Zwiebel","g"],[250,"g","Kirschtomaten","g"],[0.5,"l","Gemüsebrühe (ohne Jodsalz)","v"],[1,"Bund","Petersilie","g"],[1,"Stk","Zitrone","g"]],m:"Hirse in Brühe garen. Zwiebel, Paprika und Zucchini anbraten, Tomaten kurz mitgaren. Hirse unterheben, mit Zitrone und Petersilie abschmecken."},
 {id:"s10",N:{kcal:700,p:25,f:39,kh:62,bs:17,gv:440,pm:0,q:"s"},ai:1,kid:1,n:"Kürbis-Linsen-Suppe mit Ingwer",t:35,k:"veg",i:[[1,"Stk","Hokkaido-Kürbis","g"],[150,"g","Rote Linsen","v"],[2,"Stk","Karotten","g"],[1,"Stk","Zwiebel","g"],[1,"Stk","Ingwer (klein)","g"],[1,"l","Gemüsebrühe (ohne Jodsalz)","v"],[1,"Dose","Kokosmilch","v"],[40,"g","Kürbiskerne","v"]],m:"Zwiebel und Ingwer andünsten, Kürbis, Karotten und Linsen mit Brühe 20 Min. kochen. Kokosmilch dazu, pürieren, mit gerösteten Kürbiskernen servieren."},
